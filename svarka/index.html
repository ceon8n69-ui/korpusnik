<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сварщик</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сварщик">
<meta name="application-name" content="Сварщик">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#111;z-index:60;pointer-events:none}
img{max-width:100%}
[hidden]{display:none!important}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: необрутализм мастерской — светлая бумага, чёрные рамки 2px, жёсткие тени, заголовки капсом, оранжевая главная кнопка с чёрным блоком-иконкой */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --soft:#ECEAE4; --ink:#111111; --muted:#5C5C5C; --hair:#D8D5CC;
  --yel:#FF7A1A; --yel-soft:#FFE6D2; --org:#F5B400; --wood:#E3C49A; --on-yel:#111111; --ok:#1F7A45; --danger:#C62A1E; --mark:#111111;
  --fg:var(--ink); --line:var(--hair); --accent:var(--yel); --accent-soft:var(--yel-soft); --sunk:var(--soft);
  --f-d:'Oswald','Arial Narrow',Impact,sans-serif; --f-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'Oswald','Arial Narrow',sans-serif;
  --bw:2px; --sh:4px 4px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#FF8A2E; --yel-soft:#3A2414; --org:#F7BE16; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#FF8A2E; --wood:#6B5233; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#FF8A2E; --yel-soft:#3A2414; --org:#F7BE16; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#FF8A2E; --wood:#6B5233; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 110px;-webkit-font-smoothing:antialiased}
@media (min-width:980px){body{padding-block:16px 48px}}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* верхняя панель */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);cursor:pointer;flex:none}
.ib:hover{background:var(--yel-soft)}
.ib[aria-pressed="true"]{background:var(--yel);color:var(--on-yel)}
.ib.plain{border-color:transparent;background:none}
.pip{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--org);border:2px solid var(--bg)}
.drawer{display:flex;flex-direction:column;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
.drawer button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;border-bottom:var(--bw) solid var(--ink);background:none;font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;text-align:left}
.drawer button:last-child,.drawer a:last-child{border-bottom:0}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:var(--bw) solid var(--ink);font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.drawer a:hover{background:var(--yel-soft);color:var(--ink)}
.drawer button:hover,.drawer button[aria-current="page"]{background:var(--yel);color:var(--on-yel)}

/* заголовок экрана */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero h1{font-family:var(--f-d);font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:.005em;margin:0;text-wrap:balance}
.hero p{margin:10px 0 0;color:var(--ink);opacity:.8;font-size:14px;max-width:60ch}
.sq{position:relative;width:38px;height:38px;flex:none;margin-top:30px}
.sq i{position:absolute;width:19px;height:19px}
.sq i:first-child{left:0;top:0;background:var(--yel)} .sq i:last-child{right:0;bottom:0;background:var(--ink)}
.hero .back{display:flex;gap:12px;align-items:flex-start}

/* раскладка */
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.layout{grid-template-columns:380px minmax(0,1fr);align-items:start}.side{position:sticky;top:12px}}
.side,.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:var(--bw) solid var(--ink);padding:14px}
.card.raise{box-shadow:var(--sh)}
.lbl{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}

/* карточка заказа (как маршрут) */
.route{display:grid;grid-template-columns:14px 1fr auto;gap:0 12px;align-items:start}
.route .pt{width:12px;height:12px;margin-top:4px} .route .pt.a{background:var(--org)} .route .pt.b{background:var(--ink)}
.route .ln{width:2px;margin-left:5px;border-left:2px dashed var(--ink);height:20px}
.route small{display:block;font-size:12px;color:var(--muted)}
.route b{font-weight:600;font-size:15px}
.route .btn{grid-row:1/4;grid-column:3;align-self:center}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
.btn:hover{background:var(--yel-soft)}
.btn.y{background:var(--yel);color:var(--on-yel)}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;align-items:stretch;width:100%;border:var(--bw) solid var(--ink);box-shadow:var(--sh);background:var(--yel);color:var(--on-yel);cursor:pointer;min-height:58px;padding:0;text-align:left}
.cta.o{background:var(--org)}
.cta.w{background:var(--surface);color:var(--ink)}
.cta span{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px;font-family:var(--f-d);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;text-align:center}
.cta i{width:58px;display:grid;place-items:center;background:#111;color:#fff;border-left:var(--bw) solid var(--ink);flex:none}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ctabar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.ctabar .cta{max-width:640px;margin:0 auto}
.cta-desk{display:none}
@media (min-width:980px){.ctabar{display:none}.cta-desk{display:block}}

/* выбор изделия */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 2px 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:6px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.cat[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px) and (max-width:979px){.tpls{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tpl{position:relative;display:flex;gap:9px;align-items:center;padding:9px 10px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:600;line-height:1.2;text-align:left;cursor:pointer;min-width:0}
.tpl svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.tpl[aria-pressed="true"]{background:var(--yel);color:var(--on-yel);box-shadow:var(--sh-s)}
.x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);font-size:13px;line-height:1;cursor:pointer;color:var(--ink)}

/* поля */
.params{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{display:flex;align-items:center;border:var(--bw) solid var(--ink);background:var(--surface)}
.in:focus-within{box-shadow:var(--sh-s)}
.in input,.in select,.in textarea{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 16px var(--f-b);padding:9px 10px;outline:none;font-variant-numeric:tabular-nums}
.in select{font-size:14px;padding-right:4px}
.in .u{padding-right:10px;color:var(--muted);font-size:12px;font-weight:600}
.f.wide{grid-column:1/-1}
.err{margin:10px 0 0;color:var(--danger);font-size:13px;font-weight:600}

/* секции своего корпуса */
.secs{display:flex;flex-direction:column;gap:12px}
.col{border:var(--bw) solid var(--ink)}
.colh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 10px;background:var(--ink);color:var(--bg);font-family:var(--f-d);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.colh button{background:none;border:0;color:var(--bg);cursor:pointer;font-size:12px;font-family:var(--f-b);font-weight:700;padding:4px 6px}
.zone{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) 30px;gap:6px;align-items:end;padding:8px;border-bottom:1px solid var(--hair)}
.zone:last-of-type{border-bottom:0}
.zone .in input,.zone .in select{font-size:14px;padding:7px 7px}
.zone label{font-size:11px;margin-bottom:2px}
.zone .del{height:36px;border:var(--bw) solid var(--ink);background:var(--surface);cursor:pointer;font-weight:700}
.zadd{display:block;width:100%;padding:8px;border:0;border-top:var(--bw) solid var(--ink);background:var(--soft);font-weight:700;font-size:13px;cursor:pointer}
.ztag{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px 0}

/* итог и полоса показателей */
.sum .big{font-family:var(--f-d);font-weight:700;font-size:42px;line-height:1;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.sum .cap{color:var(--muted);font-size:13px;margin-top:4px}
.sumrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--bw) solid var(--ink);background:var(--surface);margin-top:14px}
.stats>div{padding:10px 12px;min-width:0}
.stats>div+div{border-left:1px solid var(--hair)}
.stats dt{font-family:var(--f-d);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--f-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd small{font-size:13px;font-weight:500;margin-left:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border:var(--bw) solid var(--ink);background:var(--surface);font-family:var(--f-d);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--sh-s)}

/* 3D */
.viewer{position:relative;background:var(--soft);border:var(--bw) solid var(--ink);overflow:hidden;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:32px 32px}
.three{height:min(58vh,500px);min-height:320px;touch-action:pan-y}
.three canvas{display:block}
.ovl{position:absolute;left:12px;top:12px;min-width:66px;padding:6px 10px;background:var(--surface);border:var(--bw) solid var(--ink);text-align:center;pointer-events:none}
.ovl b{display:block;font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1}
.ovl span{display:block;font-size:12px;font-weight:600;line-height:1.15}
.vtools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.note{color:var(--muted);font-size:13px;margin:0}

/* панели */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-family:var(--f-d);font-weight:700;font-size:22px;text-transform:uppercase;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.tw{overflow-x:auto;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--bg);background:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
td.id{font-family:var(--f-d);font-weight:700;white-space:nowrap}
tr.sec td{background:var(--soft);font-family:var(--f-d);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
tr.tot td{font-family:var(--f-d);font-weight:700;font-size:17px;background:var(--yel);color:var(--on-yel)}
.sw{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.legend i.f{border-top:2px dashed var(--mark)} .legend i.h{border-top:1px dashed var(--muted)}

/* материал как карточка водителя */
.mats{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.ava{width:52px;height:52px;border-radius:50%;flex:none;border:3px solid var(--yel);box-shadow:inset 0 0 0 3px var(--surface)}
.mcard .who{flex:1;min-width:0}
.mcard b{display:block;font-weight:800;font-size:15px}
.mcard small{display:block;color:var(--muted);font-size:13px}
.plate{display:inline-block;margin-top:4px;padding:1px 7px;border:1.5px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em}

/* чертёж и раскрой */
.draw{overflow-x:auto;background:var(--surface);border:var(--bw) solid var(--ink);padding:8px}
.draw svg{display:block;width:100%;height:auto}
.draw{padding:4px}
.dw text{font-family:var(--f-d);font-weight:500;fill:var(--ink)}
.dw .ttl{font-weight:700;fill:var(--ink)}
.dw .c{fill:var(--surface);stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dw .sf{fill:var(--yel-soft);fill-opacity:.45;stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke}
.dw .fs{fill:var(--wood);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .gl{stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke}
.dw .brk{fill:none;stroke:var(--danger);stroke-width:1.6;vector-effect:non-scaling-stroke}
.dw .mut,.sv .mut{fill:var(--muted)}
.draw+.draw{margin-top:0}
.wline{margin:0;padding:8px 10px;border:var(--bw) solid var(--ink);border-left:8px solid var(--yel);background:var(--yel-soft);font-size:13px;font-weight:600}
.wline+.wline{margin-top:8px}
.warnc{color:var(--danger);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.desc{margin:10px 0 0;font-size:13px;color:var(--muted)}
.dw .hw{fill:var(--hair);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .f{fill:none;stroke:var(--org);stroke-width:1.8;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
.dw .fs{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.dw .mt{fill:var(--ink);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .h{fill:var(--soft);fill-opacity:.5;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.dw .dim line{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .ext{stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.7}
.legend i.f{border-top-color:var(--org)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.sheet{background:var(--surface);border:var(--bw) solid var(--ink);padding:10px;min-width:0}
.sheet svg{display:block;width:100%;height:auto}
.sheet .cap{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.sv .sh{fill:var(--soft);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.sv .pc{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.sv .dv{fill:var(--surface)}
.sv text{font-family:var(--f-d);fill:var(--ink)}
.sv .hatch line{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.warn{color:var(--org);font-size:13px;font-weight:700;margin:0}

/* сборка */
.prog{border:var(--bw) solid var(--ink);background:var(--surface);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.prog small{grid-column:1/-1;font-family:var(--f-d);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.prog b{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.track{position:relative;height:2px;background:var(--ink)}
.track i{position:absolute;left:0;top:-2px;height:6px;background:var(--yel);border:1.5px solid var(--ink)}
.track u{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.stepnav{display:flex;gap:10px}
.stepnav .btn{flex:1;min-height:46px;font-family:var(--f-d);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.stepcard{background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:10px}
.stepcard h3{margin:0}
.stepcard p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border:1.5px solid var(--ink);background:var(--yel-soft);color:var(--ink)}
.chip.ex{cursor:pointer;font:600 12.5px var(--f-b);text-align:left;padding:6px 9px;background:var(--surface)}
.chip.ex:hover{background:var(--yel-soft)}
.btn[aria-pressed="true"]{background:var(--yel);color:var(--on-yel)}
.sub{font-family:var(--f-d);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:var(--bw) solid var(--ink);background:var(--surface)}
.steps li+li{border-top:1px solid var(--hair)}
.steps button{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer;font-size:14px;font-weight:600}
.steps button span{font-family:var(--f-d);font-weight:700;min-width:24px;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--yel);color:var(--on-yel)}
.steps button[aria-current="step"] span{color:var(--on-yel)}
.fxl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fxl li{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;align-items:baseline;font-size:14px}
.fxl .dot{width:12px;height:12px;border-radius:50%;align-self:center;border:1.5px solid var(--ink)}
.fxl b{font-weight:700} .fxl .q{font-family:var(--f-d);font-weight:700;font-size:16px}
.fxl small{grid-column:2/4;color:var(--muted);font-size:12.5px;line-height:1.4}

/* цены, подсказки */
details.prices{background:var(--surface);border:var(--bw) solid var(--ink);padding:12px 14px}
details.prices summary{cursor:pointer;font-family:var(--f-d);font-weight:700;font-size:18px;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:12px}
.pgrid h4{grid-column:1/-1;margin:10px 0 0;font-family:var(--f-d);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.callout{border:var(--bw) solid var(--ink);border-left-width:8px;border-left-color:var(--yel);padding:9px 12px;background:var(--surface);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* заказы */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.olist{display:flex;flex-direction:column;gap:14px}
.ocard{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh);cursor:pointer;text-align:left;width:100%}
.ocard:hover{background:var(--yel-soft)}
.init{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--yel);color:var(--on-yel);font-family:var(--f-d);font-weight:700;font-size:19px;border:var(--bw) solid var(--ink)}
.ocard .who{flex:1;min-width:0}
.ocard b{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .sum2{font-family:var(--f-d);font-weight:700;font-size:20px;white-space:nowrap;text-align:right}
.st{display:inline-block;margin-top:5px;padding:1px 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--ink)}
.st.measure{background:var(--org);color:#111}.st.calc{background:var(--surface)}.st.work{background:var(--yel);color:#111}.st.done{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--bw) solid var(--ink)}
.seg button{padding:10px 4px;border:0;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.seg button+button{border-left:var(--bw) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--ink)}
.item .ic{width:46px;height:46px;flex:none;display:grid;place-items:center;border:var(--bw) solid var(--ink);background:var(--yel-soft)}
.item .ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}
.item .who{flex:1;min-width:0}
.item .p{display:block;margin-top:2px}
.item b{display:block;font-weight:800}
.item small{display:block;color:var(--muted);font-size:12.5px}
.item .p{font-family:var(--f-d);font-weight:700;font-size:18px;white-space:nowrap}
.item .acts{display:flex;gap:6px}
.item .acts .ib{width:38px;height:38px}
.empty{border:var(--bw) dashed var(--ink);padding:22px 16px;text-align:center;background:var(--surface)}
.empty b{display:block;font-family:var(--f-d);font-size:20px;text-transform:uppercase;margin-bottom:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:var(--bw) solid var(--danger);background:var(--surface);font-size:13px;font-weight:700}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.linkdel{align-self:flex-start;background:none;border:0;color:var(--danger);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;text-decoration:underline}

/* нижний лист */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetc{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border:var(--bw) solid var(--ink);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.sheetbg{align-items:center}.sheetc{border-bottom:var(--bw) solid var(--ink);box-shadow:6px 6px 0 var(--ink)}}
.sheetc h2{font-family:var(--f-d);font-weight:700;font-size:28px;text-transform:uppercase;margin:0;line-height:1}
.sheetc .f{display:block}
.pick{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;font-size:13px;font-weight:700;z-index:30;border:var(--bw) solid var(--ink)}
textarea.copy{width:100%;min-height:180px;font:12px var(--f-b);background:var(--surface);color:var(--ink);border:var(--bw) solid var(--ink);padding:8px}
.sync{font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)} .sync.on i{background:var(--ok)}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cardh .btn{min-height:34px;padding:6px 10px;white-space:nowrap}
.sheetc{position:relative}
.sheetx{position:absolute;top:12px;right:12px;width:40px;height:40px;font-size:18px;font-weight:700}
.sheetc h2{padding-right:48px}
.refthumb{position:absolute;right:12px;top:12px;width:92px}
.refthumb button:first-child{display:block;padding:0;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh-s);cursor:pointer;width:100%}
.refthumb img{display:block;width:100%;height:auto}
.refthumb .x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border:var(--bw) solid var(--ink);background:var(--surface);font-weight:700;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== Сварщик: ядро — сортамент, материалы, цены, движок деталей, расчёт ===== */
const r1=Math.round, DEG=Math.PI/180;
function plural(n,a,b,c){const m=n%10,h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;}
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vmul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const vlen=a=>Math.hypot(a[0],a[1],a[2]);
const vnorm=a=>{const l=vlen(a)||1; return vmul(a,1/l);};
const vlerp=(a,b,t)=>vadd(a,vmul(vsub(b,a),t));
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lin=(a,b,n)=>n<2?[a]:Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));

function tube(a,b,t){const I=(b*a**3-(b-2*t)*(a-2*t)**3)/12; SEC[`${a}x${b}x${t}`]={cat:'tube',n:`Труба ${a}×${b}×${t}`,h:a,w:b,kg:ST*(2*t*(a+b)-4*t*t),per:2*(a+b)/1000,I,W:2*I/a};}
[[15,15,1.5],[20,20,1.5],[20,20,2],[25,25,2],[30,30,2],[40,20,2],[40,40,2],[40,40,3],[50,25,2],[50,50,3],[60,30,2],[60,40,2],[60,40,3],[60,60,2],[60,60,3],[80,40,3],[80,60,3],[80,80,3],[100,50,3],[100,100,4],[120,60,4],[120,80,4]].forEach(a=>tube(...a));
function pipe(d,t){const I=Math.PI*(d**4-(d-2*t)**4)/64; SEC[`d${d}x${t}`]={cat:'pipe',round:true,n:`Труба круглая Ø${d}×${t}`,h:d,w:d,kg:ST*Math.PI*(d*t-t*t),per:Math.PI*d/1000,I,W:2*I/d};}
[[20,2],[27,2.8],[32,2.8],[42,3],[48,3],[57,3.5],[76,3.5],[89,3.5],[108,4],[133,4],[159,4.5]].forEach(a=>pipe(...a));
[[25,3],[32,3],[40,4],[50,5],[63,5]].forEach(([a,t])=>{SEC[`L${a}x${t}`]={cat:'angle',n:`Уголок ${a}×${a}×${t}`,h:a,w:a,kg:ST*t*(2*a-t),per:4*a/1000,I:0,W:0};});
[[10,100,46,8.59,174],[12,120,52,10.4,304],[14,140,58,12.3,491],[16,160,64,14.2,747],[20,200,76,18.4,1520]].forEach(([n,h,b,kg,I])=>{SEC['ch'+n]={cat:'channel',n:`Швеллер ${n}`,h,w:b,kg,per:(2*h+4*b)/1000,I:I*1e4,W:I*2e4/h};});
[[20,4],[30,4],[40,4],[50,5]].forEach(([b,t])=>{SEC[`s${b}x${t}`]={cat:'strip',n:`Полоса ${b}×${t}`,h:b,w:t,kg:ST*b*t,per:2*(b+t)/1000,I:0,W:0};});
[10,12,14,16].forEach(a=>{SEC['q'+a]={cat:'rod',n:`Квадрат ${a}`,h:a,w:a,kg:ST*a*a,per:4*a/1000,I:0,W:0};});
[10,12,16].forEach(d=>{SEC['r'+d]={cat:'rod',round:true,n:`Пруток Ø${d}`,h:d,w:d,kg:ST*Math.PI*d*d/4,per:Math.PI*d/1000,I:0,W:0};});
SEC.rail70={cat:'rail',n:'Направляющая 70×60×3,5',h:70,w:60,kg:6.6,per:.26,I:0,W:0,buy:false};

const STEELS={s2:{n:'Лист 2 мм',t:2},s3:{n:'Лист 3 мм',t:3},s4:{n:'Лист 4 мм',t:4},rif4:{n:'Лист рифлёный 4 мм',t:4,kgm2:33},s10:{n:'Лист 10 мм',t:10}};

const FX={weld:{n:'Сварной шов',c:'#FF6A00',tip:'Прихватки по углам → проверка диагоналей и уровня → проварка. Шов зачистить.'},

  hole:{n:'Вырез / отверстие',c:'#111827',tip:'Сверлите или режьте до сварки и покраски.'},
  roller:{n:'Ролик / тележка',c:'#2563EB',tip:'Выставить по уровню, приваривать к закладной только после регулировки.'}};

/* ---- Покупные позиции: название, единица, цена по умолчанию ---- */

/* ---- Проверка сечения на снег (ориентир) ---- */
const SNOW=1.5e-3, SNOW_N=1.0e-3; // Н/мм²: расчётный снег (Кривой Рог) + кровля; нормативный — для прогиба
function spanMax(k,trib){const S=SEC[k]; if(!S||!S.I) return Infinity; return Math.min(Math.sqrt(8*200*S.W/(SNOW*trib)), Math.cbrt(384*2.06e5*S.I/(5*150*SNOW_N*trib)));}
const BEAM_SECS=['40x20x2','40x40x2','60x30x2','60x40x2','60x40x3','60x60x3','80x40x3','80x60x3','100x50x3','80x80x3','120x60x4','100x100x4','120x80x4'];
function checkSpan(c,k,span,trib,what){const L=spanMax(k,trib); if(span<=L) return; const alt=BEAM_SECS.filter(s=>SEC[s].I).sort((a,b)=>SEC[a].kg-SEC[b].kg).find(s=>spanMax(s,trib)>=span);
  c.warn(`${what}: ${SEC[k].n} на пролёте ${r1(span)} мм — слабовато под снег (допустимо ~${r1(L)} мм).${alt?` Рекомендуется не меньше ${SEC[alt].n}.`:' Нужна ферма или промежуточная опора.'}`);}

function ctx(v){
  const c={v,parts:[],fx:[],hw:{},lab:{},notes:[],warns:[],dims:[],info:{},phases:[]};
  c.bar=(sec,p1,p2,o={})=>{const len=vlen(vsub(p2,p1)); const p=Object.assign({kind:'bar',sec,p1,p2,len,ph:'frame',name:SEC[sec].n},o); c.parts.push(p); return p;};
  c.arc=(sec,pts,o={})=>{let len=0; for(let i=1;i<pts.length;i++) len+=vlen(vsub(pts[i],pts[i-1])); const p=Object.assign({kind:'arc',sec,pts,len,ph:'frame',name:'Дуга '+SEC[sec].n,bend:true},o); c.parts.push(p); return p;};
  c.face=(mat,pts,o={})=>{let A=[0,0,0]; for(let i=1;i<pts.length-1;i++) A=vadd(A,vcross(vsub(pts[i],pts[0]),vsub(pts[i+1],pts[0]))); const p=Object.assign({kind:'face',mat,pts,area:vlen(A)/2,ph:'clad',name:'Обшивка'},o); c.parts.push(p); return p;};
  c.box=(mat,x,y,z,sx,sy,sz,o={})=>{const p=Object.assign({kind:'box',mat,x,y,z,sx,sy,sz,ph:'frame',name:'Деталь'},o); c.parts.push(p); return p;};
  c.poly=(mat,poly,y,t,o={})=>{let A=0; for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length]; A+=a[0]*b[1]-b[0]*a[1];} const p=Object.assign({kind:'poly',mat,poly,y,t,area:Math.abs(A)/2,ph:'frame',name:'Деталь'},o); c.parts.push(p); return p;};
  c.blk=(mat,p1,p2,w,h,o={})=>{const p=Object.assign({kind:'blk',mat,p1,p2,w,h,len:vlen(vsub(p2,p1)),ph:'frame',name:'Деталь'},o); c.parts.push(p); return p;};
  c.ghost=(x,y,z,sx,sy,sz,name='Стена')=>{c.parts.push({kind:'ghost',x,y,z,sx,sy,sz,ph:'ghost',name});};
  c.cyl=(mat,x,z,y0,h,d,o={})=>{const p=Object.assign({kind:'cyl',mat,x,z,y0,h,d,ph:'found',name:'Бетон'},o); c.parts.push(p); return p;};
  c.mark=(type,ph,p,hw,q=1)=>{c.fx.push({type,ph,x:p[0],y:p[1],z:p[2]}); if(hw) c.H(hw,q);};
  c.W=(ph,p,n=1)=>{for(let i=0;i<n;i++) c.fx.push({type:'weld',ph,x:p[0],y:p[1],z:p[2]});};
  c.H=(k,q=1)=>{if(q>0) c.hw[k]=(c.hw[k]||0)+q;};
  c.L=(k,q=1)=>{if(q>0) c.lab[k]=(c.lab[k]||0)+q;};
  c.warn=s=>c.warns.push(s); c.note=s=>c.notes.push(s);
  c.dim=(view,a,b,label,off=0)=>c.dims.push({view,a,b,label:String(label),off});
  c.step=(ph,t,d,always,after)=>c.phases.push({ph,t,d,always:!!always,after:!!after});
  // столб: в бетон (dep>0) или на пластину с анкерами
  c.post=(sec,x,z,top,o={})=>{
    const dep=o.dep||0, ph=o.ph||'found';
    const p=c.bar(sec,[x,dep?-(dep-150):0,z],[x,top,z],{name:o.name||'Столб',ph,up:[0,0,1]});
    if(dep){c.cyl('conc',x,z,-dep,dep,o.d||250,{ph}); c.info.footings=(c.info.footings||0)+1;}
    else if(o.plate!==false){c.box('s4',x-100,0,z-100,200,6,200,{ph,name:'Опорная пластина',buyAs:'plate200'}); c.H('plate200'); [[-70,-70],[70,-70],[-70,70],[70,70]].forEach(([a,b])=>c.mark('anchor',ph,[x+a,6,z+b],'anchor12'));}
    return p;
  };
  return c;
}

function normVals(key,vals){
  const v={};
  allParams(key).forEach(p=>{
    let x=vals[p.k]; if(x===undefined||x==='') x=p.def;
    if(p.type==='num'){x=+x; if(!isFinite(x)) x=p.def; x=Math.min(p.max,Math.max(p.min,p.step?Math.round(x/p.step)*p.step:Math.round(x)));}
    else{const o=typeof p.opts==='function'?p.opts(v):p.opts, m=o.find(q=>String(q[0])===String(x)); x=m?m[0]:o.some(q=>q[0]===p.def)?p.def:o[0][0];}
    v[p.k]=x;
  });
  return v;
}

/* ---- Раскрой листа (полосами) ---- */
function packSheets(pieces,Ls=2500,Ws=1250){
  const items=pieces.map(p=>{let a=Math.max(p.a,p.b),b=Math.min(p.a,p.b); return {a,b,n:p.n};}).sort((x,y)=>y.b-x.b||y.a-x.a), sheets=[];
  for(const it of items){let best=null;
    for(const sh of sheets) for(const st of sh.strips) if(st.h>=it.b&&st.used+it.a<=Ls&&(!best||st.h<best.st.h)) best={sh,st};
    if(!best){let sh=sheets.find(s=>s.usedH+it.b<=Ws); if(!sh){sh={strips:[],usedH:0,rects:[]};sheets.push(sh);} const st={y:sh.usedH,h:it.b,used:0}; sh.strips.push(st); sh.usedH+=it.b+3; best={sh,st};}
    best.sh.rects.push({x:best.st.used,y:best.st.y,w:it.a,h:it.b,n:it.n}); best.st.used+=it.a+3;}
  return sheets;
}

function compute(key,vals,P){
  const T=TPL[key], v=normVals(key,vals), c=T.build(v,vals||{});
  c.v=v; c.T=T; c.key=key;
  c.step('paint','Зачистка и покраска',finTxt(v),true);
  const order=T.order||null;
  let phases=c.phases;
  // покраска — перед обшивкой/кровлей/ступенями
  const pi=phases.findIndex(s=>s.ph==='paint'); const paint=phases.splice(pi,1)[0];
  const before=phases.findIndex(s=>s.after||['roof','clad','treads','infill','sheets','deck'].includes(s.ph));
  phases.splice(before<0?phases.length:before,0,paint);
  const used=new Set([...c.parts.map(p=>p.ph),...c.fx.map(f=>f.ph)]);
  c.steps=phases.filter(s=>s.d&&(s.always||used.has(s.ph)));
  const idx={}; c.steps.forEach((s,i)=>idx[s.ph]=i+1);
  c.parts.forEach(p=>p.step=idx[p.ph]||1); c.fx.forEach(f=>f.step=idx[f.ph]||1);
  // металл
  const lines=[]; const add=(sec,name,qty,unit,price)=>{if(qty>0&&isFinite(qty)) lines.push({sec,name,qty,unit,price,sum:qty*price});};
  const bySec={}; c.parts.filter(p=>(p.kind==='bar'||p.kind==='arc')&&SEC[p.sec].buy!==false&&!p.nobuy).forEach(p=>(bySec[p.sec]=bySec[p.sec]||[]).push(p));
  c.metal=[]; let kgAll=0, paintA=0, cuts=0, bends=0;
  Object.entries(bySec).sort((a,b)=>SEC[b[0]].kg-SEC[a[0]].kg).forEach(([k,ps])=>{
    const Sx=SEC[k], byM=P.bym>0&&Sx.kg>=P.bym, stock=byM?12000:6000, lens=[];
    ps.forEach(p=>{const L=Math.ceil(p.cutLen||p.len); if(L<=stock) lens.push(L); else {let r=L; while(r>stock){lens.push(stock); r-=stock;} if(r>0) lens.push(r); p.spliced=true;}});
    const sorted=lens.slice().sort((a,b)=>b-a), bars=[];
    sorted.forEach(L=>{let b=bars.find(b=>b.used+3+L<=stock); if(!b){b={used:-3,cuts:[]}; bars.push(b);} b.used+=3+L; b.cuts.push(L);});
    const tot=lens.reduce((a,b)=>a+b,0)/1000, kgBuy=bars.length*stock/1000*Sx.kg;
    kgAll+=tot*Sx.kg; paintA+=tot*Sx.per; cuts+=lens.length; bends+=ps.filter(p=>p.bend).length;
    const g={}; ps.forEach(p=>{const L=Math.ceil(p.cutLen||p.len); const key=p.name+'|'+L+'|'+(p.cut||''); (g[key]=g[key]||{name:p.name,L,cut:p.cut||'',q:0,sp:p.spliced}).q++;});
    const buyLen=Math.ceil((tot*1000+lens.length*20)/100)/10;
    c.metal.push({k,S:Sx,tot,kg:tot*Sx.kg,kgBuy:byM?buyLen*Sx.kg:kgBuy,bars:byM?[]:bars,byM,buyLen,list:Object.values(g).sort((a,b)=>b.L-a.L)});
    if(byM) add('metal',`${Sx.n} — в размер (порезка на базе)`,buyLen,'м',Sx.kg*P['kg_'+Sx.cat]);
    else add('metal',`${Sx.n} — хлыст 6 м`,bars.length,'шт',stock/1000*Sx.kg*P['kg_'+Sx.cat]);
  });
  // стальной лист
  const sheetsBy={}; c.parts.filter(p=>p.kind==='box'&&STEELS[p.mat]&&!p.buyAs).forEach(p=>{const d=[p.sx,p.sy,p.sz].sort((a,b)=>b-a); (sheetsBy[p.mat]=sheetsBy[p.mat]||[]).push({a:r1(d[0]),b:r1(d[1]),n:p.name});});
  c.parts.filter(p=>p.kind==='blk'&&STEELS[p.mat]&&!p.buyAs).forEach(p=>(sheetsBy[p.mat]=sheetsBy[p.mat]||[]).push({a:r1(p.len),b:r1(Math.max(p.w,p.h)),n:p.name}));
  c.parts.filter(p=>p.kind==='poly'&&STEELS[p.mat]&&p.blankAB&&!p.buyAs).forEach(p=>(sheetsBy[p.mat]=sheetsBy[p.mat]||[]).push({a:r1(p.blankAB[0]),b:r1(p.blankAB[1]),n:p.name}));
  c.sheets=[];
  Object.entries(sheetsBy).forEach(([m,pcs])=>{const SS=STEELS[m], sh=packSheets(pcs), kgm2=SS.kgm2||SS.t*7.85, kg=sh.length*3.125*kgm2; kgAll+=pcs.reduce((s,p)=>s+p.a*p.b/1e6,0)*kgm2; paintA+=pcs.reduce((s,p)=>s+2*p.a*p.b/1e6,0);
    c.sheets.push({m,SS,pcs,sh}); add('metal',`${SS.n} 1250×2500`,sh.length,'лист',kg/sh.length*P.kg_sheet);});
  // дерево
  const woodBy={}; c.parts.filter(p=>p.kind==='box'&&WOOD[p.mat]).forEach(p=>{const d=[p.sx,p.sy,p.sz].sort((a,b)=>b-a), k=p.mat+'|'+Math.round(d[2]); woodBy[k]=(woodBy[k]||0)+d[0]*d[1]/1e6;});
  c.parts.filter(p=>p.kind==='poly'&&WOOD[p.mat]).forEach(p=>{const k=p.mat+'|'+Math.round(p.t); woodBy[k]=(woodBy[k]||0)+(p.blank||p.area)/1e6;});
  c.parts.filter(p=>p.kind==='blk'&&WOOD[p.mat]).forEach(p=>{const k=p.mat+'|'+Math.round(Math.min(p.w,p.h)); woodBy[k]=(woodBy[k]||0)+p.len*Math.max(p.w,p.h)/1e6;});
  let woodA=0; Object.entries(woodBy).forEach(([k,a])=>{const [m,t]=k.split('|'), q=Math.ceil(a*1.1*10)/10; woodA+=a; add('wood',`${WOOD[m].n}${m==='wpc'?'':` — щит / доска ${t} мм`}`,q,'м²',Math.round(P['w_'+m]*clamp(+t/40,.45,1.6)));});
  if(woodA&&!c.info.noOil) add('wood','Масло / лак для дерева (2 стороны)',Math.ceil(woodA*2*10)/10,'м²',P.woil);
  // бетон
  let vol=0; c.parts.filter(p=>p.mat==='conc').forEach(p=>{vol+=p.kind==='cyl'?Math.PI*p.d*p.d/4*p.h/1e9:p.kind==='blk'?p.len*p.w*p.h/1e9:p.kind==='poly'?p.area*p.t/1e9:p.sx*p.sy*p.sz/1e9;});
  if(vol){const q=Math.ceil(vol*1.1*100)/100; add('conc','Бетон М200 — цемент, песок, щебень',q,'м³',P.conc); c.info.concVol=q;}
  // покупные позиции
  Object.entries(c.hw).forEach(([k,q])=>{const h=HW[k]; if(!h) return; const sec=/^(pc|pn|mch|shtak|mesh|twasher|rscrew|ridge|gutter|downpipe|gbracket|pc_)/.test(k)?'clad':/plate|anchor|flange|rebar|gpin/.test(k)?'conc':'hw'; add(sec,h[0],h[1]==='м'||h[1]==='м²'?Math.ceil(q*10)/10:Math.ceil(q),h[1],P[k]);});
  (c.extra||[]).forEach(e=>add(e.sec,e.name,e.qty,e.unit,e.price));
  // расходники
  const welds=c.fx.filter(f=>f.type==='weld').length;
  if(kgAll){add('cons','Электроды 3 мм / проволока',Math.max(1,Math.ceil(kgAll*.013*2)/2),'кг',P.electrode); add('cons','Круги отрезные 125 мм',Math.ceil(cuts/15)+1,'шт',P.disc); add('cons','Круги лепестковые',Math.ceil(welds/50)+1,'шт',P.flap);}
  paintA=Math.ceil(paintA*10)/10;
  if(paintA){
    if(v.fin==='enamel'){add('cons','Грунт ГФ-021',Math.max(.9,Math.ceil(paintA*.11*10)/10),'л',P.primer); add('cons','Эмаль ПФ-115',Math.max(.9,Math.ceil(paintA*.24*10)/10),'л',P.enamel); add('cons','Растворитель',Math.max(.5,Math.ceil(paintA*.05*10)/10),'л',P.solvent);}
    else if(v.fin==='3in1') add('cons','Грунт-эмаль 3в1',Math.max(.75,Math.ceil(paintA*.3*10)/10),'л',P.p3in1);
    else if(v.fin==='hammer') add('cons','Молотковая эмаль',Math.max(.75,Math.ceil(paintA*.3*10)/10),'л',P.hammer);
    else if(v.fin==='heat') add('cons','Термостойкая эмаль 600 °C',Math.max(.4,Math.ceil(paintA*.25*10)/10),'л',P.heatpaint);
    else if(v.fin==='powder') add('svc','Порошковая покраска',paintA,'м²',P.powder);
    if(['enamel','3in1','hammer','heat'].includes(v.fin)) add('labor',LAB.paint[0],paintA,'м²',P.L_paint);
  }
  if(bends) add('svc','Гибка трубы на трубогибе',bends,'шт',P.bend);
  // работа
  Object.entries(c.lab).forEach(([k,q])=>add('labor',LAB[k][0],LAB[k][1]==='шт'||LAB[k][1]==='ступень'?q:Math.ceil(q*10)/10,LAB[k][1],P['L_'+k]));
  if(P.delivery>0) add('labor','Доставка / выезд',1,'',P.delivery);
  // общее
  c.lines=lines; c.welds=welds; c.kg=r1(kgAll); c.paintA=paintA;
  const sum=f=>lines.filter(f).reduce((s,l)=>s+l.sum,0);
  c.matSum=sum(l=>l.sec!=='labor'); c.markup=c.matSum*P.markup/100; c.labSum=sum(l=>l.sec==='labor'); c.total=c.matSum+c.markup+c.labSum;
  // габариты
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  const ext=pt=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],pt[i]); mx[i]=Math.max(mx[i],pt[i]);}};
  c.parts.forEach(p=>{if(p.kind==='bar'||p.kind==='blk'){ext(p.p1);ext(p.p2);} else if(p.kind==='arc'||p.kind==='face') p.pts.forEach(ext); else if(p.kind==='box'){ext([p.x,p.y,p.z]);ext([p.x+p.sx,p.y+p.sy,p.z+p.sz]);} else if(p.kind==='poly') p.poly.forEach(([x,z])=>{ext([x,p.y,z]);ext([x,p.y+p.t,z]);}); else if(p.kind==='cyl'){ext([p.x-p.d/2,p.y0,p.z-p.d/2]);ext([p.x+p.d/2,p.y0+p.h,p.z+p.d/2]);}});
  c.bb={mn,mx}; c.size=c.size||[mx[0]-mn[0],Math.max(0,mx[1]),mx[2]-mn[2]];
  return c;
}

function footTxt(c,v,dep,nPosts,extra=''){
  return dep?`Пробурите ${nPosts} ям Ø250 глубиной ${dep} мм (ниже промерзания), на дно 150 мм щебня. Выставьте столбы по шнуру и уровню — сначала крайние, потом промежуточные — и забетонируйте. Нагружать через 7 дней.${extra}`
    :`Столбы на опорных пластинах 200×200×6 мм, по 4 анкера М12×120 в бетонное основание (стяжка не тоньше 100 мм).${extra}`;
}

function bCanopy1(v){
  const c=ctx(v), L=v.L, eb=ov6(v.L,60), ep=ov6(v.L,100), B=v.B, Hh=Math.max(v.Hh,v.Hl), Hl=Math.min(v.Hh,v.Hl), wall=v.mount==='wall', roof=v.roof;
  const BS=SEC[v.bs], RS=SEC[v.rs], PU=SEC['40x20x2'], dep=v.found==='conc'?1000:0;
  const nP=Math.max(2,Math.ceil(L/v.sp)+1), xs=lin(0,L,nP);
  xs.forEach(x=>{c.post(v.ps,x,B,Hl,{dep}); if(!wall) c.post(v.ps,x,0,Hh,{dep});});
  const zB=wall?BS.w/2:0;
  c.bar(v.bs,[-eb,Hl+BS.h/2,B],[L+eb,Hl+BS.h/2,B],{name:'Балка обвязки',ph:'beams'});

  xs.forEach(x=>{c.W('beams',[x,Hl,B],2); if(!wall) c.W('beams',[x,Hh,0],2);});
  if(wall) for(let x=100;x<=L;x+=600) c.mark('anchor','beams',[x,Hh+BS.h/2,0],'anchor12');
  if(wall) c.ghost(-600,0,-300,L+1200,Hh+700,300,'Стена дома');
  const yTop=Hh+BS.h+RS.h/2, k=(Hl-Hh)/(B-zB), yR=z=>yTop+k*(z-zB);
  const z0=wall?zB:-150, z1=B+v.ov, ang=Math.atan(-k), cosA=Math.cos(ang), n=vnorm([0,1,-k]);
  const rsp=ROOFS[roof].pc?1050:1000, nR=Math.max(2,Math.ceil(L/rsp)+1), xr=lin(0,L,nR);
  xr.forEach(x=>{c.bar(v.rs,[x,yR(z0),z0],[x,yR(z1),z1],{name:'Стропило',ph:'rafters',up:[0,1,0],cut:`${(ang/DEG).toFixed(1)}°`}); c.W('rafters',[x,yR(B)-RS.h/2,B],2); c.W('rafters',[x,yR(zB)-RS.h/2,zB],2);});

    c.bar('40x20x2',[-ep,ce[1],ce[2]],[L+ep,ce[1],ce[2]],{name:'Прогон',ph:'purlins',up:n}); purLen+=L+2*ep; xr.forEach(x=>c.W('purlins',[x,ce[1],ce[2]]));}
  const o2=RS.h/2+PU.h+4, q=(x,z)=>vadd([x,yR(z),z],vmul(n,o2));

  const rtxt=roofBuy(c,roof,{L,slope:sl,purlinLen:purLen});
  if(v.gut==='yes'){const p=q(0,z1); c.box('gutter',-100,p[1]-140,z1-30,L+200,100,120,{ph:'roof',name:'Желоб'}); c.H('gutter',(L+200)/1000); c.H('downpipe',(Hl+400)/1000); c.H('gbracket',Math.ceil((L+200)/600)+1);}
  c.L('canopy',L*B/1e6); c.L('roofinst',(L+200)*sl/1e6); if(dep) c.L('footing',c.info.footings);
  if(ang/DEG<ROOF_MIN[roof]) c.warn(`Уклон ${(ang/DEG).toFixed(1)}° меньше минимального для «${ROOFS[roof].n}» (${ROOF_MIN[roof]}°) — увеличьте разницу высот.`);
  checkSpan(c,v.rs,B-zB,rsp,'Стропила'); checkSpan(c,v.bs,L/(nP-1),(B-zB)/2+v.ov,'Балка обвязки');
  c.dim('side',[0,0,0],[0,Hh,0],`${Hh}`,-1); c.dim('side',[0,0,B],[0,Hl,B],`${Hl}`,1); c.dim('front',[0,0,B],[L/(nP-1),0,B],`шаг ${r1(L/(nP-1))}`,-1);

  c.step('beams','Обвязка',`Балки ${BS.n} длиной ${r1(L+2*eb)} мм — на верх столбов, по 2 шва на узел. ${wall?`Задняя балка — на стену на высоте ${Hh} мм, анкера М12 через каждые 600 мм.`:''} Проверьте уровень и диагонали рамы.`);
  c.step('rafters','Стропила',`${nR} стропил ${RS.n}, длина ${r1(sl)} мм, шаг ${r1(L/(nR-1))} мм${ROOFS[roof].pc?' (под ширину листа 2100 мм, стыки ложатся на стропила)':''}. Уклон ${(ang/DEG).toFixed(1)}°, вынос спереди ${v.ov} мм. Свар к обеим балкам с двух сторон.`);

function bCanopy2(v){
  const c=ctx(v), L=v.L, eb=ov6(v.L,60), ep=ov6(v.L,100), B=v.B, H=v.H, ang=v.ang*DEG, roof=v.roof, ov=v.ov;
  const BS=SEC[v.bs], TC=SEC[v.tc], PU=SEC['40x20x2'], dep=v.found==='conc'?1000:0;
  const nP=Math.max(2,Math.ceil(L/v.sp)+1), xs=lin(0,L,nP);
  xs.forEach(x=>{c.post(v.ps,x,0,H,{dep}); c.post(v.ps,x,B,H,{dep});});
  [0,B].forEach(z=>c.bar(v.bs,[-eb,H+BS.h/2,z],[L+eb,H+BS.h/2,z],{name:'Балка обвязки',ph:'beams'}));
  xs.forEach(x=>{c.W('beams',[x,H,0],2); c.W('beams',[x,H,B],2);});
  const y0=H+BS.h+TC.h/2, tg=Math.tan(ang), f=B/2*tg, np=Math.max(2,Math.round(B/2/900));
  const yT=z=>y0+(z<=B/2?z:B-z)*tg, nT=Math.max(2,Math.ceil(L/v.tsp)+1), xt=lin(0,L,nT);
  const vert=[],diag=[];
  xt.forEach((x,ti)=>{
    const P=(z,y)=>[x,y,z];
    c.bar(v.tc,P(0,y0),P(B,y0),{name:'Ферма: нижний пояс',ph:'trusses',up:[0,1,0]});
    c.bar(v.tc,P(-ov,y0-ov*tg),P(B/2,y0+f),{name:'Ферма: верхний пояс',ph:'trusses',up:[0,1,0],cut:`${v.ang}°`});
    c.bar(v.tc,P(B+ov,y0-ov*tg),P(B/2,y0+f),{name:'Ферма: верхний пояс',ph:'trusses',up:[0,1,0],cut:`${v.ang}°`});
    for(let k=1;k<=np;k++){const zk=k*B/2/np;
      [[zk,(k-1)*B/2/np],[B-zk,B-(k-1)*B/2/np]].forEach(([z,zp],side)=>{
        if(side===1&&k===np) return;
        const vb=c.bar('40x20x2',P(z,y0+TC.h/2),P(z,yT(z)-TC.h/2),{name:'Ферма: стойка',ph:'trusses',up:[1,0,0]}); if(ti===0) vert.push(r1(vb.len));
        c.W('trusses',P(z,y0+TC.h/2)); c.W('trusses',P(z,yT(z)-TC.h/2));
        if(k>=2){const db=c.bar('40x20x2',P(zp,y0+TC.h/2),P(z,yT(z)-TC.h/2),{name:'Ферма: раскос',ph:'trusses',up:[1,0,0]}); if(ti===0) diag.push(r1(db.len)); c.W('trusses',P(zp,y0)); c.W('trusses',P(z,yT(z)));}
      });
    }
    c.W('trusses',P(0,y0),2); c.W('trusses',P(B,y0),2); c.W('trusses',P(B/2,y0+f),2);
    c.W('install',P(0,H+BS.h),2); c.W('install',P(B,H+BS.h),2);
  });
  const sl=(B/2+ov)/Math.cos(ang), ps=PURL[roof], nPu=Math.max(2,Math.ceil((sl-60)/ps)+1); let purLen=0;
  const nL=[0,Math.cos(ang),-Math.sin(ang)], nR=[0,Math.cos(ang),Math.sin(ang)];
  const onL=s=>[0,y0-ov*tg+s*Math.sin(ang),-ov+s*Math.cos(ang)], onR=s=>[0,y0-ov*tg+s*Math.sin(ang),B+ov-s*Math.cos(ang)];
  [[onL,nL],[onR,nR]].forEach(([on,n])=>{for(let i=0;i<nPu;i++){const s=30+i*(sl-60)/(nPu-1), ce=vadd(on(s),vmul(n,TC.h/2+PU.h/2));

  const o2=TC.h/2+PU.h+4;
  [[onL,nL],[onR,nR]].forEach(([on,n])=>{const a=vadd(on(0),vmul(n,o2)), b=vadd(on(sl),vmul(n,o2)); c.face(roof,[[-100,a[1],a[2]],[L+100,a[1],a[2]],[L+100,b[1],b[2]],[-100,b[1],b[2]]],{ph:'roof',name:ROOFS[roof].n});});
  const rtxt=roofBuy(c,roof,{L,slope:sl,sides:2,purlinLen:purLen,ridge:L+200});
  if(v.gut==='yes'){[-ov-60,B+ov-60].forEach(z=>c.box('gutter',-100,y0-ov*tg-150,z,L+200,100,120,{ph:'roof',name:'Желоб'})); c.H('gutter',2*(L+200)/1000); c.H('downpipe',2*(H+400)/1000); c.H('gbracket',2*(Math.ceil((L+200)/600)+1));}
  c.L('canopy',L*B/1e6); c.L('roofinst',2*(L+200)*sl/1e6); if(dep) c.L('footing',c.info.footings);
  if(v.ang<ROOF_MIN[roof]) c.warn(`Уклон ${v.ang}° меньше минимального для «${ROOFS[roof].n}» (${ROOF_MIN[roof]}°).`);
  checkSpan(c,v.bs,L/(nP-1),B/2+ov,'Балка обвязки');
  c.dim('side',[0,0,0],[0,H,0],`${H}`,-1); c.dim('side',[0,y0,B/2],[0,y0+f,B/2],`${r1(f)}`,1);

function bArch(v){
  const c=ctx(v), L=v.L, eb=ov6(v.L,60), ep=ov6(v.L,100), B=v.B, H=v.H, f=Math.min(v.f,B/2), roof=v.roof;

  [0,B].forEach(z=>c.bar(v.bs,[-eb,H+BS.h/2,z],[L+eb,H+BS.h/2,z],{name:'Балка обвязки',ph:'beams'}));
  xs.forEach(x=>{c.W('beams',[x,H,0],2); c.W('beams',[x,H,B],2);});
  const y0=H+BS.h+AS.h/2;
  const circ=fr=>{const R=(B*B/4+fr*fr)/(2*fr), yc=y0+fr-R; return {R,yc,y:z=>yc+Math.sqrt(Math.max(0,R*R-(z-B/2)**2))};};

  const nrm=p=>vnorm([0,p[1]-O.yc,p[2]-B/2]);
  const ps=PURL[roof], nPu=Math.max(3,Math.ceil((arcLen-60)/ps)+1), st=lin(30,arcLen-30,nPu); let purLen=0;
  st.forEach(s=>{const p=at(s), n=nrm(p), ce=vadd(p,vmul(n,AS.h/2+PU.h/2)); c.bar('40x20x2',[-ep,ce[1],ce[2]],[L+ep,ce[1],ce[2]],{name:'Прогон',ph:'purlins',up:n}); purLen+=L+2*ep; xt.forEach(x=>c.W('purlins',[x,ce[1],ce[2]]));});
  const fs=[0,...st,arcLen], o2=AS.h/2+PU.h+4;

function bVisor(v){

  const arm=(x,t)=>[x,Hm-t*drop+Math.sin(t*Math.PI)*bul,10+t*(D-10)];
  xs.forEach(x=>{
    c.bar('40x20x2',[x,Hm-500,10],[x,Hm,10],{name:'Кронштейн: стойка',ph:'frame',up:[0,0,1]});
    if(bul) c.arc('40x20x2',lin(0,1,13).map(t=>arm(x,t)),{name:'Кронштейн: дуга',ph:'frame'}); else c.bar('40x20x2',arm(x,0),arm(x,1),{name:'Кронштейн: консоль',ph:'frame',up:[0,1,0]});
    const pm=arm(x,.55); c.bar('20x20x2',[x,Hm-480,10],pm,{name:'Кронштейн: подкос',ph:'frame',up:[1,0,0]});
    c.W('frame',[x,Hm,10],2); c.W('frame',[x,Hm-480,10]); c.W('frame',pm);
    c.mark('anchor','mount',[x,Hm-420,0],'anchor10'); c.mark('anchor','mount',[x,Hm-80,0],'anchor10');
  });
  c.ghost(-500,0,-250,W+1000,Hm+700,250,'Стена дома');
  const tC=bul?[0,.33,.66,1]:[0,.5,1];
  tC.forEach(t=>{const p=arm(0,t); c.bar('20x20x2',[-30,p[1]+30,p[2]],[W+30,p[1]+30,p[2]],{name:'Поперечина',ph:'frame'}); xs.forEach(x=>c.W('frame',[x,p[1]+20,p[2]]));});
  const tf=bul?lin(0,1,9):[0,1];
  for(let i=0;i<tf.length-1;i++){const a=arm(0,tf[i]), b=arm(0,tf[i+1]); c.face(v.roof,[[-50,a[1]+44,a[2]],[W+50,a[1]+44,a[2]],[W+50,b[1]+44,b[2]],[-50,b[1]+44,b[2]]],{ph:'roof',name:ROOFS[v.roof].n});}
  let armLen=0; lin(0,1,21).forEach((t,i,a)=>{if(i) armLen+=vlen(vsub(arm(0,t),arm(0,a[i-1])));});
  const rtxt=roofBuy(c,v.roof,{L:W-100,slope:armLen+50,purlinLen:(W+60)*tC.length});
  c.L('visor',1);
  c.step('frame','Каркас на столе',`${nb} кронштейна: стойка 40×20 500 мм, ${bul?`дуга 40×20 длиной ${r1(armLen)} мм (подъём ${bul} мм, гнуть на трубогибе)`:`консоль 40×20 ${r1(armLen)} мм`}, подкос 20×20. Соедините поперечинами 20×20 по ${W+60} мм. Проверьте, чтобы все кронштейны были одинаковы — собирайте по первому.`);
  c.step('mount','Монтаж на стену',`Разметьте по уровню линию крепления на высоте ${Hm} мм. По 2 анкера 10×100 на кронштейн (в газоблок — химический анкер).`);
  c.step('roof','Кровля',rtxt);

const MESH_H=[1030,1230,1530,1730,2030,2430];

function infillLeaf(c,{x0,x1,y0,y1,zc,fsH,infill,v,ph='infill',rows=2}){
  const z=zc+fsH/2+1, w=x1-x0, h=y1-y0; let kg=0;
  if(infill==='pn'){const n=Math.ceil(w/1150); c.face('pn8',[[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],{ph,name:'Профнастил С8'}); const m2=n*1.2*h/1000; c.H('pn8',m2); c.H('rscrew',n*rows*5); kg+=m2*4.4;}
  else if(infill==='shtak'){const pitch=118+(v.gap||40), n=Math.ceil(w/pitch); for(let i=0;i<n;i++){const a=x0+i*pitch, b=Math.min(x1,a+118); c.face('shtak',[[a,y0+20,z],[b,y0+20,z],[b,y1,z],[a,y1,z]],{ph,name:'Штакетина'});} c.H('shtak',n*(h-20)/1000); c.H('rscrew',n*rows*2); kg+=n*(h/1000)*.6;}
  else {const pitch=v.pitch||120, n=Math.max(1,Math.floor((w-40)/pitch)); lin(x0+(w-(n-1)*pitch)/2,x1-(w-(n-1)*pitch)/2,n).forEach(x=>{c.bar('20x20x2',[x,y0,zc],[x,y1,zc],{name:'Пика / пруток 20×20',ph,up:[0,0,1]}); c.W(ph,[x,y0,zc]); c.W(ph,[x,y1,zc]);});}
  return kg;
}
function leaf(c,{x0,x1,y0,y1,z=0,fs,rs,infill,v,hingeLeft=true,braces='diag',ph='leaf'}){
  if(x0>x1) [x0,x1]=[x1,x0];
  const FS=SEC[fs], hw=FS.w/2, xa=x0+hw, xb=x1-hw, ya=y0+hw, yb=y1-hw, up=[0,0,1];
  c.bar(fs,[x0,ya,z],[x1,ya,z],{name:'Рама: низ / верх',ph,up,cutLen:x1-x0,cut:'45°'});
  c.bar(fs,[x0,yb,z],[x1,yb,z],{name:'Рама: низ / верх',ph,up,cutLen:x1-x0,cut:'45°'});
  c.bar(fs,[xa,y0,z],[xa,y1,z],{name:'Рама: стойка',ph,up,cutLen:y1-y0,cut:'45°'});
  c.bar(fs,[xb,y0,z],[xb,y1,z],{name:'Рама: стойка',ph,up,cutLen:y1-y0,cut:'45°'});
  [[xa,ya],[xb,ya],[xa,yb],[xb,yb]].forEach(p=>c.W(ph,[p[0],p[1],z],2));
  const nh=(y1-y0)>1900?2:1, hs=lin(ya,yb,nh+2).slice(1,-1);
  hs.forEach(y=>{c.bar(rs,[xa+hw,y,z],[xb-hw,y,z],{name:'Ригель',ph,up}); c.W(ph,[xa,y,z],2); c.W(ph,[xb,y,z],2);});
  if(braces==='diag'&&infill!=='bars'){const hx=hingeLeft?xa:xb, fx=hingeLeft?xb:xa; c.bar(rs,[hx,ya,z],[fx,yb,z],{name:'Раскос',ph,up}); c.W(ph,[hx,ya,z],2); c.W(ph,[fx,yb,z],2);}
  if(braces==='zigzag'){const n=Math.max(2,Math.round((xb-xa)/1100)), xsv=lin(xa,xb,n+1);
    xsv.slice(1,-1).forEach(x=>{c.bar(rs,[x,ya+hw,z],[x,yb-hw,z],{name:'Стойка внутренняя',ph,up}); c.W(ph,[x,ya,z],2); c.W(ph,[x,yb,z],2);});
    for(let i=0;i<n;i++){const a=i%2?[xsv[i],yb,z]:[xsv[i],ya,z], b=i%2?[xsv[i+1],ya,z]:[xsv[i+1],yb,z]; c.bar(rs,a,b,{name:'Раскос',ph,up}); c.W(ph,a); c.W(ph,b);}}
  return infillLeaf(c,{x0,x1,y0,y1,zc:z,fsH:FS.h,infill,v,rows:2+nh});
}
const leafKg=(c,phs)=>r1(c.parts.filter(p=>(p.kind==='bar')&&phs.includes(p.ph)).reduce((s,p)=>s+(p.cutLen||p.len)/1000*SEC[p.sec].kg,0));

function bFence(v){
  const c=ctx(v), L=v.L, t=v.type, conc=v.found==='conc', dep=v.dep;
  const mh=MESH_H.filter(h=>h<=v.H).pop()||1030, H=t==='mesh3d'?mh+50:v.H;
  const sp=t==='mesh3d'?2550:v.sp, nP=Math.max(2,Math.ceil(L/sp)+1), xs=lin(0,L,nP), s=L/(nP-1);
  const ps=t==='mesh3d'?'60x40x2':v.ps, PS=SEC[ps];
  xs.forEach(x=>{if(conc) c.post(ps,x,0,H,{dep,d:200}); else c.bar(ps,[x,-dep,0],[x,H,0],{name:'Столб',ph:'found',up:[0,0,1]});});
  c.H('cap',nP);

  if(t==='pn'||t==='shtak'){

    faces.forEach(sg=>ys.forEach(y=>{for(let i=0;i<nP-1;i++) c.bar('40x20x2',[xs[i],y,sg*(zf+LG.w/2)],[xs[i+1],y,sg*(zf+LG.w/2)],{name:'Лага',ph:'lags',up:[0,1,0]}); xs.forEach(x=>c.W('lags',[x,y,sg*zf],2));}));
    const zc=zf+LG.w;
    if(t==='pn'){const n=Math.ceil(L/1150); for(let i=0;i<n;i++){const a=i*1150-25, b=Math.min(L+25,a+1200); c.face('pn8',[[a,80,zc+1],[b,80,zc+1],[b,H,zc+1],[a,H,zc+1]],{ph:'clad',name:'Профнастил С8'});}
      c.H('pn8',n*1.2*(H-80)/1000); c.H('rscrew',n*rows*5);
      txt=`Профнастил С8: ${n} листов высотой ${H-80} мм (заказывайте в размер), нахлёст 1 волна, зазор от земли 80 мм. Кровельные саморезы 4,8×29 в нижнюю волну, 5 штук на каждую лагу на лист.`;}
    else {const pitch=118+v.gap; let n=0; faces.forEach(sg=>{const off=sg<0?pitch/2:0, k=Math.ceil((L-off)/pitch); n+=k; for(let i=0;i<k;i++){const a=off+i*pitch; c.face('shtak',[[a,100,sg*(zc+1)],[a+118,100,sg*(zc+1)],[a+118,H,sg*(zc+1)],[a,H,sg*(zc+1)]],{ph:'clad',name:'Штакетина'});}});
      c.H('shtak',n*(H-100)/1000); c.H('rscrew',n*rows*2);
      txt=`Евроштакетник: ${n} шт по ${H-100} мм, шаг ${pitch} мм (зазор ${v.gap} мм)${faces.length>1?', шахматкой с двух сторон со смещением на полшага':''}. По 2 самореза на лагу; держите шаг по шаблону-рейке.`;}
  }else if(t==='bars'){

    for(let i=0;i<nP-1;i++){const xa=xs[i]+PS.w/2, xb=xs[i+1]-PS.w/2;
      [150,H-130].forEach(y=>{c.bar('40x20x2',[xa,y,0],[xb,y,0],{name:'Прожилина секции',ph:'lags',up:[0,1,0]}); c.W('lags',[xa,y,0],2); c.W('lags',[xb,y,0],2);});
      const k=Math.max(1,Math.floor((xb-xa)/pitch)), off=(xb-xa-(k-1)*pitch)/2;
      for(let j=0;j<k;j++){const x=xa+off+j*pitch; c.bar('20x20x2',[x,140,0],[x,top?H:H-120,0],{name:'Пика 20×20',ph:'clad',up:[0,0,1]}); c.W('clad',[x,150,0]); c.W('clad',[x,H-130,0]); n++;}}
    if(top) c.H('pika',n);

  }else{
    for(let i=0;i<nP-1;i++) c.face('mesh',[[xs[i]+PS.w/2,50,zf+3],[xs[i+1]-PS.w/2,50,zf+3],[xs[i+1]-PS.w/2,50+mh,zf+3],[xs[i]+PS.w/2,50+mh,zf+3]],{ph:'clad',name:'Панель 3D-сетки'});

  if(t==='pn'||t==='shtak') c.step('lags','Лаги',`${rows} ряда лаг 40×20×2 на лицевую сторону столбов, высоты: ${rows===3?`300, ${r1(H/2)}, ${H-150}`:`300, ${H-150}`} мм. По 2 шва на каждом столбе, по уровню.`);

function bGateSwing(v,kind){
  const c=ctx(v), W=v.W, H=v.H, cl=v.cl, wk=kind==='wicket', lv=wk?1:v.lv, PS=SEC[v.ps], dep=v.dep, g=20;
  const top=cl+H+80;
  c.post(v.ps,-PS.w/2,0,top,{dep,d:wk?250:300,name:'Столб'}); c.post(v.ps,W+PS.w/2,0,top,{dep,d:wk?250:300,name:'Столб'});
  const lw=(W-2*g-(lv-1)*g)/lv; let ikg=0;
  for(let i=0;i<lv;i++){const x0=g+i*(lw+g), x1=x0+lw, hl=lv===1?true:i===0;
    ikg+=leaf(c,{x0,x1,y0:cl,y1:cl+H,fs:v.fs,rs:v.rs,infill:v.infill,v,hingeLeft:hl});
    const nh=H>2000?3:2, hx=hl?x0-g/2:x1+g/2; lin(cl+200,cl+H-200,nh).forEach(y=>{c.mark('hinge','hang',[hx,y,0],wk?'ghinge_s':'ghinge'); c.W('hang',[hx,y,0],2);});}
  const kg=leafKg(c,['leaf','infill'])+ikg;
  if(wk){c.H(v.lock==='yes'?'glock':'lockeye',1); if(v.closer==='yes') c.H('closer',1); c.L('wicket',1); c.mark('hole','hard',[W-60,cl+1000,0]);}
  else{if(lv===2){c.H('latch',2); c.H('gstop',1); c.mark('hole','hard',[W/2,0,0]);} else c.H('latch',1); if(v.lock==='yes') c.H('lockeye',1); if(v.drive==='yes'){c.H('drive_swing',1); c.L('drive',1);} c.L('gate_swing',1);}
  c.L('footing',2);
  const per=r1(kg/lv);
  if(per>220&&!wk) c.warn(`Створка весит ~${per} кг — гаражные петли Ø30 рассчитаны примерно на 200 кг на пару. Поставьте 3 петли или петли Ø40.`);
  if(PS.kg<5&&!wk&&W>3000) c.warn(`Столб ${PS.n} для ворот ${W} мм слабоват — возьмите 80×80×3 или 100×100×4.`);
  c.info.leafKg=per;
  c.note(`Вес ${wk?'калитки':'створки'} около ${per} кг.`);
  const name=wk?'калитки':'ворот';
  c.step('found','Столбы',`Два столба ${PS.n} высотой ${top} мм над землёй: ямы Ø${wk?250:300} на ${dep} мм, бетон. Расстояние между внутренними гранями — строго ${W} мм на уровне низа и верха (проверьте рулеткой). Навешивать через 7–14 дней.`);
  c.step('leaf',wk?'Рама калитки':'Рамы створок',`${lv} ${lv>1?'створки':'полотно'} ${r1(lw)}×${H} мм из ${SEC[v.fs].n}, углы под 45°. Собирайте на ровном столе-стапеле: прихватки → диагонали равны (разница не больше 2 мм) → проварка с двух сторон крест-накрест, чтобы не повело. Ригели и ${v.infill==='bars'?'вертикали':'раскос'} из ${SEC[v.rs].n}${v.infill==='bars'?'':' — раскос от нижней петли к верхнему свободному углу, он держит створку от провисания'}.`);
  if(v.infill==='bars') c.step('infill','Заполнение',`Вертикали 20×20 с шагом ${v.pitch||120} мм, по одному шву сверху и снизу с каждой стороны.`);
  c.step('hang','Петли и навеска',`Петли ${wk?'Ø20':'Ø30'} — по ${H>2000?3:2} на ${wk?'калитку':'створку'}, все на одной оси (приложите уголок по всем петлям). Подложите под створку брусок на высоту ${cl} мм, зазоры по 20 мм, прихватите петли к столбу, проверьте ход, затем проварите.`);
  if(v.infill!=='bars') c.step('infill','Обшивка',v.infill==='pn'?'Профнастил С8 на раму и ригели, кровельные саморезы через волну, по 5 на ригель.':`Штакетник с зазором ${v.gap||40} мм, по 2 самореза на ригель.`);
  c.step('hard','Фурнитура',wk?`${v.lock==='yes'?'Замок врезной: вырез в стойке рамы под корпус замка, ответная планка на столб.':'Проушины под навесной замок.'}${v.closer==='yes'?' Доводчик на верх рамы и столба.':''}`:`${lv===2?'Центральный упор в землю (бетонируется), шпингалеты на обе створки.':'Шпингалет в землю.'}${v.lock==='yes'?' Проушины под замок.':''}${v.drive==='yes'?' Привод — по схеме производителя: кронштейны на столб и створку, кабель в гофре в земле.':''}`);
  return c;
}

function bGateSlide(v){
  const c=ctx(v), W=v.W, H=v.H, cl=v.cl, T=r1(W*v.cw/100), PS=SEC[v.ps], dep=v.dep;
  const X=x=>v.side==='L'?x:W-x, P=(x,y,z)=>[X(x),y,z];
  const top=cl+70+H+80;
  c.post(v.ps,X(-PS.w/2),0,top,{dep,d:300,name:'Столб (откатный)'}); c.post(v.ps,X(W+PS.w/2),0,top,{dep,d:300,name:'Столб (приёмный)'});
  const rl=W+T+150;
  c.bar('rail70',P(-T-100,cl+35,0),P(W+50,cl+35,0),{name:'Направляющая',ph:'leaf',up:[0,1,0]}); c.H('srail',rl/1000);
  const ikg=leaf(c,{x0:X(-100),x1:X(W+50),y0:cl+70,y1:cl+70+H,fs:v.fs,rs:v.rs,infill:v.infill,v,braces:'zigzag'});

  const mx=-T/2-100, my=cl+70+H*.45*((mx+T+100)/T);
  c.bar(v.rs,P(mx,cl+70,0),P(mx,my,0),{name:'Противовес: стойка',ph:'leaf',up:[0,0,1]}); c.W('leaf',P(mx,cl+70,0)); c.W('leaf',P(mx,my,0));
  // фундамент
  const fl=T+400;
  c.bar('ch16',P(-T-250,-80,0),P(150,-80,0),{name:'Закладная: швеллер 16',ph:'found',up:[0,1,0]});
  c.box('conc',Math.min(X(-T-250),X(150)),-1000,-200,fl,1000,400,{ph:'found',name:'Фундамент'});
  c.H('rebar',4*fl/1000+Math.ceil(fl/300)*1.6);
  c.mark('roller','mount',P(-T,0,0)); c.mark('roller','mount',P(-200,0,0));
  c.mark('roller','mount',P(W+50,cl+35,0)); c.mark('roller','mount',P(-PS.w/2,cl+70+H-80,0)); c.mark('roller','mount',P(W+PS.w/2,cl+60,0));
  const kg=leafKg(c,['leaf','infill'])+ikg+rl/1000*6.6;
  c.H(kg<=380?'skit400':kg<=650?'skit700':'skit1000',1);
  if(v.drive==='yes'){c.H('drive_slide',1); c.H('grack',(W+500)/1000); c.L('drive',1);}
  c.L('gate_slide',1); c.L('slfound',1); c.L('footing',2);
  c.info.leafKg=r1(kg); c.note(`Полотно с направляющей весит около ${r1(kg)} кг — комплект роликов подобран по весу.`);
  if(v.cw<35) c.warn('Противовес меньше 35% проёма — ворота будут клевать. Обычно берут 40–50%.');
  c.dim('front',P(-T-100,0,0),P(-100,0,0),`противовес ${T}`,-1);
  c.step('found','Фундамент',`Котлован ${fl}×400 мм глубиной 1000 мм у ${v.side==='L'?'левого':'правого'} столба, в сторону отката. Арматурный каркас Ø12 (4 продольных + хомуты через 300 мм), к нему приварите швеллер 16 длиной ${fl-100} мм полками вверх — верх заподлицо с дорогой, строго в уровень и по линии ворот. Бетон М250. До навески 2–3 недели набора прочности. Столбы ${PS.n}: ямы Ø300 на ${dep} мм.`);
  c.step('leaf','Полотно на стапеле',`Рама ${W+150}×${H} мм из ${SEC[v.fs].n}, внутри стойки и раскосы ${SEC[v.rs].n} зигзагом. Противовес ${T} мм — треугольник из раскоса и направляющей. Направляющую 70×60 длиной ${rl} мм прихватите к низу рамы и обварите прерывистым швом 50 мм через 300 мм — сплошным поведёт. Диагонали рамы равны ±2 мм.`);
  if(v.infill==='bars') c.step('infill','Заполнение',`Вертикали 20×20 с шагом ${v.pitch||120} мм.`);
  c.step('mount','Установка',`Тележки — на швеллер, расстояние между ними ~${T-200} мм (как можно шире в пределах противовеса). Заведите полотно, выставьте по уровню винтами тележек, проверьте ход. Только потом приварите опорные площадки тележек к швеллеру. Концевой ролик — в торец направляющей, верхний улавливатель — на откатный столб, нижний — на приёмный.`);

  if(v.drive==='yes') c.step('hard','Автоматика',`Привод на площадку у откатного столба, зубчатая рейка ${W+500} мм на полотно с зазором 1–2 мм над шестернёй. Настройте концевики.`);
  return c;
}

/* ===== Лестницы и ограждения ===== */
// ось-выровненный брус по локальной системе T(u,y,w)
function boxL(c,mat,T,u0,y0,w0,du,dy,dw,o){const a=T(u0,y0,w0), b=T(u0+du,y0+dy,w0+dw); return c.box(mat,Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.min(a[2],b[2]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),Math.abs(b[2]-a[2]),o);}
const TREAD_OPTS=[['oak','Дуб 40 мм'],['ash','Ясень 40 мм'],['beech','Бук 40 мм'],['larch','Лиственница 40 мм'],['pine','Сосна 40 мм'],['rif4','Рифлёный лист 4 мм'],['wpc','ДПК (улица)']];
const treadName=k=>(TREAD_OPTS.find(o=>o[0]===k)||[0,k])[1];

function flight(c,T,o){
  const {n,h,b,y0,W,kind,ks,tread,tt,nos,riser,ph='kosour',fromLanding}=o;
  const KS=SEC[ks], SUP=SEC['40x40x2'], sh=SUP.h, al=Math.atan(h/b), ca=Math.cos(al), wood=!!WOOD[tread];
  const yTop=u=>y0+(u+20)*h/b-tt-sh, yC=u=>yTop(u)-KS.h/(2*ca);
  const uA=fromLanding?0:Math.max(0,(KS.h/ca+tt+sh)*b/h-20), uB=n*b;
  const ws=kind==='mono'?[W/2]:[KS.w/2,W-KS.w/2];
  ws.forEach(w=>{c.bar(ks,T(uA,yC(uA),w),T(uB,yC(uB),w),{name:kind==='mono'?'Косоур центральный':'Косоур',ph,up:[0,1,0],cut:`${(al/DEG).toFixed(1)}°`});
    if(!fromLanding){boxL(c,'s4',T,uA-60,y0,w-75,180,6,150,{ph,name:'Пластина 150×150',buyAs:'plate150'}); c.H('plate150'); [-40,40].forEach(d=>c.mark('anchor',ph,T(uA,y0+6,w+d),'anchor12'));}
    c.W(ph,T(uA,y0,w),2);});
  for(let k=1;k<=n;k++){
    const u0=(k-1)*b, u1=k*b, yt=y0+k*h;
    if(kind==='mono'){
      const yb=yt-tt-SUP.h/2, um=(k-.5)*b;
      [u0+40,u1-40].forEach(u=>{c.bar('40x40x2',T(u,yb,100),T(u,yb,W-100),{name:'Опора ступени: поперечина',ph:'supports',up:[0,1,0]}); c.W('supports',T(u,yb,W/2),2);});
      c.bar('40x40x2',T(u0+40,yb,W/2),T(u1-40,yb,W/2),{name:'Опора ступени: продольная',ph:'supports',up:[0,1,0]});
      const yS=Math.max(y0,yTop(um)); c.bar('40x40x2',T(um,yS,W/2),T(um,yt-tt-SUP.h,W/2),{name:'Опора ступени: стойка',ph:'supports',up:[0,0,1]}); c.W('supports',T(um,yS,W/2),2); c.W('supports',T(um,yt-tt-SUP.h,W/2),2);
    }else ws.forEach(w=>{
      const yb=yt-tt-sh/2, uf=u0+20+SUP.w/2;
      c.bar('40x40x2',T(u0+20,yb,w),T(u1-20,yb,w),{name:'Столик: полка',ph:'supports',up:[0,1,0]});
      const ys=Math.max(y0,yTop(uf)); c.bar('40x40x2',T(uf,ys,w),T(uf,yt-tt-sh,w),{name:'Столик: стойка',ph:'supports',up:[0,0,1]});
      c.W('supports',T(u1-20,yt-tt-sh,w),2); c.W('supports',T(uf,ys,w),2); c.W('supports',T(uf,yt-tt-sh,w));
      if(yTop(uf)<y0&&!fromLanding) c.mark('anchor','supports',T(uf,y0,w),'anchor12',2);
    });
    if(!wood&&kind!=='mono') [u0+15,u1-15].forEach(u=>{c.bar('L32x3',T(u,yt-tt-16,ws[0]),T(u,yt-tt-16,ws[1]),{name:'Ступень: уголок',ph:'supports',up:[0,1,0]}); c.W('supports',T(u,yt-tt-16,ws[0]),2); c.W('supports',T(u,yt-tt-16,ws[1]),2);});
    boxL(c,tread,T,u0-nos,yt-tt,0,b+nos,tt,W,{ph:'treads',name:'Ступень'});
    if(wood) [[.25,.25],[.75,.25],[.25,.75],[.75,.75]].forEach(([p,q])=>c.mark('bolt','treads',T(u0+p*b,yt-tt,q*W),'tbolt'));
    if(riser) boxL(c,tread,T,u0-nos-20,k===1?y0:y0+(k-1)*h,0,20,k===1?h-tt:h-tt,W,{ph:'treads',name:'Подступенок'});
  }
  return {uA,uB,yC,yTop,al,ws,KS};
}

function railRun(c,{A,B,hrH=900,postBot,infill='bars',hr='d42x3',ph='rail',ps='40x40x2',noStartPost=false,noEndPost=false}){
  const hor=Math.hypot(B[0]-A[0],B[2]-A[2]), nPost=Math.max(2,Math.ceil(hor/1200)+1), ts=lin(0,1,nPost);
  const hs=hr==='wood'?'hrw':hr, HR=SEC[hs], at=t=>vlerp(A,B,t), bot=t=>postBot?postBot(t,at(t)):at(t)[1];
  const dir=vnorm([B[0]-A[0],0,B[2]-A[2]]), side=[-dir[2],0,dir[0]];
  ts.forEach((t,i)=>{if((i===0&&noStartPost)||(i===ts.length-1&&noEndPost)) return; const p=at(t), y1=p[1]+hrH-HR.h/2;
    c.bar(ps,[p[0],bot(t),p[2]],[p[0],y1,p[2]],{name:'Стойка ограждения',ph,up:side}); c.W(ph,[p[0],bot(t),p[2]],2); c.W(ph,[p[0],y1,p[2]]);});
  c.bar(hs,vadd(A,[0,hrH,0]),vadd(B,[0,hrH,0]),{name:hr==='wood'?'Поручень деревянный':'Поручень',ph,up:[0,1,0]});
  const len=vlen(vsub(B,A));
  if(hr==='wood'){c.H('hrwood',len/1000); c.H('hrbracket',nPost);}
  if(infill==='bars'){
    c.bar('20x20x2',vadd(A,[0,100,0]),vadd(B,[0,100,0]),{name:'Нижняя прожилина',ph,up:[0,1,0]});
    const nb=Math.max(1,Math.floor(hor/115)); for(let i=1;i<nb;i++){const t=i/nb; if(ts.some(s=>Math.abs(s-t)*hor<40)) continue; const p=at(t); c.bar('20x20x2',[p[0],p[1]+100,p[2]],[p[0],p[1]+hrH-HR.h/2,p[2]],{name:'Балясина 20×20',ph,up:side}); c.W(ph,[p[0],p[1]+100,p[2]]); c.W(ph,[p[0],p[1]+hrH-HR.h/2,p[2]]);}
  }else if(infill==='horiz'){
    [.22,.44,.66].forEach(f=>{for(let i=0;i<nPost-1;i++){const a=at(ts[i]), b=at(ts[i+1]); c.bar('d20x2',vadd(a,[0,hrH*f,0]),vadd(b,[0,hrH*f,0]),{name:'Ригель Ø20',ph}); c.W(ph,vadd(a,[0,hrH*f,0])); c.W(ph,vadd(b,[0,hrH*f,0]));}});
  }else if(infill==='pn'||infill==='glass'){
    for(let i=0;i<nPost-1;i++){const a=at(ts[i]), b=at(ts[i+1]), o=vmul(side,22); c.face(infill==='pn'?'pn8':'glass',[vadd(a,vadd(o,[0,100,0])),vadd(b,vadd(o,[0,100,0])),vadd(b,vadd(o,[0,hrH-80,0])),vadd(a,vadd(o,[0,hrH-80,0]))],{ph:'clad',name:infill==='pn'?'Профнастил':'Стекло'});}
    const area=hor*(hrH-180)/1e6; if(infill==='pn'){c.H('pn8',area*1.15); c.H('rscrew',Math.ceil(hor/1000*10));} else {c.H('glass',area); c.H('gclamp',(nPost-1)*4);}
  }
  return len/1000;
}

function stairChecks(c,h,b,al,nt){
  const s=2*h+b; c.info.stairs={h:r1(h),b,ang:(al/DEG).toFixed(1),comfort:r1(s),nt};
  if(s<600||s>650) c.warn(`Шаг 2h+b = ${r1(s)} мм — вне зоны удобства 600–650 мм. Поменяйте глубину ступени (сейчас ${b} мм).`);
  if(h>190) c.warn(`Подъём ступени ${r1(h)} мм — крутовато (удобно 150–180 мм). Добавьте ступень или увеличьте длину лестницы.`);
  if(al/DEG>42) c.warn(`Угол ${(al/DEG).toFixed(1)}° — слишком крутая для жилого дома (до 40°).`);
}

function bStair(v,mode){
  const c=ctx(v), porch=mode==='porch', kind=porch?'two':mode, H=v.H, W=v.W;
  const n=Math.max(2,Math.round(H/(porch?160:175))), h=H/n, nt=n-1;
  const b=v.go>0?v.go:clamp(Math.round((630-2*h)/5)*5,250,porch?360:320);
  const wood=!!WOOD[v.tread], tt=wood?40:4, nos=wood?30:0, T=(u,y,w)=>[u,y,w];
  const F=flight(c,T,{n:nt,h,b,y0:0,W,kind,ks:v.ks,tread:v.tread,tt,nos,riser:v.riser==='yes'&&wood});
  const run=nt*b; let railM=0, land=porch?v.land:0;
  if(!porch) c.ghost(run,H-200,-150,1400,200,W+300,'Перекрытие'); else c.ghost(run+v.land,0,-400,250,H+2300,W+800,'Стена дома');
  if(!porch){F.ws.forEach(w=>{boxL(c,'s4',T,run-6,F.yC(run)-60,w-75,6,150,150,{ph:'kosour',name:'Пластина к перекрытию',buyAs:'plate150'}); c.H('plate150'); [-40,40].forEach(d=>c.mark('anchor','kosour',T(run,F.yC(run),w+d),'anchor12'));});}
  else{boxL(c,'conc',T,-250,-400,-100,Math.max(500,F.uA+300),400,W+200,{ph:'found',name:'Опора под косоуры'}); c.L('footing',1);

  const turn=h*2*Math.PI/th, clear=turn-tt-ts-30-60;
  c.L('spiral',nt); if(wood) c.L('tread',nt+(land?1:0)); if(hrLen+topM*1000) c.L('rail',hrLen/1000+topM);
  c.info.stairs={h:r1(h),go:r1(rw*th),ang:(th/DEG).toFixed(1),turn:r1(turn),nt};
  if(clear<1950) c.warn(`Над головой ~${r1(clear)} мм за один виток — меньше 2000 мм. Увеличьте угол ступени или диаметр.`);

  if(rail&&!runs.length) c.note('Ограждение не нужно — лестница со всех сторон у стен. Проём наверху всё равно оградите.');
  c.note(`Проём в перекрытии — ${sq?`квадрат не меньше ${v.D+100}×${v.D+100} мм`:`круг не меньше Ø${v.D+100} мм (или квадрат ${v.D+100}×${v.D+100})`}. Центр стойки — ${R+gapW} мм от стен${walls.length?'':' (если рядом стена)'}. Высоту меряйте от чистого пола внизу до чистого пола наверху — с учётом будущей стяжки, плитки, ламината.`);
  c.size=sq?[v.D,H+1000,v.D]:[v.D,H+1000,v.D];
  const tbl=Array.from({length:Math.min(nt,5)},(_,i)=>`${i+1}: ${r1((v.a0||0)+dir*i*th/DEG)}°, ${r1((i+1)*h-tt-ts)} мм`).join('; ');
  const runTxt=runs.map(r=>`от ${r1(hy(r.ua))} до ${r1(hy(r.ub))} мм`).join(' и ');

  c.step('pole','Основание и стойка',`${foot?'Под стойкой — опора: яма Ø500 на 800 мм, щебень 100 мм, бетон М250 вровень с полом, выдержать 7 дней. ':''}Стойка ${PO.n} длиной ${H+110} мм на пластине 300×300×10 (4 анкера М12), строго по отвесу в двух плоскостях. Верх — кронштейном к перекрытию: анкеры в бетон или шурупы-глухари в деревянную балку.`);

function bRailing(v){
  const c=ctx(v), L=v.L, H=v.H, side=v.mount==='side';
  const len=railRun(c,{A:[0,0,0],B:[L,0,0],hrH:H,postBot:()=>side?-150:0,infill:v.infill,hr:v.hr,ps:v.ps});
  c.ghost(-300,-200,side?-1200:-1150,L+600,200,side?1170:1300,'Плита балкона');
  const nPost=Math.max(2,Math.ceil(L/1200)+1);
  lin(0,L,nPost).forEach(x=>{if(side){c.mark('anchor','rail',[x,-100,-25],'anchor10',2); c.H('plate150');} else {c.box('s4',x-50,-6,-50,100,6,100,{ph:'rail',name:'Фланец',buyAs:'flange'}); c.H('flange');}});
  c.L('rail',len);
  c.step('mark','Разметка',`Длина ${L} мм, ${nPost} стоек с шагом ${r1(L/(nPost-1))} мм. ${side?'Боковой монтаж — к торцу плиты, пластина 150×150 и 2 анкера на стойку.':'Монтаж сверху — фланец 100×100×6 и 4 анкера на стойку, отступ от края плиты не меньше 80 мм.'}`,true);
  c.step('rail','Каркас ограждения',`Стойки ${SEC[v.ps].n} высотой ${H} мм, поручень ${v.hr==='wood'?'деревянный 60×50':SEC[v.hr].n} на высоте ${H} мм. ${v.infill==='bars'?'Балясины 20×20 с шагом ~115 мм между нижней прожилиной и поручнем.':v.infill==='horiz'?'3 горизонтальных ригеля Ø20.':v.infill==='glass'?'Стекло закалённое 8 мм на зажимах, по 4 на панель.':'Профнастил между стойками.'} Высота ограждения балкона — не ниже 1000 мм.`);
  if(v.infill==='pn'||v.infill==='glass') c.step('clad','Заполнение',v.infill==='glass'?'Стёкла заказывайте по месту после сварки каркаса — с зазором 10 мм по периметру.':'Профнастил С8 на саморезы к стойкам и прожилинам.');

}

/* ===== Компактная лестница на опорной стойке: ступени-доски вокруг стойки, тяги к перекрытию ===== */
function bPostStair(v){
  const c=ctx(v), H=v.H, n=Math.max(8,Math.round(H/200)), h=H/n, nt=n-1, around=v.layout==='around', slab=v.slab;
  const wood=!!WOOD[v.tread], tt=wood?40:4, W=v.W, KS=SEC[v.kons], fan=v.tsh==='fan';
  const woodPost=v.post==='wood', PS=woodPost?null:SEC[v.post==='sq80'?'80x80x3':'100x100x4'], pwx=woodPost?100:PS.w, pwz=woodPost?160:PS.h, ph=Math.max(pwx,pwz)/2;
  const sx=!around&&v.dir==='cw'?-1:1, M_=p=>[p[0]*sx,p[1],p[2]]; // поворот «по часовой» у стены — зеркально
  const dirA=v.dir==='ccw'?-1:1;
  // стойка в плане
  const gapW=20, pc=around?[0,0]:[gapW+pwx/2,0];
  // ступени: начало (у стойки или стены), направление, длина
  const T=[]; let th=0, kw=0;
  if(around){
    const R=v.D/2-10, m=Math.max(8,Math.ceil(2*Math.PI/clamp(h*2*Math.PI/2150,18*DEG,36*DEG))); th=v.ang>0?v.ang*DEG:2*Math.PI/m;
    for(let k=1;k<=nt;k++){const f=(+v.a0||0)*DEG+dirA*(k-1)*th, d=[Math.cos(f),Math.sin(f)]; T.push({k,o:[pc[0]+d[0]*(ph+4),pc[1]+d[1]*(ph+4)],d,L:R-ph-4,top:k*h,f,wind:true});}
  }else{
    kw=Math.min(v.kw,nt); const L=v.L, go=clamp(W-40,180,260);
    for(let k=1;k<=kw;k++){const f=(kw>1?(kw-k)/(kw-1):0)*Math.PI/2, d=[Math.cos(f),Math.sin(f)]; T.push({k,o:[pc[0]+d[0]*(ph+4),pc[1]+d[1]*(ph+4)],d,L:L-ph-4-gapW,top:k*h,f,wind:true});}
    for(let j=1;j<=nt-kw;j++) T.push({k:kw+j,o:[0,-j*go],d:[1,0],L,top:(kw+j)*h,f:0,wall:true});
  }
  // контур ступени в плане
  const outline=(t,cut=0)=>{const nrm=[-t.d[1],t.d[0]], wi=fan&&t.wind?W*.5:W, e=[t.o[0]+t.d[0]*(t.L-cut),t.o[1]+t.d[1]*(t.L-cut)];
    return [[t.o[0]+nrm[0]*wi/2,t.o[1]+nrm[1]*wi/2],[e[0]+nrm[0]*W/2,e[1]+nrm[1]*W/2],[e[0]-nrm[0]*W/2,e[1]-nrm[1]*W/2],[t.o[0]-nrm[0]*wi/2,t.o[1]-nrm[1]*wi/2]];};
  T.forEach(t=>{t.poly=outline(t).map(([x,z])=>[x*sx,z]); t.walk=outline(t,around?0:110).map(([x,z])=>[x*sx,z]);});
  // проём: над ступенями, где до перекрытия меньше 2000 мм
  const need=T.filter(t=>t.top>H-slab-2000), bb=ps=>{let a=[1e9,1e9,-1e9,-1e9]; ps.forEach(([x,z])=>{a=[Math.min(a[0],x),Math.min(a[1],z),Math.max(a[2],x),Math.max(a[3],z)];}); return a;};
  const pip=(x,z,ps)=>{let ins=false; for(let i=0,j=ps.length-1;i<ps.length;j=i++){const [xi,zi]=ps[i],[xj,zj]=ps[j]; if((zi>z)!==(zj>z)&&x<(xj-xi)*(z-zi)/(zj-zi)+xi) ins=!ins;} return ins;};
  const dPoly=(x,z,ps)=>Math.min(...ps.map((a,i)=>{const b=ps[(i+1)%ps.length], ab=[b[0]-a[0],b[1]-a[1]], L2=ab[0]*ab[0]+ab[1]*ab[1]||1, t=clamp(((x-a[0])*ab[0]+(z-a[1])*ab[1])/L2,0,1); return Math.hypot(x-a[0]-ab[0]*t,z-a[1]-ab[1]*t);}));
  const inOp=(x,z)=>need.length>0&&(around?Math.hypot(x-pc[0],z-pc[1])<v.D/2+50:need.some(t=>pip(x,z,t.walk)||dPoly(x,z,t.walk)<40));
  const opPts=[]; const all=bb(T.flatMap(t=>t.poly).concat([[pc[0]*sx-ph,pc[1]-ph],[pc[0]*sx+ph,pc[1]+ph]]));
  // окружение: стена (у Г-варианта) и перекрытие с проёмом
  const A=[all[0]-700,all[1]-700,all[2]+700,all[3]+700].map(q=>Math.round(q/50)*50);
  if(!around){const wx=sx>0?-200:0; c.ghost(wx,0,A[1],200,H+300,A[3]-A[1],'Стена');}
  // перекрытие с проёмом: сетка 50 мм → прямоугольники
