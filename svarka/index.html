  if(need.length){const cs=50, nx=Math.ceil((A[2]-A[0])/cs), nz=Math.ceil((A[3]-A[1])/cs), y=H-slab, rows=[];
    for(let j=0;j<nz;j++){const runs=[]; let s0=null; for(let i=0;i<=nx;i++){const solid=i<nx&&!inOp(A[0]+(i+.5)*cs,A[1]+(j+.5)*cs); if(!solid&&i<nx) opPts.push([A[0]+(i+.5)*cs,A[1]+(j+.5)*cs]); if(solid&&s0===null) s0=i; if(!solid&&s0!==null){runs.push([s0,i]); s0=null;}} rows.push(runs);}
    const open=[]; rows.forEach((runs,j)=>runs.forEach(([a,b])=>{const k=open.find(o=>o.a===a&&o.b===b&&o.j1===j); if(k) k.j1=j+1; else open.push({a,b,j0:j,j1:j+1});}));
    open.forEach(o=>c.ghost(A[0]+o.a*cs,y,A[1]+o.j0*cs,(o.b-o.a)*cs,slab,(o.j1-o.j0)*cs,'Перекрытие'));
    if(opPts.length) op=bb(opPts).map((q,i)=>q+(i<2?-cs/2:cs/2));}
  // стойка
  const pX=pc[0]*sx, pZ=pc[1], postIn=inOp(pX,pZ)||!need.length, pTop=postIn?Math.min(H+900,T[T.length-1].top+1000):H-slab;
  if(woodPost) c.blk(wood?v.tread:'beech',[pX,0,pZ],[pX,pTop,pZ],pwx,pwz,{name:'Стойка: клеёный брус 100×160',ph:'post'});
  else{c.bar(v.post==='sq80'?'80x80x3':'100x100x4',[pX,10,pZ],[pX,pTop,pZ],{name:'Опорная стойка',ph:'post',up:[0,0,1]}); c.W('post',[pX,10,pZ],2);}
  const foot=v.base==='footing';
  if(foot){c.cyl('conc',pX,pZ,-800,800,500,{ph:'post',name:'Опора под стойку'}); c.L('footing',1);}
  c.box('s10',pX-150,0,pZ-150,300,10,300,{ph:'post',name:'Пластина стойки 300×300×10',buyAs:'plate300'}); c.H('plate300');
  [[-110,-110],[110,-110],[-110,110],[110,110]].forEach(([a,b])=>c.mark('anchor','post',[pX+a,10,pZ+b],'anchor12'));
  if(!postIn) c.mark('anchor','post',[pX,H-slab,pZ],'anchor12',2);
  if(!around) [H*.35,H*.7].forEach(y=>{c.bar('L40x4',[sx>0?0:0,y,pZ],[pX-sx*pwx/2,y,pZ],{name:'Кронштейн стойки к стене',ph:'post',up:[0,1,0]}); c.mark('anchor','post',[0,y,pZ],'anchor10',2);});
  // ступени и опоры под ними
  let welds=0;
  T.forEach(t=>{
    const y=t.top-tt, P2=(r,dy)=>M_([t.o[0]+t.d[0]*r,y+dy,t.o[1]+t.d[1]*r]);
    if(t.wall){c.bar('L50x5',P2(0,-25),P2(t.L*.65,-25),{name:'Кронштейн ступени к стене',ph:'kons',up:[0,1,0]}); c.mark('anchor','kons',P2(0,-25),'anchor10',2);}
    else{
      const yc=-KS.h/2; c.bar(v.kons,P2(0,yc),P2(t.L*.82,yc),{name:'Консоль ступени',ph:'kons',up:[0,1,0]});
      if(!woodPost){c.W('kons',P2(0,yc),2); welds++;}
      else c.mark('bolt','kons',P2(0,yc),'tbolt',2);
      c.bar('25x25x2',woodPost?P2(0,yc-260):P2(-4,yc-260),P2(t.L*.42,yc-KS.h/2),{name:'Консоль: подкос',ph:'kons',up:[0,1,0]});
      if(!woodPost) c.W('kons',P2(0,yc-260)); c.W('kons',P2(t.L*.42,yc-KS.h/2));
    }
    if(wood){
      if(fan&&t.wind) c.poly(v.tread,t.poly,y,tt,{ph:'treads',name:'Ступень забежная (трапеция)'});
      else c.blk(v.tread,P2(0,tt/2),P2(t.L,tt/2),W,tt,{ph:'treads',name:t.wind?'Ступень забежная':'Ступень'});
      c.mark('bolt','treads',P2(t.L*.4,tt),'tbolt',2);
    }else{
      c.poly('rif4',t.poly,y,tt,{ph:'kons',name:'Ступень: рифлёный лист 4 мм'});
      const nrm=[-t.d[1],t.d[0]]; [-1,1].forEach(s=>{const off=[nrm[0]*s*(W/2-20),nrm[1]*s*(W/2-20)], Q=r=>M_([t.o[0]+t.d[0]*r+off[0],y-20,t.o[1]+t.d[1]*r+off[1]]); c.bar('s40x4',Q(10),Q(t.L-10),{name:'Ступень: борт 40×4',ph:'kons',up:[0,1,0]});});
      c.W('kons',P2(t.L*.5,0),4);
    }
  });
  // тяги: вертикаль у наружного края; одна тяга проходит через все ступени над одной точкой
  const rods=v.rods!=='none', rodSec=v.rods==='inox'?'r12':'r16'; let rodM=0, rodN=0, ceilN=0, legN=0;
  if(rods){
    const groups=[];
    T.forEach(t=>{const p=M_([t.o[0]+t.d[0]*(t.L-45),0,t.o[1]+t.d[1]*(t.L-45)]); let g=groups.find(g=>Math.hypot(g.x-p[0],g.z-p[2])<25); if(!g){g={x:p[0],z:p[2],ts:[]}; groups.push(g);} g.ts.push(t);});
    groups.forEach(g=>{g.ts.sort((a,b)=>a.top-b.top); const lo=g.ts[0], hi=g.ts[g.ts.length-1];
      const toCeil=!inOp(g.x,g.z), toFloor=lo.top<=(toCeil?450:1000);
      const y0=toFloor?0:lo.top-tt, y1=toCeil?H-slab:hi.top; if(y1-y0<tt+60) return;
      c.bar(rodSec,[g.x,y0,g.z],[g.x,y1,g.z],{name:toCeil?'Тяга к перекрытию':toFloor?'Тяга-опора в пол':'Тяга между ступенями',ph:'rods',up:[0,1,0],...(v.rods==='inox'?{nobuy:1,inox:1}:{})});
      rodM+=(y1-y0)/1000; rodN++; if(toCeil){ceilN++; c.mark('anchor','rods',[g.x,H-slab,g.z]);} if(toFloor){legN++; c.mark('anchor','rods',[g.x,0,g.z]);}
      g.ts.forEach(t=>c.mark('hole','rods',[g.x,t.top,g.z]));});
    if(v.rods==='inox') c.H('rodinox',Math.ceil(rodM*10)/10);
    c.H('chemanc',ceilN+legN); c.L('rodmount',rodN);
  }
  // работа
  c.L('poststair',nt); if(wood) c.L('tread',nt);
  // геометрия и проверки
  const rw=ph+.6*(around?v.D/2-ph:v.L-ph), goW=around?rw*th:clamp(W-40,180,260);
  c.info.stairs={h:r1(h),go:r1(goW),ang:around?(th/DEG).toFixed(1):(90/Math.max(1,kw-1)).toFixed(1),...(around?{turn:r1(h*2*Math.PI/th)}:{}),nt};
  if(around&&h*2*Math.PI/th-tt-60<1950) c.warn(`Над головой за один виток ~${r1(h*2*Math.PI/th-tt-60)} мм — меньше 2000. Уменьшите угол ступени.`);
  if(h>225) c.warn(`Подъём ступени ${r1(h)} мм — круто (удобно 180–210). Для компактной лестницы допустимо до 220–225 мм.`);
  if(goW<180) c.warn(`Глубина ступени на линии хода ${r1(goW)} мм — мелко. Увеличьте ${around?'диаметр или угол ступени':'ширину ступени'}.`);
  if(!rods&&(around?v.D/2:v.L)>750) c.warn('Без тяг ступень длиннее 750 мм держится только на консоли — берите консоль 60×40×3 и подкос, ступень будет пружинить у края.');
  if(rods&&ceilN) c.note(`Тяги к перекрытию (${ceilN} шт) — только в бетон или в балку перекрытия, на химанкер М12. В гипсокартон и пустотку без закладных нельзя.`);
  if(op) c.note(around?`Проём в перекрытии — круг не меньше Ø${v.D+100} мм или квадрат ${v.D+100}×${v.D+100}.`:`Проём в перекрытии не меньше ${r1(op[2]-op[0])}×${r1(op[3]-op[1])} мм — над зоной прохода, где до потолка меньше 2 м. Наружные концы ступеней остаются под перекрытием — на них висят тяги.`);
  c.dim('front',[all[0],0,all[1]],[all[0],H,all[1]],H,-1);
  c.size=[all[2]-all[0],Math.max(H,pTop),all[3]-all[1]];
  // шаги
  const ang=T.slice(0,Math.min(around?5:Math.max(2,kw),T.length)).map(t=>`${t.k}: ${around?`угол ${r1(((t.f/DEG)%360+360)%360)}°`:t.wind?`поворот ${r1(90-t.f/DEG)}°`:'вдоль стены'}, верх ${r1(t.top)} мм`).join('; ');
  c.step('mark','Расчёт и разметка',`Высота ${H} мм (чистый пол — чистый пол) → ${n} подъёмов по ${r1(h)} мм: ${nt} ступеней${around?`, поворот ${(th/DEG).toFixed(1)}° на ступень ${v.dir==='ccw'?'против':'по'} часовой`:`: ${kw} забежных вокруг стойки и ${nt-kw} прямых вдоль стены, поворот ${v.dir==='ccw'?'против':'по'} часовой`}. Первые ступени: ${ang}.`,true);
  c.step('post','Стойка',`${foot?'Под стойкой — бетонная опора Ø500 на 800 мм. ':''}${woodPost?'Клеёный брус 100×160':'Труба '+(v.post==='sq80'?'80×80×3':'100×100×4')} на пластине 300×300×10, 4 анкера М12, строго по отвесу в двух плоскостях.${!around?' К стене — 2 кронштейна из уголка 40×4 на анкерах 10×100.':''}${postIn?'':' Верх — к перекрытию 2 анкерами.'}`);
  c.step('kons','Консоли',`${T.filter(t=>!t.wall).length} консолей из ${KS.n.toLowerCase()} длиной ${r1((around?v.D/2-ph-14:v.L-ph-24)*.82)} мм${woodPost?' — на болтах М10 к брусу':' — привариваются к стойке'} на высоте «верх ступени − ${tt} мм», под каждой подкос 25×25. Угол каждой следующей — по таблице разметки, проверяйте транспортиром или шаблоном из фанеры.${!around?` Прямые ступени — на уголки 50×5 к стене, по 2 анкера.`:''}`);
  c.step('treads','Ступени',wood?`${nt} ${plural(nt,'ступень','ступени','ступеней')} — ${WOOD[v.tread].n.toLowerCase()} 40 мм, ${fan?'забежные трапецией, ':''}${W} мм шириной. Масло или лак до монтажа, к консолям — мебельными болтами М8 снизу.`:`Ступени из рифлёного листа 4 мм с бортами 40×4 — привариваются к консолям.`,false,true);
  if(rods) c.step('rods','Тяги',`${rodN} ${plural(rodN,'тяга','тяги','тяг')} ${v.rods==='inox'?'из нержавейки Ø12 с резьбой М12':'из прутка Ø16'} вертикально у наружного края ступеней: сверлите ступени насквозь Ø${v.rods==='inox'?13:17} мм по отвесу${ceilN?`, ${ceilN} — к перекрытию на химанкер`:''}${legN?`, ${legN} — в пол`:''}. Гайки с шайбами над и под каждой ступенью — ими выставляется уровень.`,false,true);
  return c;
}

/* ===== Решётки, мангал, теплица, дровница, верстак, беседка ===== */
function clipLine(p,d,x0,x1,y0,y1){let t0=-1e9,t1=1e9;
  for(const [dd,pp,lo,hi] of [[d[0],p[0],x0,x1],[d[1],p[1],y0,y1]]){if(Math.abs(dd)<1e-9){if(pp<lo||pp>hi) return null;} else {let a=(lo-pp)/dd,b=(hi-pp)/dd; if(a>b)[a,b]=[b,a]; t0=Math.max(t0,a); t1=Math.min(t1,b);}}
  return t1-t0>20?[[p[0]+d[0]*t0,p[1]+d[1]*t0],[p[0]+d[0]*t1,p[1]+d[1]*t1]]:null;}
function segX(a,b){const d1=[a[1][0]-a[0][0],a[1][1]-a[0][1]], d2=[b[1][0]-b[0][0],b[1][1]-b[0][1]], den=d1[0]*d2[1]-d1[1]*d2[0]; if(Math.abs(den)<1e-9) return null;
  const t=((b[0][0]-a[0][0])*d2[1]-(b[0][1]-a[0][1])*d2[0])/den, u=((b[0][0]-a[0][0])*d1[1]-(b[0][1]-a[0][1])*d1[0])/den; return t>.02&&t<.98&&u>.02&&u<.98?[a[0][0]+d1[0]*t,a[0][1]+d1[1]*t]:null;}

function bGrille(v){
  const c=ctx(v), W=v.W, H=v.H, FR=SEC[v.fr], fw=FR.w, up=[0,0,1], s=v.stp, a=fw/2;
  c.bar(v.fr,[0,a,0],[W,a,0],{name:'Рама',ph:'frame',up,cutLen:W,cut:'45°'}); c.bar(v.fr,[0,H-a,0],[W,H-a,0],{name:'Рама',ph:'frame',up,cutLen:W,cut:'45°'});
  c.bar(v.fr,[a,0,0],[a,H,0],{name:'Рама',ph:'frame',up,cutLen:H,cut:'45°'}); c.bar(v.fr,[W-a,0,0],[W-a,H,0],{name:'Рама',ph:'frame',up,cutLen:H,cut:'45°'});
  [[a,a],[W-a,a],[a,H-a],[W-a,H-a]].forEach(p=>c.W('frame',[p[0],p[1],0],2));
  const x0=fw,x1=W-fw,y0=fw,y1=H-fw, fam={A:[],B:[]};
  const evenly=(lo,hi)=>{const n=Math.max(1,Math.floor((hi-lo)/s)); const off=(hi-lo-(n-1)*s)/2; return Array.from({length:n},(_,i)=>lo+off+i*s);};
  if(v.pat==='vert'||v.pat==='grid') evenly(x0,x1).forEach(x=>fam.A.push([[x,y0],[x,y1]]));
  if(v.pat==='grid') evenly(y0,y1).forEach(y=>fam.B.push([[x0,y],[x1,y]]));
  if(v.pat==='diamond'){const st=s*Math.SQRT2; for(let k=-(y1-y0);k<x1-x0;k+=st){const sg=clipLine([x0+k,y0],[1,1],x0,x1,y0,y1); if(sg) fam.A.push(sg);} for(let k=st/2;k<(x1-x0)+(y1-y0);k+=st){const sg=clipLine([x0+k,y0],[-1,1],x0,x1,y0,y1); if(sg) fam.B.push(sg);}}
  if(v.pat==='sun'){const cx=W/2, nr=Math.max(5,Math.round(W/160)), r=Math.min(W/2-fw,H-fw)*.32;
    lin(15,165,nr).forEach(g=>{const d=[Math.cos(g*DEG),Math.sin(g*DEG)], sg=clipLine([cx+d[0]*r,y0+d[1]*r],d,x0,x1,y0,y1); if(sg) fam.A.push([[cx+d[0]*r,y0+d[1]*r],sg[1]]);});
    c.arc(v.bs,lin(0,180,13).map(g=>[cx+r*Math.cos(g*DEG),y0+r*Math.sin(g*DEG),0]),{name:'Полукруг',ph:'pattern'});}
  let nb=0;
  [...fam.A,...fam.B].forEach(([p,q])=>{c.bar(v.bs,[p[0],p[1],0],[q[0],q[1],0],{name:SEC[v.bs].n,ph:'pattern',up}); c.W('pattern',[p[0],p[1],0]); c.W('pattern',[q[0],q[1],0]); nb++;});
  let xw=0; fam.A.forEach(a2=>fam.B.forEach(b2=>{const p=segX(a2,b2); if(p&&xw<500){c.W('pattern',[p[0],p[1],0]); xw++;}}));
  const lugY=H>1000?[H*.2,H*.8]:[H/2]; let lugs=0;
  lugY.forEach(y=>[[0,-70],[W,W+70]].forEach(([xa,xb])=>{c.bar('s40x4',[xa,y,0],[xb,y,0],{name:'Ушко крепления',ph:'install',up:[0,0,1]}); c.W('install',[xa,y,0],2); c.mark('anchor','install',[(xa+xb)/2+(xb>xa?10:-10),y,0],'anchor10'); lugs++;}));
  if(v.open==='yes'){c.H('ghinge_s',2); c.H('lockeye',1); [H*.2,H*.8].forEach(y=>c.mark('hinge','install',[-10,y,0]));}
  c.L('grille',Math.max(1,W*H/1e6)); c.L('grille_inst',1);
  c.step('frame','Рама',`Рама ${W}×${H} мм из ${FR.n}, углы под 45°. Собирайте на ровном столе, диагонали равны ±2 мм.`);
  c.step('pattern','Узор',`${({vert:'Вертикальные прутья',grid:'Клетка',diamond:'Ромб (прутья под 45°)',sun:'Солнце: лучи от полукруга'})[v.pat]} из ${SEC[v.bs].n}, шаг ${s} мм: ${nb} прутков${xw?`, ${xw} пересечений — каждое проварить`:''}. Разметьте шаг мелом на раме и варите от центра к краям.`);
  c.step('install','Установка',`${lugs} ушек из полосы 40×4 — в откос окна, анкер 10×100 через каждое. ${v.open==='yes'?'Распашная: 2 петли Ø20 слева и проушины под замок справа — откроется изнутри при пожаре.':'Глухая решётка: держите зазор от рамы окна 30–50 мм, чтобы открывались створки.'}`);
  return c;
}

function bBBQ(v){

  c.box(m,0,yb,t,t,Hb,Wd-2*t,{ph:'box',name:'Стенка торцевая'}); c.box(m,L-t,yb,t,t,Hb,Wd-2*t,{ph:'box',name:'Стенка торцевая'});
  [[0,0],[L,0],[0,Wd],[L,Wd]].forEach(([x,z])=>{c.W('box',[x,yb+Hb/2,z],2); c.W('box',[x,yb,z]);}); [[L/2,0],[L/2,Wd]].forEach(([x,z])=>c.W('box',[x,yb,z]));
  const slots=Math.floor((L-60)/70), holes=Math.floor((L-100)/70);
  for(let i=0;i<holes;i+=3){c.mark('hole','box',[50+i*70,yb+35,Wd]); c.mark('hole','box',[50+i*70,yb+35,0]);}
  const lx=[-lw/2,L+lw/2], lz=[-lw/2,Wd+lw/2];
  lx.forEach(x=>lz.forEach(z=>{c.bar(v.lg,[x,0,z],[x,yb+Hb*.6,z],{name:'Ножка',ph:'legs',up:[0,0,1]}); c.W('legs',[x,yb+20,z],2); c.W('legs',[x,yb+Hb*.5,z],2);}));
  if(v.shelf==='yes'){[[-lw/2,L+lw/2]].forEach(()=>{[-lw/2,Wd+lw/2].forEach(z=>c.bar('20x20x2',[-lw/2,250,z],[L+lw/2,250,z],{name:'Полка: обвязка',ph:'legs'})); [-lw/2,L+lw/2].forEach(x=>c.bar('20x20x2',[x,250,-lw/2],[x,250,Wd+lw/2],{name:'Полка: обвязка',ph:'legs'}));});
    c.box('s2',0,260,0,L,2,Wd,{ph:'legs',name:'Полка'}); lx.forEach(x=>lz.forEach(z=>c.W('legs',[x,250,z],2)));}
  const sides=v.side==='two'?[-1,1]:v.side==='one'?[1]:[];
  sides.forEach(sg=>{const xa=sg>0?L+lw:-lw, xb=xa+sg*400, yt=wh-60;
    [-lw/2,Wd+lw/2].forEach(z=>{c.bar('25x25x2',[xa,yt,z],[xb,yt,z],{name:'Столик: рама',ph:'tables'}); c.bar('25x25x2',[xb,0,z],[xb,yt,z],{name:'Столик: ножка',ph:'tables',up:[0,0,1]}); c.W('tables',[xa,yt,z],2); c.W('tables',[xb,yt,z],2); c.W('tables',[xb,250,z]);});
    c.bar('25x25x2',[xb,yt,-lw/2],[xb,yt,Wd+lw/2],{name:'Столик: рама',ph:'tables'}); c.bar('25x25x2',[xb,250,-lw/2],[xb,250,Wd+lw/2],{name:'Столик: связь',ph:'tables'});
    c.box('pine',Math.min(xa,xb),yt+12,-lw/2-20,400,30,Wd+lw+40,{ph:'tables',name:'Столешница из доски'});});
  if(v.roof==='yes'){

    [[Z0,2250],[Z1,2100]].forEach(([z,h])=>c.bar('40x40x2',[X0-100,h+20,z],[X1+100,h+20,z],{name:'Крыша: балка',ph:'roof'}));
    lin(X0,X1,3).forEach(x=>{c.bar('40x20x2',[x,2290,Z0-150],[x,2140,Z1+150],{name:'Крыша: стропило',ph:'roof'}); c.W('roof',[x,2270,Z0],2); c.W('roof',[x,2120,Z1],2);});
    c.face('pn20',[[X0-150,2305,Z0-150],[X1+150,2305,Z0-150],[X1+150,2155,Z1+150],[X0-150,2155,Z1+150]],{ph:'roof',name:'Профнастил'});

  return c;
}

function bGH(v){
  const c=ctx(v), L=v.L, W=v.W, Hg=v.Hg, AS=SEC[v.as], pc='pc'+v.pc, y0=40, a=W/2, bb=Hg-y0;
  [0,W].forEach(z=>c.bar('40x40x2',[0,20,z],[L,20,z],{name:'Основание',ph:'base'})); [0,L].forEach(x=>c.bar('40x40x2',[x,20,0],[x,20,W],{name:'Основание',ph:'base'}));
  [[0,0],[L,0],[0,W],[L,W]].forEach(([x,z])=>c.W('base',[x,20,z],2));
  for(let x=500;x<L;x+=1000){c.mark('anchor','base',[x,0,0],'gpin'); c.mark('anchor','base',[x,0,W],'gpin');}
  const E=t=>[0,y0+bb*Math.sin(t),a-a*Math.cos(t)], Nn=t=>vnorm([0,a*Math.sin(t),-bb*Math.cos(t)]);

  tr.forEach(t=>{const ce=vadd(E(t),vmul(Nn(t),AS.h/2+10)); c.bar('20x20x2',[-50,ce[1],ce[2]],[L+50,ce[1],ce[2]],{name:'Продольная связь',ph:'purlins',up:Nn(t)}); purLen+=L+100; xs.forEach(x=>c.W('purlins',[x,ce[1],ce[2]]));});

    if(ei===0&&v.door==='yes'){c.bar('40x20x2',[x,1880,jz[0]],[x,1880,jz[1]],{name:'Торец: перемычка двери',ph:'ends'}); [[W/2-400,W/2+400]].forEach(([za,zb])=>{[[40,40],[1840,1840]].forEach(([ya])=>c.bar('20x20x2',[x+15,ya,za],[x+15,ya,zb],{name:'Дверь: рама',ph:'ends'})); [za,zb].forEach(z=>c.bar('20x20x2',[x+15,40,z],[x+15,1840,z],{name:'Дверь: рама',ph:'ends',up:[1,0,0]}));});
      [500,1500].forEach(y=>c.mark('hinge','ends',[x+15,y,W/2-410],'dhinge')); c.H('dhandle',1);}
    if(v.vent==='yes'){const vy=Math.min(Hg-250,1950), vz=W/2; c.bar('20x20x2',[x+15,vy,vz-300],[x+15,vy,vz+300],{name:'Форточка: рама',ph:'ends'}); c.bar('20x20x2',[x+15,vy-450,vz-300],[x+15,vy-450,vz+300],{name:'Форточка: рама',ph:'ends'}); c.H('dhinge',2); c.H('dhandle',1); c.mark('hinge','ends',[x+15,vy,vz]);}

  c.step('roof','Поликарбонат',rtxt+` Торцы теплицы: ${Math.ceil(endA*1.25/12.6)} лист(а), раскраивайте по месту, каналы вертикально.`);

function bWoodshed(v){

  xs.forEach(x=>{c.W('frame',[x,H,D],2); c.W('frame',[x,Hb,0],2);});
  const k=(H-Hb)/D, yR=z=>Hb+60+k*z;

  const pz=lin(-150,D+150,Math.max(2,Math.ceil((D+300)/600)+1)); pz.forEach(z=>{c.bar('20x20x2',[-150,yR(z)+30,z],[L+150,yR(z)+30,z],{name:'Прогон',ph:'roofing'}); xs.forEach(x=>c.W('roofing',[x,yR(z)+20,z]));});
  c.face('pn20',[[-200,yR(-200)+45,-200],[L+200,yR(-200)+45,-200],[L+200,yR(D+200)+45,D+200],[-200,yR(D+200)+45,D+200]],{ph:'roofing',name:'Профнастил'});
  const sl=(D+400)*Math.hypot(1,k); roofBuy(c,'pn20',{L:L+200,slope:sl,purlinLen:(L+300)*pz.length});

  else if(v.back==='bars') for(let y=450;y<Hb;y+=400){c.bar('20x20x2',[0,y,-20],[L,y,-20],{name:'Задняя связь',ph:'walls'}); xs.forEach(x=>c.W('walls',[x,y,0]));}

  c.step('floor','Пол',`Две лаги 40×20 на высоте 150 мм и перемычки 20×20 через 300 мм — дрова не лежат на земле и проветриваются.`);

function bGazebo(v){
  const c=ctx(v), L=v.L, B=v.B, H=v.H, ov=v.ov, roof=v.roof, BS=SEC['60x40x3'], RS=SEC[v.rs], dep=v.found==='conc'?800:0;
  const px=L>3500?[0,L/2,L]:[0,L], pz=B>3500?[0,B/2,B]:[0,B];

  posts.forEach(([x,z])=>c.post(v.ps,x,z,H,{dep}));

  [0,L].forEach(x=>c.bar('60x40x3',[x,H+BS.h/2,-60],[x,H+BS.h/2,B+60],{name:'Обвязка',ph:'beams'}));
  posts.forEach(([x,z])=>c.W('beams',[x,H,z],2));
  const tg=Math.tan(v.ang*DEG), y0=H+BS.h+RS.h/2, rise=Math.min(L,B)/2*tg, apex=[L/2,y0+rise,B/2];
  const E=[[-ov,0,-ov],[L+ov,0,-ov],[L+ov,0,B+ov],[-ov,0,B+ov]].map(p=>{const d=Math.max(Math.abs(p[0]-L/2)/(L/2),Math.abs(p[2]-B/2)/(B/2)); return [p[0],y0-(d-1)*Math.min(L,B)/2*tg,p[2]];});
  const rf=[...E]; E.forEach((e,i)=>{const n=E[(i+1)%4]; const side=Math.hypot(n[0]-e[0],n[2]-e[2]); const k=side>3000?3:1; for(let j=1;j<=k;j++) rf.push(vlerp(e,n,j/(k+1)));});

  E.forEach(e=>c.W('rafters',[e[0],H+BS.h,e[2]],2));
  const lift=RS.h/2+40+6;
  [.3,.6].forEach(f=>{const R=E.map(e=>vadd(vlerp(e,apex,f),[0,RS.h/2+20,0])); R.forEach((p,i)=>{c.bar('40x20x2',p,R[(i+1)%4],{name:'Прогон',ph:'purlins',up:[0,1,0]}); c.W('purlins',p);});});
  let area=0; E.forEach((e,i)=>{const n=E[(i+1)%4]; const f=c.face(roof,[vadd(e,[0,lift,0]),vadd(n,[0,lift,0]),vadd(apex,[0,lift,0])],{ph:'roof',name:ROOFS[roof].n}); area+=f.area;});
  const hip=vlen(vsub(apex,E[0]));

  else if(ROOFS[roof].pcm){c.H('pcm4',Math.ceil(area/1e6*1.35/6.25)); c.H('twasher',Math.ceil(area/1e6*8));}
  else {c.H(ROOFS[roof].mch?'mch':'pn20',area/1e6*1.3); c.H('rscrew',Math.ceil(area/1e6*8)); c.H('ridge',4*hip/1000);}
  let railM=0;
  if(v.par!=='none'){const runs=[[[0,0,0],[L,0,0]],[[L,0,0],[L,0,B]],[[0,0,0],[0,0,B]],[[0,0,B],[L/2-500,0,B]],[[L/2+500,0,B],[L,0,B]]];
    runs.forEach(([a,b])=>{railM+=railRun(c,{A:a,B:b,hrH:900,infill:v.par,hr:'40x40x2',ph:'parapet',ps:'40x40x2',noStartPost:true,noEndPost:vlen(vsub(b,[L,0,B]))<1||vlen(vsub(b,[L,0,0]))<1||vlen(vsub(b,[0,0,B]))<1});});}
  c.L('gazebo',L*B/1e6); c.L('roofinst',area/1e6); if(dep) c.L('footing',c.info.footings);
  if(v.ang<ROOF_MIN[roof]) c.warn(`Уклон ${v.ang}° мал для «${ROOFS[roof].n}» (минимум ${ROOF_MIN[roof]}°).`);
  c.dim('front',[0,0,0],[0,H,0],`${H}`,-1);
  c.step('found','Разметка и столбы',`Прямоугольник ${L}×${B} мм, диагонали ${r1(Math.hypot(L,B))} мм. ${footTxt(c,v,dep,posts.length)} Высота столбов ${H} мм.`);
  c.step('beams','Обвязка','Трубы 60×40×3 по верху столбов, углы — внахлёст с проваркой, строго в уровень.');
  c.step('rafters','Шатёр',`В центре — «звезда»: короткий отрезок трубы 80×80 или пластина, к ней сходятся ${rf.length} стропил ${RS.n}: 4 ребра длиной ${r1(hip)} мм и промежуточные. Высота конька над обвязкой ${r1(rise)} мм, уклон ${v.ang}°. Поднимите звезду на временную стойку по центру и приваривайте стропила попарно крест-накрест.`);
  c.step('purlins','Обрешётка','Два кольца прогонов 40×20 по скатам.');
  if(railM) c.step('parapet','Ограждение',`Парапет 900 мм по периметру, вход шириной 1000 мм посередине передней стороны.`);
  c.step('roof','Кровля',ROOFS[roof].pc||ROOFS[roof].pcm?'Поликарбонат треугольниками по скатам, стыки на рёбрах закрыть угловым профилем, термошайбы через 300 мм.':`${ROOFS[roof].n}: раскрой треугольников по месту (отход ~30%), рёбра закрыть угловой планкой ${r1(4*hip)} мм.`);
  return c;
}

// минимальный прямоугольник, в который вписывается многоугольник (заготовка)
function minRect(pts){
  let best=null;
  for(let i=0;i<pts.length;i++){const a=pts[i], b=pts[(i+1)%pts.length], L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L<1) continue;

function toSpec(m){

    else if(p.kind==='arc'){const o={n:p.name,s:p.sec,pts:p.pts.map(P),st:st(p)}; if(p.nobuy) o.buy=false; if(p.inox) o.inox=true; sp.members.push(o);}
    else if(p.kind==='box'){const o={n:p.name,m:p.mat,p:P([p.x,p.y,p.z]),d:P([p.sx,p.sy,p.sz]),st:st(p)}; if(p.buyAs||!SOLID_MATS().includes(p.mat)) o.buy=false; sp.sheets.push(o);}
    else if(p.kind==='blk'){const o={n:p.name,m:p.mat,a:P(p.p1),b:P(p.p2),w:R(p.w),h:R(p.h),st:st(p)}; if(p.up) o.up=p.up.map(x=>Math.round(x*100)/100); if(p.buyAs) o.buy=false; sp.blocks.push(o);}
    else if(p.kind==='poly'){const o={n:p.name,m:p.mat,pts:p.poly.map(P),y:R(p.y),t:R(p.t),st:st(p)}; if(p.blankAB) o.blank=[R(p.blankAB[0]),R(p.blankAB[1]),R(p.blank||p.blankAB[0]*p.blankAB[1])]; if(p.buyAs) o.buy=false; sp.slabs.push(o);}

  m.steps.filter(s=>s.ph!=='paint').forEach(s=>sp.steps.push({t:s.t,d:s.d,after:!!s.after}));

function applyPatch(base,r){
  const sp=JSON.parse(JSON.stringify(base)), rm=(Array.isArray(r.remove)?r.remove:[]).map(x=>String(x||'').trim().toLowerCase()).filter(Boolean);

Правила для варианта Б:
— Координаты в целых мм. y — вверх (пол или земля y=0), x — слева направо, z — к зрителю. Изделие начинается от x=0, z=0 (стены можно ставить в минус).
— members — ОСЕВЫЕ линии труб, уголков, полос, прутков (металл). s — сечение строго из списка. Длина детали = длина реза: перемычку между стойками 40×40 с осями x=20 и x=1480 ставь от x=40 до x=1460. Стыкующиеся детали касаются торцом — так программа найдёт сварные узлы. Детали не проходят друг сквозь друга. Деревянный поручень — s:"hrw" + в hw "hrwood" по длине.
— Готовые покупные металлические детали (тяги и стойки из нержавейки, кованые элементы, хромированные поручни) рисуй members с "buy":false, а цену дай строкой в hw. Нержавейка — "inox":true (серый цвет).
— У горизонтальной трубы большая сторона сечения вертикальна (60×40 — 60 по высоте); чтобы положить плашмя — "up":[0,0,1]. Угол реза, если не 90°, — "cut":"45°". Гнутые детали — вместо a/b "pts": [[x,y,z],…] от 6 до 30 точек.
— blocks — прямоугольные детали ПОД ЛЮБЫМ УГЛОМ: доски, брус, ступени, стойки из клеёного бруса, косоуры из дерева, полосы и пластины из листа. a→b — осевая линия по длине, w — ширина, h — толщина (h идёт по направлению "up", по умолчанию вверх; для вертикальной стойки h идёт по z). a и b — центры торцов (середина сечения): ступень толщиной 40 с верхом на y=450 — a и b на y=430. Повёрнутая в плане ступень — a и b на одной высоте, направление a→b в плане задаёт поворот. Материал m: дерево oak|ash|beech|larch|pine|wpc, сталь s2|s3|s4|s10|rif4 (h = толщина листа), бетон conc.
— slabs — плоские фигурные плиты в плане: забежные и клиновидные ступени, круглые столешницы, площадки, косынки. pts — контур [x,z] по порядку обхода, y — низ плиты, t — толщина. Круг — 24–32 точки.
— sheets — листы и плиты строго по осям: угол p, размеры d.
— panels — обшивка многоугольником из 3–4 точек: pn8 (профнастил стеновой), pn20 (кровельный), mch (металлочерепица), pc4|pc6|pc8|pc10 (сотовый поликарбонат), pcm4 (монолитный), mesh (сетка), glass (стекло), perfo (перфопанель).
— ghosts — окружение для наглядности, в смету не идёт: стены, пол второго этажа с проёмом, колонны дома. Добавь, если изделие крепится к стене или перекрытию — так видно, как оно стоит. Толщина стены 200, перекрытия 200.
— conc — бетонные опоры: p=[x,z], d — диаметр, dep — глубина.
— fx — анкеры, болты, петли, саморезы, отверстия, ролики: t = anchor|bolt|hinge|screw|hole|roller; k — ключ фурнитуры (попадёт в смету).
— hw — покупное: по ключу k из списка или своя позиция n, q, u и цена p в гривнах (Кривой Рог, ${new Date().getFullYear()}).
— labor — только работы, которых нет в автоматическом расчёте (программа сама считает изготовление металла по весу, сварные узлы, деревянные детали, бетон, монтаж и покраску): например монтаж тяг к перекрытию, сверление бетона под химанкер.
— steps — 3–10 шагов по порядку: разметка и нарезка, сборка узлов, сварка, монтаж, дерево. Покраску не пиши — программа добавит. "after":true — шаг после покраски (дерево, обшивка, фурнитура). У каждой детали st — номер шага.
— dims — 2–4 главных размера: v = front (x-y) | side (z-y) | top (x-z).
— "mount":true — если монтаж на объекте (бетон, анкеры, стена, перекрытие).
— До 350 деталей всего. Конструкция реальная и прочная: раскосы и косынки где нужно, сечения под нагрузку. Ориентиры: стеллаж — стойки 40×40×2, полки 40×20×2; стол — ноги 60×60×2 или 80×40×3; подставка под бак 1000 л — стойки 80×80×3 с раскосами; лестница — подъём ступени 160–200 мм одинаковый, проступь 200–280, ширина марша от 600, ступени дерево 40 мм, тяги к перекрытию — пруток r12/r16 или нерж. тяга в hw. Под тяжёлую нагрузку — предупреждение в warn.

function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(p.length<3) return p;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]), lo=[], up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q);}
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
function solids(p){ // наборы 3D-точек: каждая — выпуклое тело

  if(p.kind==='blk'){const [x,u,z]=basis(vnorm(vsub(p.p2,p.p1)),p.up), o=[]; [p.p1,p.p2].forEach(e=>[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([i,j])=>o.push(vadd(e,vadd(vmul(u,i*p.h/2),vmul(z,j*p.w/2)))))); return [o];}
  if(p.kind==='box'){const o=[]; [0,p.sx].forEach(a=>[0,p.sy].forEach(b=>[0,p.sz].forEach(c=>o.push([p.x+a,p.y+b,p.z+c])))); return [o];}
  if(p.kind==='poly') return [p.poly.flatMap(([x,z])=>[[x,p.y,z],[x,p.y+p.t,z]])];
  if(p.kind==='cyl'){const o=[]; for(let i=0;i<16;i++){const a=i/16*2*Math.PI, x=p.x+Math.cos(a)*p.d/2, z=p.z+Math.sin(a)*p.d/2; o.push([x,p.y0,z],[x,p.y0+p.h,z]);} return [o];}
  return [];
}

/* ---------- Сборка ---------- */
function panelAsm(P){
  const St=M.steps, cur=St[step-1], pct=St.length>1?(step-1)/(St.length-1)*100:100;
  const used=new Map(); M.parts.filter(p=>p.step===step&&p.kind!=='ghost').forEach(p=>{const L=p.kind==='bar'||p.kind==='arc'?Math.round(p.cutLen||p.len):0, k=p.name+(L?' '+L:''); used.set(k,(used.get(k)||0)+1);});
  const chips=[...used]; const more=chips.length>16?chips.length-16:0;
  const fxe=fxCount(M.fx.filter(f=>f.step===step));
  P.innerHTML=`<div class="prog"><small>Шаг работы</small><b>${String(step).padStart(2,'0')}/${String(St.length).padStart(2,'0')}</b><div class="track"><i style="width:${pct}%"></i><u></u></div></div>
  <div class="stepnav"><button class="btn" type="button" id="sPrev"${step<=1?' disabled':''}>← Назад</button><button class="btn y" type="button" id="sNext"${step>=St.length?' disabled':''}>Дальше →</button></div>
  <div class="stepcard"><h3>${cur.t}</h3><p>${cur.d}</p>
    ${chips.length?`<p class="sub">Детали этого шага</p><div class="chips">${chips.slice(0,16).map(([n,q])=>`<span class="chip">${esc(n)}${q>1?' ×'+q:''}</span>`).join('')}${more?`<span class="chip">ещё ${more}</span>`:''}</div>`:''}
    ${fxe.length?`<p class="sub">Узлы на этом шаге — цветные точки на 3D</p>${fxLegend(fxe)}`:''}
  </div>
  <ol class="steps">${St.map((s,i)=>`<li><button type="button" data-s="${i+1}"${i+1===step?' aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${s.t}</button></li>`).join('')}</ol>
  <p class="note">Оранжевым подсвечены детали текущего шага, полупрозрачно — уже сделанное. Точки сварки и анкеров видны сквозь детали.</p>`;
  const goS=s=>{step=s; applyVis(); $('#ovl').innerHTML=`<b>${step}</b><span>шаг<br>из ${St.length}</span>`; panelAsm(P);};
  $('#sPrev').onclick=()=>goS(step-1); $('#sNext').onclick=()=>goS(step+1);
  P.querySelector('.steps').onclick=e=>{const b=e.target.closest('[data-s]'); if(b) goS(+b.dataset.s);};
}

function sizeTxt(m){
  const v=m.v, k=m.key, [a,b,c]=m.size.map(Math.round);
  if(k==='fence') return `${fmt(v.L/1000)} м, высота ${v.H} мм`;
  if(k==='railing') return `${fmt(v.L/1000)} м, высота ${v.H} мм`;
  if(['gate_swing','gate_slide','wicket'].includes(k)) return `проём ${v.W}×${v.H} мм`;
  if(k==='spiral') return `Ø${v.D} мм, высота ${v.H} мм`;
  if(['stair2','stairm','stairL','porch'].includes(k)) return `высота ${v.H} мм, ширина ${v.W} мм`;
  if(k==='grille') return `${v.W}×${v.H} мм`;
  return `${a}×${c}×${b} мм`;
}

function summaryText(){

  L.push(`Материалы: ${money(M.matSum+M.markup)}`,`Работа: ${money(M.labSum)}`,`ИТОГО: ${money(M.total)}`);
  return L.join('\n');
}
function kpText(o){
  const L=[`Коммерческое предложение`,`Клиент: ${o.client}`]; if(o.address) L.push(`Адрес: ${o.address}`); L.push('');
  let tot=0;
  o.items.filter(it=>TPL[it.tpl]).forEach((it,i)=>{const m=itemCalc(it); tot+=m.total; L.push(`${i+1}. ${it.name}, ${it.size}`,`   ${it.mat}`,`   ${money(m.total)}`);});
  L.push('',`Итого: ${money(tot)}`,'В стоимость входят материалы, изготовление, покраска и монтаж. Срок — по согласованию.');
  return L.join('\n');
}

  try{navigator.clipboard.writeText(txt).then(()=>toast(ok),fallback);}catch(e){fallback();}
}

  const txt=JSON.stringify({app:'svarka',v:1,orders:Store.orders},null,1), name='svarka-zakazy-'+new Date().toISOString().slice(0,10)+'.json';
  const inFrame=window.self!==window.top;
  if(inFrame&&window.claude&&window.claude.use){window.claude.use('downloads').then(dl=>{if(!dl) return copyText(txt,'Данные скопированы — сохраните их в заметку или файл'); return dl.save({filename:name,data:txt}).then(()=>toast('Файл сохранён'),()=>copyText(txt,'Данные скопированы'));}); return;}
  if(!inFrame){try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Файл сохранён'); return;}catch(e){}}
  copyText(txt,'Данные скопированы — сохраните их в заметку или файл');
}
function importData(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=async()=>{try{const d=JSON.parse(r.result); if(d.app!=='svarka') throw 0; let n=0;
      for(const o of d.orders||[]){if(o&&o.kind==='order'&&o.id&&Array.isArray(o.items)){await Store.put(o); n++;}}
      toast(`Импортировано заказов: ${n}`);}catch(err){toast('Это не файл экспорта «Сварщика»');}};
  r.readAsText(f);
}
let tt=null;
function toast(msg){let el=$('.toast'); if(!el){el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200);}

/* ---------- Старт ---------- */
Store.load();
if(state.screen==='order'&&!Store.order(state.openOrder)) state.screen='orders';
renderCats(); renderTpls(); renderParams(); update(); go(state.screen);
Store.connect();
if('serviceWorker' in navigator&&window.self===window.top&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}

</script>
</body>
</html>
