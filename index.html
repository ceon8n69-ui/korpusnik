<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мастерская</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="application-name" content="Мастерская">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap">
<style>
:root{--bar:54px;--ink:#F2F1ED}
html,body{margin:0;height:100%;background:#111;overflow:hidden;-webkit-text-size-adjust:100%}
.top{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);background:#111;z-index:5}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:7px 10px 7px;max-width:720px;margin:0 auto}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 6px;border:2px solid #4a4a48;background:#111;color:var(--ink);font:700 15px/1 'Oswald','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap;overflow:hidden}
.tab i{width:10px;height:10px;flex:none;background:var(--c)}
.tab[aria-selected="true"]{background:var(--c);color:#111;border-color:var(--c);box-shadow:3px 3px 0 #F2F1ED}
.tab[aria-selected="true"] i{background:#111}
.tab:focus-visible{outline:3px solid var(--c);outline-offset:2px}
@media (max-width:360px){.tab{font-size:13px;letter-spacing:.02em}}
.frames{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--bar));bottom:env(safe-area-inset-bottom,0px);background:#F3F2EE}
@media (prefers-color-scheme:dark){.frames{background:#131313}}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
iframe[hidden]{display:none}
</style>
</head>
<body>
<header class="top"><nav class="tabs" role="tablist" aria-label="Приложения">
  <button class="tab" type="button" role="tab" data-t="mebel" style="--c:#F5B400"><i></i>Корпусник</button>
  <button class="tab" type="button" role="tab" data-t="svarka" style="--c:#FF7A1A"><i></i>Сварка</button>
  <button class="tab" type="button" role="tab" data-t="plitka" style="--c:#2DB8C9"><i></i>Плитка</button>
</nav></header>
<main class="frames" id="frames"></main>
<script>
const SRC={mebel:'mebel/',svarka:'svarka/',plitka:'plitka/'}, NAME={mebel:'Корпусник',svarka:'Сварка',plitka:'Плитка'}, frames={};
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function show(t){
  if(!SRC[t]) t='mebel'; put('hub.tab',t);
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
  if(!frames[t]){const f=document.createElement('iframe'); f.src=SRC[t]; f.title=NAME[t]; f.setAttribute('allow','clipboard-write; web-share; microphone; camera'); document.getElementById('frames').appendChild(f); frames[t]=f;}
  Object.entries(frames).forEach(([k,f])=>{f.hidden=k!==t;});
  document.title=NAME[t]+' — Мастерская';
  try{history.replaceState(null,'','#'+t)}catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.t);});
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&SRC[e.data.tab]) show(e.data.tab);});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||get('hub.tab')||'mebel');
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
