    ${o.note?`<div class="callout">${esc(o.note)}</div>`:''}
    <div class="seg" role="group" aria-label="Статус">${STATUSES.map(([k,l])=>`<button type="button" data-st="${k}" aria-pressed="${o.status===k}">${l}</button>`).join('')}</div>
    <dl class="stats" style="margin:0"><div><dt>Изделий</dt><dd>${o.items.length}</dd></div><div><dt>Материалы</dt><dd>${Math.round(mat/1000*10)/10}<small>тыс</small></dd></div><div><dt>Итого</dt><dd>${Math.round(tot).toLocaleString('uk-UA')}</dd></div></dl>
    <h3 style="font-family:var(--f-d);font-size:22px;text-transform:uppercase;margin:4px 0 0">Изделия</h3>
    <div class="items">${o.items.length?o.items.map((it,i)=>`<div class="item"><span class="ic">${(TPL[it.tpl]||TPL.custom).icon}</span><div class="who"><b>${esc(it.name)}</b><small>${esc(it.size)} мм · ${esc(it.mat)}</small><span class="p">${money(calcs[i].total)}</span></div>
      <div class="acts"><button class="ib" type="button" data-openit="${it.id}" aria-label="Открыть ${esc(it.name)}">${ICON.edit}</button><button class="ib" type="button" data-delit="${it.id}" aria-label="Удалить ${esc(it.name)}">${ICON.trash}</button></div></div>`).join('')
      :'<div class="empty"><b>Пока пусто</b><p class="note">Откройте конструктор, настройте изделие и нажмите «Добавить в заказ».</p></div>'}</div>
    <button class="cta w" type="button" data-act="addItem"><span>Добавить изделие</span><i>${ICON.plus}</i></button>
    <div class="row"><button class="btn y" type="button" data-act="cutPdfOrder">${IC_PDF}PDF для распила — весь заказ</button><button class="btn" type="button" data-act="copyKP">${ICON.copy}КП текстом</button></div>
    <button class="linkdel" type="button" data-act="delOrder">Удалить заказ</button>
  </div>`;
}
$('#scrOrder').addEventListener('click',e=>{
  const o=Store.order(state.openOrder); if(!o) return; let t;
  if((t=e.target.closest('[data-st]'))){o.status=t.dataset.st; Store.put(o); return;}
  if((t=e.target.closest('[data-openit]'))){const it=o.items.find(i=>i.id===t.dataset.openit); if(!it) return;
    state.tpl=it.tpl; state.vals[it.tpl]=clone(it.vals); state.cat=TPL[it.tpl].cat; state.orderId=o.id; state.editItem=it.id; state.myName=['custom','free'].includes(it.tpl)&&it.name!==TPL[it.tpl].name?it.name:null; fHist=[]; state.sel=null; step=1; resetCam=true;
    renderCats(); renderTpls(); renderParams(); update(); go('editor'); return;}
  if((t=e.target.closest('[data-delit]'))){const it=o.items.find(i=>i.id===t.dataset.delit); if(!it) return;
    confirmSheet(`Удалить «${esc(it.name)}» из заказа?`,'Удалить',()=>{o.items=o.items.filter(i=>i.id!==it.id); if(state.editItem===it.id) state.editItem=null; Store.put(o);});}
});

/* ---------- Нижний лист ---------- */
function sheet(html,bind){const bg=$('#sheet'); $('#sheetC').innerHTML=`<button class="ib sheetx" type="button" data-close aria-label="Закрыть">✕</button>`+html; bg.hidden=false; bind&&bind($('#sheetC')); const f=$('#sheetC').querySelector('input,textarea')||$('#sheetC').querySelector('.sheetx'); if(f) f.focus();}
function closeSheet(){$('#sheet').hidden=true; $('#sheetC').innerHTML='';}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]')) closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet();});
function confirmSheet(text,label,fn){
  sheet(`<h2>Точно?</h2><p style="margin:0">${text}</p><div class="row"><button class="btn dng" type="button" id="cfOk">${label}</button><button class="btn" type="button" data-close>Отмена</button></div>`,
    c=>c.querySelector('#cfOk').onclick=()=>{closeSheet(); fn();});
}
function orderForm(o,onSave){
  const v=o||{client:'',phone:'',address:'',note:''};
  sheet(`<h2>${o?'Клиент':'Новый заказ'}</h2>
    <div class="f"><label for="of1">Клиент</label><div class="in"><input id="of1" autocomplete="name" value="${esc(v.client)}" placeholder="Имя и фамилия"></div></div>
    <div class="f"><label for="of2">Телефон</label><div class="in"><input id="of2" type="tel" autocomplete="tel" value="${esc(v.phone)}" placeholder="+380"></div></div>
    <div class="f"><label for="of3">Адрес</label><div class="in"><input id="of3" value="${esc(v.address)}" placeholder="Город, улица, дом"></div></div>
    <div class="f"><label for="of4">Заметка</label><div class="in"><textarea id="of4" rows="2" placeholder="Срок, пожелания, замеры">${esc(v.note)}</textarea></div></div>
    <p class="err" id="ofErr" hidden>Укажите имя клиента.</p>
    <button class="cta" type="button" id="ofOk"><span>${o?'Сохранить':'Создать заказ'}</span><i>${ICON.save}</i></button>
    <button class="btn" type="button" data-close>Отмена</button>`,
  c=>c.querySelector('#ofOk').onclick=()=>{
    const client=c.querySelector('#of1').value.trim(); if(!client){c.querySelector('#ofErr').hidden=false; c.querySelector('#of1').focus(); return;}
    const d=o||{id:uid('o'),kind:'order',status:'measure',created:Date.now(),items:[]};
    Object.assign(d,{client,phone:c.querySelector('#of2').value.trim(),address:c.querySelector('#of3').value.trim(),note:c.querySelector('#of4').value.trim()});
    closeSheet(); onSave(d);
  });
}
function pickOrder(after){
  const list=Store.orders.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  sheet(`<h2>В какой заказ?</h2><div class="pick">${list.map(o=>`<button class="ocard" type="button" data-po="${o.id}" style="box-shadow:none"><span class="init">${esc(initials(o.client))}</span><span class="who"><b>${esc(o.client)}</b><small>${o.items.length} ${plural(o.items.length,'изделие','изделия','изделий')} · ${stName(o.status)}</small></span></button>`).join('')}</div>
    <button class="cta" type="button" id="poNew"><span>Новый заказ</span><i>${ICON.plus}</i></button><button class="btn" type="button" data-close>Отмена</button>`,
  c=>{c.querySelector('.pick').onclick=e=>{const b=e.target.closest('[data-po]'); if(!b) return; closeSheet(); after(Store.order(b.dataset.po));};
     c.querySelector('#poNew').onclick=()=>orderForm(null,d=>{Store.put(d); after(d);});});
}

/* ---------- Действия ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, o=Store.order(state.openOrder);
  if(act==='saveItem'){const cur=state.orderId&&Store.order(state.orderId); if(cur) addToOrder(cur); else pickOrder(addToOrder);}
  else if(act==='pickOrder') pickOrder(d=>{state.orderId=d.id; state.editItem=null; save(); onStore();});
  else if(act==='openActive'){state.openOrder=state.orderId; go('order');}
  else if(act==='newOrder') orderForm(null,d=>{Store.put(d); state.openOrder=d.id; state.orderId=d.id; state.editItem=null; go('order');});
  else if(act==='toOrders') go('orders');
  else if(act==='editOrder'&&o) orderForm(o,d=>Store.put(d));
  else if(act==='delOrder'&&o) confirmSheet(`Удалить заказ «${esc(o.client)}» со всеми изделиями?`,'Удалить заказ',()=>{if(state.orderId===o.id){state.orderId=null; state.editItem=null;} Store.del(o); go('orders');});
  else if(act==='addItem'&&o){state.orderId=o.id; state.editItem=null; save(); go('editor');}
  else if(act==='copyKP'&&o) copyText(kpText(o),'КП скопировано');
  else if(act==='copyPhone'&&o) copyText(o.phone,'Телефон скопирован');
  else if(act==='copy') copyText(summaryText(),'Смета скопирована');
  else if(act==='saveMy') sheet(`<h2>Мой шаблон</h2><div class="f"><label for="myN">Название</label><div class="in"><input id="myN" value="${esc(state.myName||'')}" placeholder="Например: Шкаф в нишу 2 секции"></div></div><p class="err" id="myErr" hidden>Введите название.</p><button class="cta" type="button" id="myOk"><span>Сохранить</span><i>${ICON.save}</i></button><button class="btn" type="button" data-close>Отмена</button>`,
    c=>c.querySelector('#myOk').onclick=()=>{const n=c.querySelector('#myN').value.trim(); if(!n){c.querySelector('#myErr').hidden=false; return;}
      const ex=Store.tpls.find(t=>t.name===n); const d=ex||{id:uid('t'),kind:'tpl',created:Date.now()}; d.name=n; d.tpl=state.tpl; d.vals=clone(tv()); state.myName=n; state.cat='Мои'; closeSheet(); Store.put(d); renderCats(); renderTpls(); update(); toast('Шаблон сохранён');});
  else if(act==='export') exportData();
  else if(act==='pdf') openPdf('item');
  else if(act==='cutPdf') openCutPdf('item');
  else if(act==='pdfOrder'&&o) openPdf('order');
  else if(act==='cutPdfOrder'&&o) openCutPdf('order');
  else if(act==='photo') openPhoto();
  else if(act==='refBig'&&photoURL) sheet(`<h2>Референс</h2><img src="${photoURL}" alt="Фото-референс" style="width:100%;border:var(--bw) solid var(--ink)">`);
  else if(act==='refClose'){refImg=null; renderRef();}
  else if(act==='closeFree'){const k=state.prevTpl&&TPL[state.prevTpl]&&state.prevTpl!=='free'?state.prevTpl:'wardrobe'; state.tpl=k; state.cat=TPL[k].cat; state.myName=null; state.sel=null; resetCam=true; renderCats(); renderTpls(); renderParams(); update(); window.scrollTo({top:0,behavior:'smooth'});}
  else if(act==='toFree'){state.prevTpl=state.tpl; const v=M.v; state.vals.free={free:partsToFree(M),cm:v.cm,cdec:v.cdec,fm:v.fm,fdec:v.fdec,hnd:v.hnd}; fHist=[]; state.tpl='free'; state.cat='Мои'; state.myName=null; state.editItem=null; state.sel=null; resetCam=true; renderCats(); renderTpls(); renderParams(); update(); toast('Детали перенесены в свободный редактор');}
});

/* ---------- Тексты, копирование, экспорт ---------- */
function summaryText(){
  const v=M.v, L=[], [a,b,c]=M.size.map(Math.round);
  L.push(`${state.myName||M.T.name} ${a}×${b}×${c} мм`);
  L.push('Материал: '+matName(v.cm,v.cdec)+(M.parts.some(p=>p.grp==='front')&&v.fm?', фасады: '+matName(v.fm,v.fdec):'')+(hasSoft()?', обивка: '+FABRICS[v.fab].n+' '+FCOL[v.fcol].n:''),'');
  ['mat','metal','soft','svc','hw','labor'].forEach(s=>{const ls=M.lines.filter(l=>l.sec===s); if(!ls.length) return; L.push(SEC[s]+':'); ls.forEach(l=>L.push(`• ${l.name} — ${fmt(l.qty)} ${l.unit} = ${Math.round(l.sum)} грн`)); L.push('');});
  L.push(`Материалы и цех: ${money(M.matSum+M.markup)}`,`Работа: ${money(M.labSum)}`,`ИТОГО: ${money(M.total)}`);
  if(M.notes.length) L.push('',M.notes.join(' '));
  return L.join('\n');
}
function kpText(o){
  const L=[`Коммерческое предложение`,`Клиент: ${o.client}`]; if(o.address) L.push(`Адрес: ${o.address}`); L.push('');
  let tot=0;
  o.items.forEach((it,i)=>{const m=itemCalc(it); tot+=m.total; L.push(`${i+1}. ${it.name}, ${it.size} мм`,`   ${it.mat}`,`   ${money(m.total)}`);});
  L.push('',`Итого: ${money(tot)}`,'В стоимость входят материалы, фурнитура, изготовление и сборка. Срок — по согласованию.');
  return L.join('\n');
}
function copyText(txt,ok){
  const fallback=()=>sheet(`<h2>Скопируйте</h2><textarea class="copy" readonly>${esc(txt)}</textarea><button class="btn" type="button" data-close>Готово</button>`,c=>{const t=c.querySelector('textarea'); t.focus(); t.select();});
  try{navigator.clipboard.writeText(txt).then(()=>toast(ok),fallback);}catch(e){fallback();}
}
function exportData(){
  const txt=JSON.stringify({app:'korpusnik',v:3,orders:Store.orders,tpls:Store.tpls},null,1);
  if(inFrame&&window.claude&&window.claude.use){window.claude.use('downloads').then(dl=>{if(!dl) return copyText(txt,'Данные скопированы — сохраните их в заметку или файл'); return dl.save({filename:'korpusnik-zakazy-'+new Date().toISOString().slice(0,10)+'.json',data:txt}).then(()=>toast('Файл сохранён'),()=>copyText(txt,'Данные скопированы'));}); return;}
  if(!inFrame){try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download='korpusnik-zakazy-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Файл сохранён'); return;}catch(e){}}
  copyText(txt,'Данные скопированы — сохраните их в заметку или файл');
}
function importData(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=async()=>{try{const d=JSON.parse(r.result); if(d.app!=='korpusnik') throw 0; let n=0;
      for(const o of d.orders||[]){if(o&&o.kind==='order'&&o.id&&Array.isArray(o.items)){await Store.put(o); n++;}}
      for(const t of d.tpls||[]){if(t&&t.kind==='tpl'&&t.id) await Store.put(t);}
      toast(`Импортировано заказов: ${n}`);}catch(err){toast('Это не файл экспорта Корпусника');}};
  r.readAsText(f);
}
let tt=null;
function toast(msg){let el=$('.toast'); if(!el){el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200);}

/* ---------- Старт ---------- */
Store.load();
if(state.screen==='order'&&!Store.order(state.openOrder)) state.screen='orders';
renderCats(); renderTpls(); renderParams(); update(); go(state.screen);
Store.connect();
if('serviceWorker' in navigator&&window.self===window.top&&location.protocol==='https:'){navigator.serviceWorker.register('../sw.js').catch(()=>{});}
// внутри общего приложения: ссылки на другие вкладки переключают вкладку
document.addEventListener('click',e=>{const a=e.target.closest('a[data-ext]'); if(a&&window.self!==window.top&&a.dataset.ext){e.preventDefault(); parent.postMessage({tab:a.dataset.ext},'*');}});

</script>
</body>
