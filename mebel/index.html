<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>['gesturestart','gesturechange'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})})</script>
<title>Корпусник</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="application-name" content="Корпусник">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#111;z-index:60;pointer-events:none}
img{max-width:100%}
[hidden]{display:none!important}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: необрутализм мастерской — светлая бумага, чёрные рамки 2px, жёсткие тени, заголовки капсом, жёлтая главная кнопка с чёрным блоком-иконкой */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --soft:#ECEAE4; --ink:#111111; --muted:#5C5C5C; --hair:#D8D5CC;
  --yel:#F5B400; --yel-soft:#FFF1C2; --org:#FF5A1F; --on-yel:#111111; --ok:#1F7A45; --danger:#C62A1E; --mark:#111111;
  --fg:var(--ink); --line:var(--hair); --accent:var(--yel); --accent-soft:var(--yel-soft); --sunk:var(--soft);
  --f-d:'Oswald','Arial Narrow',Impact,sans-serif; --f-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'Oswald','Arial Narrow',sans-serif;
  --bw:2px; --sh:4px 4px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#F7BE16; --yel-soft:#3A300E; --org:#FF6B35; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#F7BE16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#F7BE16; --yel-soft:#3A300E; --org:#FF6B35; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#F7BE16; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 110px;-webkit-font-smoothing:antialiased}
@media (min-width:980px){body{padding-block:16px 48px}}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* верхняя панель */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);cursor:pointer;flex:none}
.ib:hover{background:var(--yel-soft)}
.ib[aria-pressed="true"]{background:var(--yel);color:var(--on-yel)}
.ib.plain{border-color:transparent;background:none}
.pip{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--org);border:2px solid var(--bg)}
.drawer{display:flex;flex-direction:column;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
.drawer button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;border-bottom:var(--bw) solid var(--ink);background:none;font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;text-align:left}
.drawer button:last-child,.drawer a:last-child{border-bottom:0}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:var(--bw) solid var(--ink);font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.drawer a:hover{background:var(--yel-soft);color:var(--ink)}
.drawer button:hover,.drawer button[aria-current="page"]{background:var(--yel);color:var(--on-yel)}

/* заголовок экрана */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero h1{font-family:var(--f-d);font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:.005em;margin:0;text-wrap:balance}
.hero p{margin:10px 0 0;color:var(--ink);opacity:.8;font-size:14px;max-width:60ch}
.sq{position:relative;width:38px;height:38px;flex:none;margin-top:30px}
.sq i{position:absolute;width:19px;height:19px}
.sq i:first-child{left:0;top:0;background:var(--yel)} .sq i:last-child{right:0;bottom:0;background:var(--ink)}
.hero .back{display:flex;gap:12px;align-items:flex-start}

/* раскладка */
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.layout{grid-template-columns:380px minmax(0,1fr);align-items:start}.side{position:sticky;top:12px}}
.side,.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:var(--bw) solid var(--ink);padding:14px}
.card.raise{box-shadow:var(--sh)}
.lbl{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}

/* карточка заказа (как маршрут) */
.route{display:grid;grid-template-columns:14px 1fr auto;gap:0 12px;align-items:start}
.route .pt{width:12px;height:12px;margin-top:4px} .route .pt.a{background:var(--org)} .route .pt.b{background:var(--ink)}
.route .ln{width:2px;margin-left:5px;border-left:2px dashed var(--ink);height:20px}
.route small{display:block;font-size:12px;color:var(--muted)}
.route b{font-weight:600;font-size:15px}
.route .btn{grid-row:1/4;grid-column:3;align-self:center}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
.btn:hover{background:var(--yel-soft)}
.btn.y{background:var(--yel);color:var(--on-yel)}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;align-items:stretch;width:100%;border:var(--bw) solid var(--ink);box-shadow:var(--sh);background:var(--yel);color:var(--on-yel);cursor:pointer;min-height:58px;padding:0;text-align:left}
.cta.o{background:var(--org)}
.cta.w{background:var(--surface);color:var(--ink)}
.cta span{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px;font-family:var(--f-d);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;text-align:center}
.cta i{width:58px;display:grid;place-items:center;background:#111;color:#fff;border-left:var(--bw) solid var(--ink);flex:none}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ctabar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.ctabar .cta{max-width:640px;margin:0 auto}
.cta-desk{display:none}
@media (min-width:980px){.ctabar{display:none}.cta-desk{display:block}}

/* выбор изделия */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 2px 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:6px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.cat[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px) and (max-width:979px){.tpls{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tpl{position:relative;display:flex;gap:9px;align-items:center;padding:9px 10px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:600;line-height:1.2;text-align:left;cursor:pointer;min-width:0}
.tpl svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.tpl[aria-pressed="true"]{background:var(--yel);color:var(--on-yel);box-shadow:var(--sh-s)}
.x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);font-size:13px;line-height:1;cursor:pointer;color:var(--ink)}

/* поля */
.params{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{display:flex;align-items:center;border:var(--bw) solid var(--ink);background:var(--surface)}
.in:focus-within{box-shadow:var(--sh-s)}
.in input,.in select,.in textarea{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 16px var(--f-b);padding:9px 10px;outline:none;font-variant-numeric:tabular-nums}
.in select{font-size:14px;padding-right:4px}
.in .u{padding-right:10px;color:var(--muted);font-size:12px;font-weight:600}
.f.wide{grid-column:1/-1}
.err{margin:10px 0 0;color:var(--danger);font-size:13px;font-weight:600}

/* секции своего корпуса */
.secs{display:flex;flex-direction:column;gap:12px}
.col{border:var(--bw) solid var(--ink)}
.colh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 10px;background:var(--ink);color:var(--bg);font-family:var(--f-d);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.colh button{background:none;border:0;color:var(--bg);cursor:pointer;font-size:12px;font-family:var(--f-b);font-weight:700;padding:4px 6px}
.zone{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) 30px;gap:6px;align-items:end;padding:8px;border-bottom:1px solid var(--hair)}
.zone:last-of-type{border-bottom:0}
.zone .in input,.zone .in select{font-size:14px;padding:7px 7px}
.zone label{font-size:11px;margin-bottom:2px}
.zone .del{height:36px;border:var(--bw) solid var(--ink);background:var(--surface);cursor:pointer;font-weight:700}
.zadd{display:block;width:100%;padding:8px;border:0;border-top:var(--bw) solid var(--ink);background:var(--soft);font-weight:700;font-size:13px;cursor:pointer}
.ztag{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px 0}

/* итог и полоса показателей */
.sum .big{font-family:var(--f-d);font-weight:700;font-size:42px;line-height:1;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.sum .cap{color:var(--muted);font-size:13px;margin-top:4px}
.sumrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--bw) solid var(--ink);background:var(--surface);margin-top:14px}
.stats>div{padding:10px 12px;min-width:0}
.stats>div+div{border-left:1px solid var(--hair)}
.stats dt{font-family:var(--f-d);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--f-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd small{font-size:13px;font-weight:500;margin-left:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border:var(--bw) solid var(--ink);background:var(--surface);font-family:var(--f-d);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--sh-s)}

/* 3D */
.viewer{position:relative;background:var(--soft);border:var(--bw) solid var(--ink);overflow:hidden;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:32px 32px}
.three{height:min(58vh,500px);min-height:320px;touch-action:pan-y}
.three canvas{display:block}
.ovl{position:absolute;left:12px;top:12px;min-width:66px;padding:6px 10px;background:var(--surface);border:var(--bw) solid var(--ink);text-align:center;pointer-events:none}
.ovl b{display:block;font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1}
.ovl span{display:block;font-size:12px;font-weight:600;line-height:1.15}
.vtools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.note{color:var(--muted);font-size:13px;margin:0}

/* панели */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-family:var(--f-d);font-weight:700;font-size:22px;text-transform:uppercase;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.tw{overflow-x:auto;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--bg);background:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
td.id{font-family:var(--f-d);font-weight:700;white-space:nowrap}
tr.sec td{background:var(--soft);font-family:var(--f-d);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
tr.tot td{font-family:var(--f-d);font-weight:700;font-size:17px;background:var(--yel);color:var(--on-yel)}
.sw{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.legend i.f{border-top:2px dashed var(--mark)} .legend i.h{border-top:1px dashed var(--muted)}

/* материал как карточка водителя */
.mats{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.ava{width:52px;height:52px;border-radius:50%;flex:none;border:3px solid var(--yel);box-shadow:inset 0 0 0 3px var(--surface)}
.mcard .who{flex:1;min-width:0}
.mcard b{display:block;font-weight:800;font-size:15px}
.mcard small{display:block;color:var(--muted);font-size:13px}
.plate{display:inline-block;margin-top:4px;padding:1px 7px;border:1.5px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em}

/* чертёж и раскрой */
.draw{overflow-x:auto;background:var(--surface);border:var(--bw) solid var(--ink);padding:8px}
.draw svg{display:block;width:100%;min-width:560px;height:auto}
.dw text{font-family:var(--f-d);font-weight:500;fill:var(--ink)}
.dw .ttl{font-weight:700;fill:var(--ink)}
.dw .c{fill:var(--soft);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.dw .hw{fill:var(--hair);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .f{fill:none;stroke:var(--org);stroke-width:1.8;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
.dw .fs{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.dw .mt{fill:var(--ink);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .sf{fill:var(--yel-soft);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.9}
.dw .h{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.dw .dim line{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .ext{stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.7}
.legend i.f{border-top-color:var(--org)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.sheet{background:var(--surface);border:var(--bw) solid var(--ink);padding:10px;min-width:0}
.sheet svg{display:block;width:100%;height:auto}
.sheet .cap{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.sv .sh{fill:var(--soft);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.sv .pc{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.sv .dv{fill:var(--surface)}
.sv text{font-family:var(--f-d);fill:var(--ink)}
.sv .hatch line{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.warn{color:var(--org);font-size:13px;font-weight:700;margin:0}

/* сборка */
.prog{border:var(--bw) solid var(--ink);background:var(--surface);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.prog small{grid-column:1/-1;font-family:var(--f-d);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.prog b{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.track{position:relative;height:2px;background:var(--ink)}
.track i{position:absolute;left:0;top:-2px;height:6px;background:var(--yel);border:1.5px solid var(--ink)}
.track u{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.stepnav{display:flex;gap:10px}
.stepnav .btn{flex:1;min-height:46px;font-family:var(--f-d);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.stepcard{background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:10px}
.stepcard h3{margin:0}
.stepcard p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border:1.5px solid var(--ink);background:var(--yel-soft)}
.sub{font-family:var(--f-d);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:var(--bw) solid var(--ink);background:var(--surface)}
.steps li+li{border-top:1px solid var(--hair)}
.steps button{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer;font-size:14px;font-weight:600}
.steps button span{font-family:var(--f-d);font-weight:700;min-width:24px;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--yel);color:var(--on-yel)}
.steps button[aria-current="step"] span{color:var(--on-yel)}
.fxl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fxl li{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;align-items:baseline;font-size:14px}
.fxl .dot{width:12px;height:12px;border-radius:50%;align-self:center;border:1.5px solid var(--ink)}
.fxl b{font-weight:700} .fxl .q{font-family:var(--f-d);font-weight:700;font-size:16px}
.fxl small{grid-column:2/4;color:var(--muted);font-size:12.5px;line-height:1.4}

/* цены, подсказки */
details.prices{background:var(--surface);border:var(--bw) solid var(--ink);padding:12px 14px}
details.prices summary{cursor:pointer;font-family:var(--f-d);font-weight:700;font-size:18px;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:12px}
.pgrid h4{grid-column:1/-1;margin:10px 0 0;font-family:var(--f-d);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.callout{border:var(--bw) solid var(--ink);border-left-width:8px;border-left-color:var(--yel);padding:9px 12px;background:var(--surface);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* заказы */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.olist{display:flex;flex-direction:column;gap:14px}
.ocard{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh);cursor:pointer;text-align:left;width:100%}
.ocard:hover{background:var(--yel-soft)}
.init{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--yel);color:var(--on-yel);font-family:var(--f-d);font-weight:700;font-size:19px;border:var(--bw) solid var(--ink)}
.ocard .who{flex:1;min-width:0}
.ocard b{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .sum2{font-family:var(--f-d);font-weight:700;font-size:20px;white-space:nowrap;text-align:right}
.st{display:inline-block;margin-top:5px;padding:1px 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--ink)}
.st.measure{background:var(--org);color:#111}.st.calc{background:var(--surface)}.st.work{background:var(--yel);color:#111}.st.done{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--bw) solid var(--ink)}
.seg button{padding:10px 4px;border:0;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.seg button+button{border-left:var(--bw) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--ink)}
.item .ic{width:46px;height:46px;flex:none;display:grid;place-items:center;border:var(--bw) solid var(--ink);background:var(--yel-soft)}
.item .ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}
.item .who{flex:1;min-width:0}
.item .p{display:block;margin-top:2px}
.item b{display:block;font-weight:800}
.item small{display:block;color:var(--muted);font-size:12.5px}
.item .p{font-family:var(--f-d);font-weight:700;font-size:18px;white-space:nowrap}
.item .acts{display:flex;gap:6px}
.item .acts .ib{width:38px;height:38px}
.empty{border:var(--bw) dashed var(--ink);padding:22px 16px;text-align:center;background:var(--surface)}
.empty b{display:block;font-family:var(--f-d);font-size:20px;text-transform:uppercase;margin-bottom:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:var(--bw) solid var(--danger);background:var(--surface);font-size:13px;font-weight:700}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.linkdel{align-self:flex-start;background:none;border:0;color:var(--danger);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;text-decoration:underline}

/* нижний лист */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetc{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border:var(--bw) solid var(--ink);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.sheetbg{align-items:center}.sheetc{border-bottom:var(--bw) solid var(--ink);box-shadow:6px 6px 0 var(--ink)}}
.sheetc h2{font-family:var(--f-d);font-weight:700;font-size:28px;text-transform:uppercase;margin:0;line-height:1}
.sheetc .f{display:block}
.pick{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;font-size:13px;font-weight:700;z-index:30;border:var(--bw) solid var(--ink)}
textarea.copy{width:100%;min-height:180px;font:12px var(--f-b);background:var(--surface);color:var(--ink);border:var(--bw) solid var(--ink);padding:8px}
.sync{font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)} .sync.on i{background:var(--ok)}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cardh .btn{min-height:34px;padding:6px 10px;white-space:nowrap}
.sheetc{position:relative}
.sheetx{position:absolute;top:12px;right:12px;width:40px;height:40px;font-size:18px;font-weight:700}
.sheetc h2{padding-right:48px}
.refthumb{position:absolute;right:12px;top:12px;width:92px}
.refthumb button:first-child{display:block;padding:0;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh-s);cursor:pointer;width:100%}
.refthumb img{display:block;width:100%;height:auto}
.refthumb .x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border:var(--bw) solid var(--ink);background:var(--surface);font-weight:700;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* экран не ездит вбок: без автозума полей, без горизонтального сдвига */
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{position:relative}
.in select,.zone .in input,.zone .in select,.fxrow .in select,.fxrow .in input,textarea.copy{font-size:16px}
</style>

</head>

<script>
/* ===== Расчётное ядро: материалы, шаблоны, движок корпусов, раскрой, смета ===== */
const r1=Math.round;
function plural(n,a,b,c){const m=n%10,h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;}
const DECORS={white:{n:'Белый',c:'#F2F2EE'},sonoma:{n:'Дуб сонома',c:'#D8BD8E'},craft:{n:'Дуб крафт',c:'#C9A06A'},ash:{n:'Ясень шимо',c:'#C9BBA5'},walnut:{n:'Орех',c:'#7B5639'},concrete:{n:'Бетон',c:'#A9AAA6'},graphite:{n:'Графит',c:'#4B5057'},black:{n:'Чёрный',c:'#26282B'}};
const PAINTS={white:{n:'Белая эмаль',c:'#F3F2EE'},ivory:{n:'Слоновая кость',c:'#EDE6D4'},grey:{n:'Светло-серый',c:'#CBCCC8'},sage:{n:'Шалфей',c:'#9EA892'},navy:{n:'Тёмно-синий',c:'#2E3A4E'},graphite:{n:'Графит',c:'#3F4448'},black:{n:'Чёрный мат',c:'#232427'}};
const MAT={
  dsp16:{n:'ДСП 16 мм',g:'ДСП ламинированная',t:16,L:2800,W:2070,trim:10,fin:'pvc',price:2350},
  dsp18:{n:'ДСП 18 мм',g:'ДСП ламинированная',t:18,L:2800,W:2070,trim:10,fin:'pvc',price:2650},
  mdf16:{n:'МДФ 16 мм',g:'МДФ под покраску',t:16,L:2800,W:2070,trim:10,fin:'paint',price:3100},
  mdf19:{n:'МДФ 19 мм',g:'МДФ под покраску',t:19,L:2800,W:2070,trim:10,fin:'paint',price:3500},
  ply18:{n:'Фанера берёза 18 мм',g:'Фанера',t:18,L:1525,W:1525,trim:10,fin:'oil',price:1750,c:'#E5D2AA'},
  pine18:{n:'Щит сосна 18 мм',g:'Мебельный щит (массив)',t:18,L:3000,W:600,trim:0,fin:'oil',price:1650,c:'#E9C88F',grain:1},
  pine28:{n:'Щит сосна 28 мм',g:'Мебельный щит (массив)',t:28,L:3000,W:600,trim:0,fin:'oil',price:2500,c:'#E4C085',grain:1},
  ash20:{n:'Щит ясень 20 мм',g:'Мебельный щит (массив)',t:20,L:2400,W:600,trim:0,fin:'oil',price:5200,c:'#D5BC93',grain:1},
  beech20:{n:'Щит бук 20 мм',g:'Мебельный щит (массив)',t:20,L:2400,W:600,trim:0,fin:'oil',price:4900,c:'#D8A878',grain:1},
  oak20:{n:'Щит дуб 20 мм',g:'Мебельный щит (массив)',t:20,L:2400,W:600,trim:0,fin:'oil',price:6300,c:'#B78A57',grain:1},
  oak40:{n:'Щит дуб 40 мм',g:'Мебельный щит (массив)',t:40,L:2400,W:600,trim:0,fin:'oil',price:11800,c:'#B08350',grain:1},
  dvp:{n:'ДВП 3 мм',g:'',t:3,L:2800,W:2070,trim:0,fin:'none',price:560,c:'#B89F80'}
};
const FABRICS={velour:{n:'Велюр',price:350},rogozhka:{n:'Рогожка',price:300},chenille:{n:'Шенилл',price:420},eco:{n:'Экокожа',price:380},boucle:{n:'Букле',price:480}};
const FCOL={graphite:{n:'Графит',c:'#4A4D52'},grey:{n:'Серый',c:'#9A9C9E'},beige:{n:'Беж',c:'#D9CBB3'},milk:{n:'Молочный',c:'#EEE7DA'},olive:{n:'Оливковый',c:'#7D8256'},navy:{n:'Тёмно-синий',c:'#2F3B52'},mustard:{n:'Горчичный',c:'#C9A03C'},brick:{n:'Кирпичный',c:'#A65A3E'}};
const MAT_OPTS=Object.entries(MAT).filter(([k])=>k!=='dvp').map(([k,m])=>[k,m.n,m.g]);
const decList=mk=>!mk||!MAT[mk]?null:MAT[mk].fin==='pvc'?DECORS:MAT[mk].fin==='paint'?PAINTS:null;
const decOpts=mk=>{const d=decList(mk);return d?Object.entries(d).map(([k,x])=>[k,x.n]):null;};
const colorOf=(mk,dec)=>{const d=decList(mk);return d?(d[dec]||Object.values(d)[0]).c:MAT[mk].c;};
const matName=(mk,dec)=>{const d=decList(mk);return MAT[mk].n+(d&&d[dec]?' · '+d[dec].n:'');};
const FOPTS=[['same','Как основные фасады','']].concat(...Object.entries(MAT).filter(([k])=>k!=='dvp').map(([k,m])=>{const d=decList(k);return d?Object.entries(d).map(([dk,x])=>[k+'|'+dk,m.n+' · '+x.n,m.g]):[[k+'|',m.n,m.g]];}));
const splitF=f=>{if(!f||f==='same') return {}; const [fm,fdec]=f.split('|'); return MAT[fm]?{fm,fdec:fdec||undefined}:{};};

/* Крепёж: метки на 3D и строки в смете */
const FX={
  conf:{n:'Конфирмат 7×50',c:'#E5484D',p:'confirmat'},
  pin:{n:'Полкодержатель Ø5',c:'#3B82F6',p:'shelfpin',tip:'Отверстие Ø5 мм глубиной 10 мм, по 4 на полку.'},
  nail:{n:'Гвоздь 1,6×25 для ДВП',c:'#8B949E',p:'nail',tip:'Шаг 120–150 мм по периметру и по перегородкам.'},
  s16:{n:'Саморез 4×16',c:'#22C55E',p:'screw',tip:'Направляющие, опоры, фланцы. Без предварительного сверления.'},
  s25:{n:'Саморез 4×25',c:'#14B8A6',p:'screw',tip:'Изнутри короба в фасад или в профиль купе. Длина меньше толщины двух плит.'},
  s30:{n:'Саморез 4×30',c:'#06B6D4',p:'screw',tip:'Стягивает слои столешницы снизу, сетка около 300 мм.'},
  s50:{n:'Саморез 4×50',c:'#10B981',p:'screw50',tip:'Брус к царге кровати, шаг 300 мм. Сверлите пилот 3 мм.'},
  hinge:{n:'Петля с доводчиком',c:'#A855F7',p:'hinge',tip:'Чашка Ø35 мм глубиной 12–13 мм, центр в 22 мм от края двери. Планка — на боковину, 2 самореза 4×16.'},
  handle:{n:'Винт М4 под ручку',c:'#F97316',p:null,tip:'Отверстия Ø5 насквозь, межосевое по ручке (обычно 96 или 128 мм).'},
  corner:{n:'Уголок мебельный',c:'#EAB308',p:'corner',tip:'Уголок + 4 самореза 4×16. Сквозь лицевые плоскости ничего не крутите.'},
  tbr:{n:'Стяжка угловая для ножки',c:'#F43F5E',p:'tbracket',tip:'Пластина в пропилы царг, шпилька в ножку, затянуть гайкой.'},
  bolt:{n:'Стяжка кроватная',c:'#DC2626',p:'bedbolt',tip:'Сверло 10 мм под бочонок в царгу, 8 мм насквозь в изголовье.'},
  hanger:{n:'Навес мебельный',c:'#0EA5E9',p:'hanger',tip:'В верхние задние углы. К стене — на шину или дюбели 8×60.'},
  glide:{n:'Подпятник',c:'#64748B',p:'glide',tip:'Забивается в нижний торец, сверло 6 мм.'},
  push:{n:'Толкатель push-to-open',c:'#0F766E',p:null,tip:'Крепится на корпус напротив фасада, саморезы 4×16. Петли — без доводчика, для push-to-open.'},
  tie:{n:'Стяжка межсекционная',c:'#7C3AED',p:'tie',tip:'Сверло 5 мм насквозь через соседние боковины, по 4 на стык: 2 сверху, 2 снизу.'},
  clip:{n:'Клипса профиля LED',c:'#FACC15',p:null,tip:'Клипса на 2 самореза 3×12, шаг 40 см. Профиль защёлкивается сверху.'},
  hole:{n:'Отверстие под врезку',c:'#111827',p:null,tip:'Коронка нужного диаметра, сверлить с лицевой стороны.'},
  insert:{n:'Вставка резьбовая М6',c:'#D97706',p:'insert',tip:'Сверло 8 мм на глубину 15 мм — не насквозь, вкручивать шестигранником ровно.'},
  mark:{n:'—',c:'#000',p:null},
  weld:{n:'Сварной шов',c:'#FF7A00',p:null,tip:'Полуавтомат или электрод 3 мм. Прихватки по углам → проверка диагоналей → проварка. Швы зачистить болгаркой.'},
  smet:{n:'Саморез по металлу 4,2×25 со сверлом',c:'#0EA5E9',p:'screw_met',tip:'Шуруповёрт на малых оборотах, прижать плиту к профилю. Через плиту — без предварительного сверления.'},
  anchor:{n:'Анкер 10×100 к стене',c:'#7C2D12',p:null,tip:'Через приваренную пластину, сверло 10 мм по бетону/кирпичу на глубину 110 мм.'},
  staple:{n:'Скоба 10 мм',c:'#C084FC',p:null,tip:'Степлер мебельный. Ремень натяните на 5–8%, по 4 скобы на конец, край загните и прибейте ещё 2.'}

    [[60,60],[W-60,60],[60,D-60],[W-60,D-60]].forEach(([x,z])=>F('smet','shelves',x,y+20,z,'y'));});
  if(v.brace==='yes') ys.slice(0,-1).forEach((y,i)=>{const ym=(y+ys[i+1])/2; weldEnds(c,beam(c,{name:'Связь задняя',prof:'20x20',ax:'x',x:PP.w,y:ym,z:0,len:W-2*PP.w}));});

  F('anchor','install',PP.w/2,Hh-100,0,'z'); F('anchor','install',W-PP.w/2,Hh-100,0,'z'); c.H('anchor',2);

  const ring=(y,p2,name)=>{
    weldEnds(c,beam(c,{name,prof:p2,ax:'x',x:ov+PP.w,y,z:ov,len:fw-2*PP.w}));
    weldEnds(c,beam(c,{name,prof:p2,ax:'x',x:ov+PP.w,y,z:ov+fd-PROF[p2].w,len:fw-2*PP.w}));
    weldEnds(c,beam(c,{name,prof:p2,ax:'z',x:ov,y,z:ov+PP.h,len:fd-2*PP.h}));
    weldEnds(c,beam(c,{name,prof:p2,ax:'z',x:ov+fw-PROF[p2].w,y,z:ov+PP.h,len:fd-2*PP.h}));
  };
  ring(yr,pr,'Царга');
  if(v.low==='yes') ring(150,'20x20','Нижняя обвязка');

  for(let x=ov+150;x<W-ov;x+=350){F('smet','top',x,Hh-t,ov+10,'y');F('smet','top',x,Hh-t,ov+fd-10,'y');}
  [[ov+PP.w/2,ov+PP.h/2],[ov+fw-PP.w/2,ov+PP.h/2],[ov+PP.w/2,ov+fd-PP.h/2],[ov+fw-PP.w/2,ov+fd-PP.h/2]].forEach(([x,z])=>F('glide','top',x,0,z,'y'));
  c.size=[W,Hh,D];
  c.phases=[
    {ph:'metal',t:'Сварка подстолья',d:`4 ножки ${pr.replace('x','×')} высотой ${Hh-t} мм, царга по периметру ${fw}×${fd} мм${v.low==='yes'?', нижняя обвязка 20×20 на 150 мм':''}. Прихватки → диагонали → проварка → зачистка → грунт-эмаль.`},

  c.notes=[];
  return c;
}

  if(key==='custom'){v.cols=normCols(vals.cols); const dflt=!Array.isArray(vals.cols); v.cw=normNums(dflt?DEF_CW:vals.cw,v.cols.length,3000); v.ch=normNums(dflt?DEF_CH:vals.ch,v.cols.length,2800);}

  v.acc=normAcc(vals.acc);

}

/* Раскрой: полосовая укладка, с поворотом или без, со склейкой узких щитов */
function pack(pieces,mk,rotate){
  const M=MAT[mk], trim=M.trim, UL=M.L-2*trim, UW=M.W-2*trim, k=4;
  const items=[], glued=[];
  pieces.forEach(pc=>{
    let a=pc.L,b=pc.W;
    if(rotate){if(a<b)[a,b]=[b,a]; if(a>UL&&a<=UW&&b<=UL)[a,b]=[b,a];}
    let na=Math.ceil(a/UL), nb=Math.ceil(b/UW);
    if(na>1||nb>1) glued.push(pc.n);
    for(let i=0;i<na;i++) for(let j=0;j<nb;j++) items.push({n:pc.n,a:Math.ceil(a/na)+(na>1?10:0),b:Math.ceil(b/nb)+(nb>1?10:0),glue:na>1||nb>1});
  });
  items.forEach(it=>{it.a=Math.min(it.a,UL);it.b=Math.min(it.b,UW);});
  items.sort((x,y)=>y.b-x.b||y.a-x.a);
  const sheets=[];
  for(const it of items){
    let best=null;
    for(const sh of sheets) for(const st of sh.strips) if(st.h>=it.b&&st.used+it.a<=UL&&(!best||st.h<best.st.h)) best={sh,st};
    if(!best){
      let sh=sheets.find(s=>s.usedH+it.b<=UW);
      if(!sh){sh={strips:[],usedH:0,rects:[]};sheets.push(sh);}
      const st={y:sh.usedH,h:it.b,used:0}; sh.strips.push(st); sh.usedH+=it.b+k; best={sh,st};
    }
    best.sh.rects.push({x:trim+best.st.used,y:trim+best.st.y,w:it.a,h:it.b,n:it.n,glue:it.glue});
    best.st.used+=it.a+k;
  }
  sheets.forEach(s=>{s.util=s.rects.reduce((q,r)=>q+r.w*r.h,0)/(M.L*M.W);});
  return {sheets,glued:[...new Set(glued)]};
}

function compute(key,vals,opts,P){
  const T=TPL[key], v=normVals(key,vals);
  const m=T.custom?T.custom(v):buildCase(v,T.cfg(v));
  applyAcc(m,v);
  m.v=v; m.key=key; m.T=T; m.notes=(m.notes||[]).concat(T.note?[T.note]:[]);
  if(!m.err) for(const p of m.parts) if(!(p.sx>0&&p.sy>0&&p.sz>0)){m.err=`Размеры не сходятся: деталь «${p.name}» получилась нулевой. Увеличьте габариты.`;break;}
  // шаги: только те фазы, где есть детали или крепёж
  const used=new Set([...m.parts.map(p=>p.ph),...m.fx.map(f=>f.ph)]);
  m.steps=m.phases.filter(s=>used.has(s.ph)&&s.d);
  const idx={}; m.steps.forEach((s,i)=>idx[s.ph]=i+1);
  m.parts.forEach(p=>p.step=idx[p.ph]||1); m.fx.forEach(f=>f.step=idx[f.ph]||1);
  // деталировка
  const groups=[],gi=new Map();
  for(const p of m.parts){
    if(!p.mk) continue;
    const M=MAT[p.mk], d=[p.sx,p.sy,p.sz].map(r1).sort((a,b)=>b-a);
    const pvc=M.fin==='pvc', e2=pvc?p.edges.filter(e=>e[0]===2):[], e04=pvc?p.edges.filter(e=>e[0]===0.4):[];
    const dec=decList(p.mk)?p.dec:null;
    const kk=[p.mk,dec,p.name,d[0],d[1],e2.length,e04.length].join('|');
    let g=gi.get(kk);
    if(!g){g={mk:p.mk,dec,name:p.name,L:d[0],W:d[1],qty:0,grp:p.grp,e2:e2.length,e04:e04.length,e2len:e2.reduce((s,e)=>s+e[1],0),e04len:e04.reduce((s,e)=>s+e[1],0)};gi.set(kk,g);groups.push(g);}
    g.qty++;
  }
  const ord=g=>g.mk==='dvp'?2:g.grp==='front'?1:0;
  groups.sort((a,b)=>ord(a)-ord(b)); groups.forEach((g,i)=>g.n=i+1);
  m.groups=groups;
  // раскрой по материалам
  const sg=[],sm=new Map();
  for(const g of groups){const kk=g.mk+'|'+(g.dec||''); let s=sm.get(kk); if(!s){s={mk:g.mk,dec:g.dec,pieces:[]};sm.set(kk,s);sg.push(s);} for(let i=0;i<g.qty;i++) s.pieces.push({L:g.L,W:g.W,n:g.n});}
  sg.forEach(s=>Object.assign(s,pack(s.pieces,s.mk,s.mk==='dvp'?true:MAT[s.mk].grain?false:!opts.grain)));
  m.sheetGroups=sg;
  m.e2m=groups.reduce((s,g)=>s+g.e2len*g.qty,0)/1000*1.1;
  m.e04m=groups.reduce((s,g)=>s+g.e04len*g.qty,0)/1000*1.1;
  m.cutm=groups.reduce((s,g)=>s+(g.L+g.W)*g.qty,0)/1000;
  m.nPanels=groups.filter(g=>g.mk!=='dvp').reduce((s,g)=>s+g.qty,0);
  // крепёж
  m.fxCount={}; m.fx.forEach(f=>{if(f.type!=='mark') m.fxCount[f.type]=(m.fxCount[f.type]||0)+1;});
  // смета
  const lines=[]; const add=(sec,name,qty,unit,price)=>{if(qty>0) lines.push({sec,name,qty,unit,price,sum:qty*price});};
  sg.forEach(s=>add('mat',matName(s.mk,s.dec),s.sheets.length,MAT[s.mk].grain?'щит':'лист',P['m_'+s.mk]));
  add('mat','Кромка ПВХ 2 мм',Math.ceil(m.e2m),'м',P.edge2);
  add('mat','Кромка ПВХ 0,4 мм',Math.ceil(m.e04m),'м',P.edge04);
  add('svc','Раскрой на станке',Math.ceil(m.cutm),'м',P.cut);
  const finArea={};
  groups.forEach(g=>{const f=MAT[g.mk].fin; if(f==='paint'||f==='oil') finArea[f]=(finArea[f]||0)+2*g.L*g.W*g.qty/1e6;});
  const mp=m.parts.filter(p=>p.grp==='metal');
  m.metal=null;
  if(mp.length){
    const byP={}; mp.forEach(p=>{(byP[p.prof]=byP[p.prof]||[]).push(Math.round(p.len));});
    let totM=0,kg=0,area=0,cuts=0; const cutList=[];
    Object.entries(byP).forEach(([k,ls])=>{
      const PP=PROF[k]; ls.sort((x,y)=>y-x); const bars=[];
      ls.forEach(L=>{const b=bars.find(b=>b+L+3<=6000); if(b!==undefined) bars[bars.indexOf(b)]+=L+3; else bars.push(L);});
      const sum=ls.reduce((s,x)=>s+x,0); totM+=sum/1000; kg+=sum/1000*PP.kg; area+=sum/1000*2*(PP.w+PP.h)/1000; cuts+=ls.length;
      add('metal','Труба профильная '+PP.n+' (6 м)',bars.length,'шт',P['pr_'+k]*6);
      const cnt={}; ls.forEach(L=>cnt[L]=(cnt[L]||0)+1); Object.entries(cnt).sort((a,b)=>b[0]-a[0]).forEach(([L,q])=>cutList.push({prof:PP.n,L:+L,q}));
    });
    const welds=m.fxCount.weld||0;
    add('metal','Электроды / проволока',Math.max(1,Math.ceil(welds/40)),'кг',P.electrode);
    add('metal','Круги отрезные и зачистные',Math.ceil(cuts/10)+Math.ceil(welds/25),'шт',P.disc);
    add('metal','Грунт-эмаль 3в1 по металлу',Math.max(1,Math.ceil(area*0.2*2)),'л',P.paint_met);
    add('labor','Изготовление металлокаркаса',Math.ceil(totM*10)/10,'м',P.L_metal);
    add('labor','Сварка узлов',welds,'шт',P.L_weld);
    add('labor','Покраска металла',Math.ceil(area*10)/10,'м²',P.L_mpaint);
    m.metal={totM:Math.round(totM*10)/10,kg:Math.round(kg),area:Math.round(area*10)/10,cutList,welds};
  }
  if(m.fin) add('svc',m.fin.n,Math.ceil(m.fin.a*10)/10,'м²',P[m.fin.k]);
  if(finArea.paint) add('svc','Покраска МДФ эмалью (2 стороны)',Math.ceil(finArea.paint*10)/10,'м²',P.fin_paint);
  if(finArea.oil) add('svc','Шлифовка + масло/лак (2 стороны)',Math.ceil(finArea.oil*10)/10,'м²',P.fin_oil);
  const soft=m.parts.filter(p=>p.grp==='soft');
  if(soft.length){
    const byTh={}; let fa=0,foamA=0;
    soft.forEach(p=>{byTh[p.foam.th]=(byTh[p.foam.th]||0)+p.foam.area/1e6; fa+=p.fab/1e6; foamA+=p.foam.area/1e6;});
    Object.entries(byTh).sort((a,b)=>a[0]-b[0]).forEach(([th,a])=>add('soft',`Поролон ППУ ${th} мм, лист 1×2 м`,Math.ceil(a*1.15/2),'лист',2*th/1000*P.foam));
    add('soft',`Ткань: ${FABRICS[v.fab].n} · ${FCOL[v.fcol].n}, ширина 1,4 м`,Math.ceil(fa*1.3/1.4*10)/10,'м',P['fab_'+v.fab]);
    add('soft','Синтепон 200 г/м²',Math.ceil(fa*1.1/1.5*10)/10,'м',P.synt);
    add('soft','Клей для поролона',Math.ceil(foamA/4),'л',P.glue);
    add('soft','Скобы 10 мм, пачка 1000',Math.max(1,Math.ceil((fa*150+(m.fxCount.staple||0)*8)/1000)),'пачка',P.staple);
    m.fabArea=fa; m.labor.uph=Math.ceil(fa);
  }
  Object.entries(m.fxCount).forEach(([k,q])=>{const f=FX[k]; if(!f.p) return; const qq=['conf','pin','nail','s16','s25','s30','s50','smet'].includes(k)?Math.ceil(q*1.1):q; add('hw',f.n,qq,'шт',P[f.p]);});
  if(m.fxCount.conf) add('hw','Заглушка на конфирмат',m.fxCount.conf,'шт',P.plug);
  Object.entries(m.hw).forEach(([k,q])=>add('hw',HW[k][0]+(k==='slide'&&m.info.slideLen?`, ${m.info.slideLen} мм`:''),HW[k][1]==='м'?Math.ceil(q*10)/10:q,HW[k][1],P[k]));
  const LABU={uph:'м²',river:'м²',led:'м'}; Object.entries(m.labor).forEach(([k,q])=>add('labor',LABOR[k].replace(/, м²?$/,''),q,LABU[k]||'шт',P['L_'+k]));
  if(opts.drill&&!soft.length&&!m.info.river) add('labor','Присадка (сверловка)',m.nPanels,'дет',P.L_drill);
  if(P.delivery>0) add('labor','Доставка и подъём',1,'',P.delivery);
  m.lines=lines;
  const sum=f=>lines.filter(f).reduce((s,l)=>s+l.sum,0);
  m.matSum=sum(l=>l.sec!=='labor'); m.markup=m.matSum*P.markup/100; m.labSum=sum(l=>l.sec==='labor'); m.total=m.matSum+m.markup+m.labSum;
  return m;
}

const ovalPts=(x0,z0,L,D,n=56)=>{const r=D/2, out=[]; if(L<=D+1){for(let i=0;i<n;i++){const a=i/n*2*Math.PI; out.push([x0+L/2+L/2*Math.cos(a),z0+D/2+D/2*Math.sin(a)]);} return out;}
  for(let i=0;i<=n/2;i++){const a=-Math.PI/2+i/(n/2)*Math.PI; out.push([x0+L-r+r*Math.cos(a),z0+r+r*Math.sin(a)]);}
  for(let i=0;i<=n/2;i++){const a=Math.PI/2+i/(n/2)*Math.PI; out.push([x0+r+r*Math.cos(a),z0+r+r*Math.sin(a)]);} return out;};
function topPart(c,{x=0,z=0,y,W,D,name='Столешница',ph='top',shape='rect',pts}){

  if(shape==='rect') return c.P({name,x,y,z,sx:W,sy:t,sz:D,edges:pvc?e4(W,D):[],ph});
  const poly=pts||ovalPts(x,z,W,D); let per=0; for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length]; per+=Math.hypot(b[0]-a[0],b[1]-a[1]);}
  return c.P({name,shape:'poly',poly,x,y,z,sx:W,sy:t,sz:D,edges:pvc?[[2,Math.round(per)]]:[],ph,curved:true});
}

/* 7. Туалетный столик */
function buildVanity(v){
  const c=ctx(v),{t,P,F,H,Lb}=c, W=v.W, D=v.D, Hh=v.H, ah=170, n=v.drawers;
  const sub=buildCase(Object.assign({},v,{H:ah,base:'none'}),{base:{type:'none'},top:'overlay',back:true,cols:Array.from({length:n},()=>[{drawers:1}])});
  mergeSub(c,sub,0,Hh-ah,0);
  sub.parts.forEach(p=>{if(p.ph==='support') p.ph='case';}); c.fx=c.fx.filter(f=>f.type!=='glide');
  const ins=legInset(v);
  [[ins,ins],[W-ins,ins],[ins,D-ins],[W-ins,D-ins]].forEach(([x,z])=>{legP(c,{cx:x,cz:z,h:Hh-ah,w:45,ph:'legs',name:'Ножка'}); [[-10,-10],[10,10]].forEach(([a,b])=>F('s16','legs',x+a,Hh-ah,z+b,'y'));});
  H(legKey(v,'tleg'),4);
  if(v.mirror==='yes'){const mw=Math.min(W-120,900), mh=v.MH; P({name:'Зеркало',grp:'mirror',mk:null,x:(W-mw)/2,y:Hh+60,z:0,sx:mw,sy:mh,sz:6,ph:'mirror',color:'#C7D3DA'}); H('mirrorm2',Math.round(mw*mh/1e4)/100); F('anchor','mirror',W/2-mw/3,Hh+60+mh-40,6,'z'); F('anchor','mirror',W/2+mw/3,Hh+60+mh-40,6,'z');}
  Lb('legs');
  c.err=sub.err; c.info=Object.assign(c.info,sub.info);
  c.size=[W,v.mirror==='yes'?Hh+60+v.MH:Hh,D];
  c.phases=sub.phases.concat([
    {ph:'legs',t:'Ножки',d:`4 ножки (${legsTxt(v)}) высотой ${Hh-ah} мм под дно короба, по 4 самореза 4×16.`},
    {ph:'mirror',t:'Зеркало',d:v.mirror==='yes'?`Зеркало ${Math.min(W-120,900)}×${v.MH} мм на стену над столиком — на клей-герметик и 2 держателя.`:''}]);
  return c;
}

/* 8. Компьютерный угловой */
function buildTableCorner(v){
  const c=ctx(v),{t,P,F,H,Lb}=c, W=v.W, L2=v.L2, D=v.D, D2=v.D2, Hh=v.H, y=Hh-t, pvc=MAT[v.cm].fin==='pvc', e4p=(a,b)=>pvc?e4(a,b):[];
  // столешница: основная вдоль стены + крыло вдоль боковой стены
  P({name:'Столешница основная',x:0,y,z:0,sx:W-D2,sy:t,sz:D,edges:e4p(W-D2,D),ph:'top'});
  P({name:'Столешница: крыло',x:W-D2,y,z:0,sx:D2,sy:t,sz:L2,edges:e4p(D2,L2),ph:'top'});
  [D*.3,D*.7].forEach(z=>F('insert','top',W-D2,y-t/2,z,'x'));
  let x0=0, sub=null;
  if(v.ped!=='0'){const pw=420; sub=buildCase(Object.assign({},v,{W:pw,H:y,D:D-60,base:'none'}),{base:{type:'none'},top:'between',back:true,cols:[[{drawers:+v.ped}]]});
    mergeSub(c,sub,0,0,0); x0=pw; c.info=Object.assign(c.info,sub.info);}
  else P({name:'Опора-боковина',x:0,y:0,z:0,sx:t,sy:y,sz:D-40,edges:pvc?[[2,y],[2,D-40]]:[],ph:'base'});
  P({name:'Опора-боковина крыла',x:W-D2,y:0,z:L2-t-30,sx:D2-30,sy:y,sz:t,edges:pvc?[[2,y],[2,D2-30]]:[],ph:'base'});
  P({name:'Опора в углу',x:W-t-20,y:0,z:20,sx:t,sy:y,sz:D-40,edges:pvc?[[2,y],[2,D-40]]:[],ph:'base'});
  P({name:'Царга задняя',x:x0||t,y:y-350,z:40,sx:W-20-t-(x0||t),sy:350,sz:t,edges:pvc?[[0.4,W]]:[],ph:'base'});
  P({name:'Царга крыла',x:W-t-20-t,y:y-350,z:D,sx:t,sy:350,sz:L2-D-t-30,edges:pvc?[[0.4,L2-D]]:[],ph:'base'});
  [[x0+40,y-12,60],[W-D2-40,y-12,60],[W-D2+40,y-12,L2-60],[W-40,y-12,D/2]].forEach(([x,yy,z])=>F('corner','top',x,yy,z,'y'));
  Lb('table');
  if(v.side==='L'){c.parts.forEach(p=>{p.x=W-p.x-p.sx; if(p.poly) p.poly=p.poly.map(([x,z])=>[W-x,z]);}); c.fx.forEach(f=>f.x=W-f.x);}
  c.size=[W,Hh,L2];
  c.notes=[`Угловой ${W}×${L2} мм: основная часть ${W-D2}×${D}, крыло ${D2}×${L2} мм ${v.side==='L'?'слева':'справа'}${v.ped!=='0'?`, тумба с ${v.ped} ящиками`:''}.`];
  c.phases=(sub?sub.phases:[]).concat([
    {ph:'base',t:'Опоры и царги',d:`Боковины и опора в углу высотой ${y} мм, задние царги 350 мм — держат стол от расшатывания. Конфирматы и уголки.`},
    {ph:'top',t:'Столешница',d:`Основная часть и крыло стыкуются в углу на шкантах и стяжках снизу, затем крепятся к опорам уголками.`}]);
  return c;
}

    S('mount','Установка',[['wall','Пристенная'],['free','Отдельностоящая']],'wall'),S('foot','Подножка',[['yes','Есть'],['no','Нет']],'yes')]},
  vanity:C('Туалетный столик','Столы',[...dims([600,1400,1000],[700,800,760],[350,550,450]),N('drawers','Ящики в ряд',1,3,2,'шт'),S('mirror','Зеркало',[['yes','Есть'],['no','Нет']],'yes'),N('MH','Высота зеркала',300,1000,700,'мм',{when:v=>v.mirror==='yes'})],null,{custom:buildVanity}),
  tcorner:C('Стол компьютерный угловой','Столы',[N('W','Длина вдоль стены',1000,2200,1400),N('L2','Длина крыла',800,2000,1200),N('D','Глубина основной',500,800,600),N('D2','Глубина крыла',400,700,500),N('H','Высота',700,800,750),
    S('side','Крыло',[['R','Справа'],['L','Слева']],'R'),S('ped','Тумба',[['3','3 ящика'],['2','2 ящика'],['0','Без тумбы']],'3')],null,{custom:buildTableCorner})
});

<script>
/* ===== Интерфейс v3 ===== */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=n=>(Math.round(n*10)/10).toLocaleString('uk-UA');
const money=n=>Math.round(n).toLocaleString('uk-UA')+' грн';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ACCENT='#F7BE16';
const ICON={
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><path d="M8 8h12v12H8z"/><path d="M4 16V4h12"/></svg>',
  share:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v8h14v-8"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
  save:'<svg class="i" viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>',
  open:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>'
};
const STATUSES=[['measure','Замер'],['calc','Расчёт'],['work','В работе'],['done','Готово']];
const stName=k=>(STATUSES.find(s=>s[0]===k)||STATUSES[1])[1];
const initials=n=>(String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();

const state=Object.assign({tpl:'wardrobe',cat:'Спальня',vals:{},grain:false,drill:true,tab:'3d',screen:'editor',orderId:null,editItem:null,openOrder:null,filter:'all',myName:null},LS.get('korp3.state',{}));
if(!TPL[state.tpl]) state.tpl='wardrobe';
if(!CATS.includes(state.cat)) state.cat=TPL[state.tpl].cat;
let prices=Object.assign({},PRICE_DEF,LS.get('korp3.prices',{}));
let M=null, step=1, noFronts=false, showFx=false, dirty3D=true, resetCam=true;
const save=()=>LS.set('korp3.state',{tpl:state.tpl,cat:state.cat,vals:state.vals,grain:state.grain,drill:state.drill,tab:state.tab,screen:state.screen,orderId:state.orderId,editItem:state.editItem,openOrder:state.openOrder,filter:state.filter,myName:state.myName,fold:state.fold,prevTpl:state.prevTpl,rot3d:state.rot3d});
const tv=()=>state.vals[state.tpl]||(state.vals[state.tpl]={});
const hasSoft=()=>M&&M.parts.some(p=>p.grp==='soft');

/* ---------- Хранилище: аккаунт (db) или устройство ---------- */
const Store={mode:'local',orders:[],tpls:[],col:null,
  load(){const d=LS.get('korp3.data',{}); this.orders=d.orders||[]; this.tpls=d.tpls||[];},
  keep(){LS.set('korp3.data',{orders:this.orders,tpls:this.tpls});},
  async connect(){
    if(!window.claude||typeof window.claude.use!=='function') return;
    try{
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.col=db.collection('data/users/'+id); this.mode='db'; let first=true;
      this.col.onSnapshot(snap=>{
        const docs=snap.docs.map(d=>d.data()).filter(Boolean);
        if(first){first=false; if(snap.empty&&(this.orders.length||this.tpls.length)){this.upload(); return;}}
        this.orders=docs.filter(d=>d.kind==='order').map(clone); this.tpls=docs.filter(d=>d.kind==='tpl').map(clone);
        this.keep(); onStore();
      },()=>{this.mode='local'; onStore();});
      onStore();
    }catch(e){}
  },
  async upload(){for(const d of [...this.orders,...this.tpls]){try{await this.col.doc(d.id).set(clone(d));}catch(e){}}},
  async put(d){
    d.updated=Date.now(); const arr=d.kind==='order'?this.orders:this.tpls; const i=arr.findIndex(x=>x.id===d.id);
    if(i>=0) arr[i]=d; else arr.unshift(d); this.keep(); onStore();
    if(this.mode==='db'){try{await this.col.doc(d.id).set(clone(d));}catch(e){toast(e&&e.code==='quota_exceeded'?'Хранилище заполнено — удалите старые заказы':'Не удалось сохранить в аккаунт, сохранено на устройстве');}}
  },
  async del(d){
    const arr=d.kind==='order'?this.orders:this.tpls; const i=arr.findIndex(x=>x.id===d.id); if(i>=0) arr.splice(i,1); this.keep(); onStore();
    if(this.mode==='db'){try{await this.col.doc(d.id).delete();}catch(e){toast('Не удалось удалить в аккаунте');}}
  },
  order(id){return this.orders.find(o=>o.id===id)||null;}
};
function onStore(){
  $('#pip').hidden=!state.orderId||!Store.order(state.orderId);
  if(state.orderId&&!Store.order(state.orderId)&&Store.mode==='db'){state.orderId=null; state.editItem=null;}
  renderOrderBar(); renderCTA();
  if(state.screen==='orders') renderOrders();
  if(state.screen==='order') renderOrder();
  if(state.cat==='Мои') renderTpls();
}

/* ---------- Навигация ---------- */
function go(scr){
  state.screen=scr; save(); $('#drawer').hidden=true; $('#bMenu').setAttribute('aria-expanded','false');
  $('#scrEditor').hidden=scr!=='editor'; $('#scrOrders').hidden=scr!=='orders'; $('#scrOrder').hidden=scr!=='order';
  document.querySelectorAll('[data-nav]').forEach(b=>b.toggleAttribute('aria-current',false));
  const cur=document.querySelector(`[data-nav="${scr==='order'?'orders':scr}"]`); if(cur) cur.setAttribute('aria-current','page');
  if(scr==='orders') renderOrders();
  if(scr==='order') renderOrder();
  if(scr==='editor'){dirty3D=true; renderTab();}
  renderCTA(); window.scrollTo(0,0);
}
$('#bMenu').onclick=()=>{const d=$('#drawer'); d.hidden=!d.hidden; $('#bMenu').setAttribute('aria-expanded',String(!d.hidden));};
$('#bOrders').onclick=()=>state.orderId&&Store.order(state.orderId)?(state.openOrder=state.orderId,go('order')):go('orders');
$('#drawer').onclick=e=>{const b=e.target.closest('[data-nav]'); if(!b) return; const n=b.dataset.nav;
  if(n==='mine'){state.cat='Мои'; renderCats(); renderTpls(); go('editor'); return;}
  if(n==='photo'){go('editor'); openPhoto(); return;}
  if(n==='prices'){go('editor'); state.tab='est'; renderTab(); const d=$('details.prices'); if(d){d.open=true; d.scrollIntoView({block:'start'});} return;}
  go(n);};

/* ---------- Нижняя главная кнопка ---------- */
function ctaHTML(){
  if(state.screen==='editor'){
    const o=state.orderId&&Store.order(state.orderId);
    if(o&&state.editItem&&o.items.some(i=>i.id===state.editItem)) return `<button class="cta" type="button" data-act="saveItem"><span>Обновить в заказе</span><i>${ICON.refresh}</i></button>`;
    return `<button class="cta" type="button" data-act="saveItem"><span>${o?'Добавить в заказ':'Сохранить в заказ'}</span><i>${ICON.plus}</i></button>`;
  }
  if(state.screen==='orders') return `<button class="cta" type="button" data-act="newOrder"><span>Новый заказ</span><i>${ICON.plus}</i></button>`;
  if(state.screen==='order') return `<button class="cta o" type="button" data-act="pdfOrder"><span>PDF клиенту</span><i>${ICON.share}</i></button>`;
  return '';
}
function renderCTA(){const h=ctaHTML(); $('#ctaBar').innerHTML=h; $('#ctaDesk').innerHTML=state.screen==='editor'?h:'';}

/* ---------- Карточка заказа в редакторе ---------- */
function renderOrderBar(){
  const o=state.orderId&&Store.order(state.orderId);
  const ed=o&&state.editItem&&o.items.find(i=>i.id===state.editItem);
  $('#orderBar').innerHTML=o?`
    <span class="pt a"></span><div><small>Клиент</small><b>${esc(o.client)}</b></div><button class="btn" type="button" data-act="openActive">Заказ</button>
    <span class="ln"></span><span></span>
    <span class="pt b"></span><div><small>${ed?'Редактируется':'Изделий в заказе'}</small><b>${ed?esc(ed.name):o.items.length+' · '+money(orderTotal(o))}</b></div>`
  :`<span class="pt a"></span><div><small>Заказ</small><b>Не выбран</b></div><button class="btn" type="button" data-act="pickOrder">Выбрать</button>
    <span class="ln"></span><span></span>
    <span class="pt b"></span><div><small>Изделие сохранится в заказ клиента</small><b>${Store.orders.length?Store.orders.length+' '+plural(Store.orders.length,'заказ','заказа','заказов'):'Создайте первый заказ'}</b></div>`;
}

/* ---------- Выбор изделия ---------- */
const TABS=[['3d','3D'],['draw','Чертёж'],['mat','Материалы'],['cut','Раскрой'],['asm','Сборка'],['est','Смета']];
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" type="button" data-t="${k}">${l}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('.tab'); if(!b) return; state.tab=b.dataset.t; save(); renderTab();};
function renderCats(){$('#cats').innerHTML=CATS.map(c=>`<button class="cat" type="button" role="tab" data-c="${c}" aria-selected="${c===state.cat}">${c}</button>`).join('');}
$('#cats').onclick=e=>{const b=e.target.closest('.cat'); if(!b) return; state.cat=b.dataset.c; save(); renderCats(); renderTpls();};
function renderTpls(){
  let h=Object.entries(TPL).filter(([,T])=>T.cat===state.cat).map(([k,T])=>`<button class="tpl" type="button" data-k="${k}" aria-pressed="${k===state.tpl&&!state.myName}">${T.icon}<span>${T.name}</span></button>`).join('');
  if(state.cat==='Мои') h+=Store.tpls.map(t=>`<div style="position:relative"><button class="tpl" type="button" data-my="${t.id}" aria-pressed="${state.tpl===(t.tpl||'custom')&&state.myName===t.name}" style="width:100%">${(TPL[t.tpl]||TPL.custom).icon}<span>${esc(t.name)}</span></button><button class="x" type="button" data-delmy="${t.id}" aria-label="Удалить шаблон ${esc(t.name)}">×</button></div>`).join('');
  $('#tpls').innerHTML=h;
}
$('#tpls').onclick=e=>{
  const d=e.target.closest('[data-delmy]'); if(d){const t=Store.tpls.find(x=>x.id===d.dataset.delmy); if(t) confirmSheet(`Удалить шаблон «${esc(t.name)}»?`,'Удалить',()=>Store.del(t)); return;}
  const my=e.target.closest('[data-my]'); if(my){const t=Store.tpls.find(x=>x.id===my.dataset.my); if(!t) return; const k=TPL[t.tpl]?t.tpl:'custom'; state.tpl=k; state.vals[k]=clone(t.vals); state.myName=t.name; fHist=[]; state.sel=null; state.editItem=null; step=1; resetCam=true; renderTpls(); renderParams(); update(); return;}
  const b=e.target.closest('.tpl'); if(!b) return; const k=b.dataset.k; if(k===state.tpl&&!state.myName) return; if(k==='free'&&state.tpl!=='free') state.prevTpl=state.tpl;

/* ---------- Параметры ---------- */
function renderParams(){
  const vals=normVals(state.tpl,tv());
  $('#params').innerHTML=allParams(state.tpl).filter(p=>p.type!=='fixed').map(p=>{
    const id='p_'+state.tpl+'_'+p.k;
    if(p.type==='sel'){
      const o=(typeof p.opts==='function'?p.opts(vals):p.opts)||[], val=vals[p.k]; let h='',g=null;
      o.forEach(([ov,ol,gg])=>{if(gg!==undefined&&gg!==g){if(g!==null) h+='</optgroup>'; g=gg; h+=`<optgroup label="${gg}">`;} h+=`<option value="${ov}"${String(ov)===String(val)?' selected':''}>${ol}</option>`;});
      if(g!==null) h+='</optgroup>';
      return `<div class="f" data-k="${p.k}"><label for="${id}">${p.l}</label><div class="in"><select id="${id}" data-k="${p.k}">${h}</select></div></div>`;
    }
    const raw=tv()[p.k], val=raw!==undefined&&raw!==''?raw:vals[p.k];
    return `<div class="f" data-k="${p.k}"><label for="${id}">${p.l}</label><div class="in"><input id="${id}" data-k="${p.k}" type="number" inputmode="numeric" min="${p.min}" max="${p.max}" step="1" value="${val}"><span class="u">${p.u}</span></div></div>`;
  }).join('');
  applyWhen(vals); renderSecEd(); renderAccEd();
}
function applyWhen(vals){vals=vals||normVals(state.tpl,tv()); allParams(state.tpl).forEach(p=>{if(p.when){const el=$(`#params .f[data-k="${p.k}"]`); if(el) el.hidden=!p.when(vals);}});}
let timer=null;
$('#params').addEventListener('input',e=>{const k=e.target.dataset.k; if(!k||e.target.tagName==='SELECT') return; tv()[k]=e.target.value; clearTimeout(timer); timer=setTimeout(update,350);});
$('#params').addEventListener('change',e=>{
  const k=e.target.dataset.k; if(!k) return; const p=allParams(state.tpl).find(q=>q.k===k);
  if(p.type==='num'){const v=normVals(state.tpl,Object.assign({},tv(),{[k]:e.target.value}))[k]; e.target.value=v; tv()[k]=v;}
  else{tv()[k]=e.target.value; if(k==='sty'){const ks=new Set(allParams(state.tpl).map(q=>q.k)); Object.entries(styleSet(state.tpl,e.target.value)).forEach(([a,b])=>{if(ks.has(a)) tv()[a]=b;}); toast('Стиль «'+STY[e.target.value].n+'»: материалы, фасады и ножки подобраны');} renderParams();}
  clearTimeout(timer); update();
});

const fOptsHTML=sel=>{let h='',g=null; FOPTS.forEach(([v,l,gg])=>{if(gg!==g){if(g) h+='</optgroup>'; g=gg; if(gg) h+=`<optgroup label="${gg}">`;} h+=`<option value="${v}"${v===sel?' selected':''}>${l}</option>`;}); return h+(g?'</optgroup>':'');};
function addFold(box,key,extra=''){
  const h=box.querySelector('h2.lbl'); const title=h?h.textContent:''; if(h) h.remove();
  const folded=!!(state.fold&&state.fold[key]);

}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fold]'); if(!b) return; state.fold=state.fold||{}; state.fold[b.dataset.fold]=!state.fold[b.dataset.fold]; save(); renderSecEd(); renderAccEd();});

        <div class="f"><label for="z${i}_${j}h">Высота, мм</label><div class="in"><input id="z${i}_${j}h" data-zf="h" type="number" inputmode="numeric" min="0" max="2500" value="${z.h}"></div></div>
        <button class="del" type="button" data-delz aria-label="Удалить зону"${col.length<2?' disabled':''}>×</button>
        ${hasF?`<div class="f" style="grid-column:1/-1"><label for="z${i}_${j}f">Фасад этой зоны</label><div class="in"><select id="z${i}_${j}f" data-zf="f">${fOptsHTML(z.f)}</select></div></div>`:''}

  if(t.dataset.cw!==undefined){tv().cw[+t.dataset.cw]=Math.max(0,Math.round(+t.value||0)); renderSecEd(); update(); return;}
  if(t.dataset.ch!==undefined){tv().ch[+t.dataset.ch]=Math.max(0,Math.round(+t.value||0)); renderSecEd(); update(); return;}
  if(t.dataset.mf){const r=t.closest('.zone'); const m=tv()[r.dataset.r][+r.dataset.i]; m[t.dataset.mf]=t.dataset.mf==='k'?t.value:Math.round(+t.value||600); renderSecEd(); update(); return;}

$('#secEd').addEventListener('click',e=>{
  if(state.tpl==='free') return;

  if((t=e.target.closest('[data-addm]'))){const r=t.dataset.addm; tv()[r].push({k:r==='low'?'door':'up',w:600});}

/* ---------- Свободный редактор ---------- */
let fHist=[]; let fStep=10;
const fList=()=>tv().free;
const fSel=()=>(fList()||[]).find(p=>p.id===state.sel)||null;
function fChange(fn){fHist.push(JSON.stringify(fList())); if(fHist.length>40) fHist.shift(); fn(); update(); renderSecEd();}
const fBox=p=>freeBox(M?M.v:normVals('free',tv()),p);
function fSnap(ax,sgn){
  const p=fSel(); if(!p) return; const K=['x','y','z'],S=['sx','sy','sz'], A=fBox(p);
  let best=null;
  fList().forEach(q=>{ if(q.id===p.id) return; const B=fBox(q);
    const ok=[0,1,2].filter(k=>k!==ax).every(k=>Math.min(A[K[k]]+A[S[k]],B[K[k]]+B[S[k]])-Math.max(A[K[k]],B[K[k]])>0.5); if(!ok) return;
    const gap=sgn>0?B[K[ax]]-(A[K[ax]]+A[S[ax]]):A[K[ax]]-(B[K[ax]]+B[S[ax]]);
    if(gap>=-0.5&&(best===null||gap<best)) best=gap;});
  if(best===null){ if(ax===1&&sgn<0) best=A.y; else {toast('В этом направлении нет соседней детали'); return;} }
  if(Math.abs(best)<0.5){toast('Уже вплотную'); return;}
  fChange(()=>{p[K[ax]]=Math.round(p[K[ax]]+sgn*best);});
}
function fAdd(o){
  const s=fSel(), b=s?fBox(s):null, id='p'+Date.now().toString(36).slice(-6);
  const base=b||{x:0,y:0,z:0,sx:0,sy:720,sz:400};
  const p={id,o,role:o==='leg'?'leg':o[0]==='b'?'metal':'corpus',m:'body',hinge:'L',prof:'40x40',
    name:o==='v'?'Стойка':o==='h'?'Полка':o==='f'?'Панель':o==='by'?'Стойка металл':o[0]==='b'?'Балка металл':'Ножка',
    a:o==='v'||o==='by'?Math.round(Math.max(base.sy,300)):o==='h'||o==='bx'?400:o==='bz'?Math.round(Math.max(base.sz,300)):o==='f'?400:100,
    b:o==='v'||o==='h'?Math.round(Math.max(base.sz,100)):o==='f'?400:40,
    x:Math.round(base.x+base.sx+100),y:o==='leg'?0:Math.round(base.y),z:Math.round(base.z)};
  fChange(()=>{fList().push(p); state.sel=id;});
}

      ${fld('a',dims[0],p.a,'min="10" max="3200"')}${p.o!=='leg'&&p.o[0]!=='b'?fld('b',dims[1],p.b,'min="10" max="3200"'):'<div></div>'}
      ${fld('x','X — вправо',p.x)}${fld('y','Y — вверх',p.y)}${fld('z','Z — вперёд',p.z)}
      ${p.role==='door'?`<div class="f"><label for="ff_hinge">Петли</label><div class="in"><select id="ff_hinge" data-ff="hinge"><option value="L"${p.hinge==='L'?' selected':''}>Слева</option><option value="R"${p.hinge==='R'?' selected':''}>Справа</option></select></div></div>`:'<div></div>'}
    </div>
    <div style="padding:0 10px 10px;display:flex;flex-direction:column;gap:8px">
      <div class="f"><label for="ff_step">Шаг сдвига</label><div class="seg" id="ff_step" style="grid-template-columns:repeat(4,1fr)">${[1,10,50,100].map(s=>`<button type="button" data-fstep="${s}" aria-pressed="${s===fStep}">${s} мм</button>`).join('')}</div></div>
      <div class="seg" style="grid-template-columns:repeat(6,1fr)" aria-label="Сдвиг">${[['0,-1','←'],['0,1','→'],['1,-1','↓'],['1,1','↑'],['2,-1','Назад'],['2,1','Вперёд']].map(([d,l])=>`<button type="button" data-fmove="${d}" aria-label="Сдвиг ${l}">${l}</button>`).join('')}</div>

  <div class="steps" style="margin-top:12px;max-height:280px;overflow:auto">${list.map(q=>{const qb=freeBox(v,q);return `<button type="button" data-fpick="${q.id}"${q.id===state.sel?' aria-current="step"':''} style="border-top:1px solid var(--hair)"><span>${FORI[q.o][0]}</span>${esc(q.name||FORI[q.o])} <small style="margin-left:auto;font-weight:600;color:inherit;opacity:.7">${Math.round(qb.sx)}×${Math.round(qb.sy)}×${Math.round(qb.sz)}</small></button>`;}).join('')}</div>

  <div class="row" style="margin-top:12px"><button class="btn y" type="button" data-act="saveMy">${ICON.save}Сохранить как мой шаблон</button></div>`;
}
document.addEventListener('click',e=>{
  if(state.tpl!=='free') return; let t;
  if((t=e.target.closest('[data-fadd]'))) return fAdd(t.dataset.fadd);
  if((t=e.target.closest('[data-fpick]'))){state.sel=t.dataset.fpick; applyVis(); renderSecEd(); return;}
  if((t=e.target.closest('[data-fstep]'))){fStep=+t.dataset.fstep; renderSecEd(); return;}
  if((t=e.target.closest('[data-fmove]'))){const [ax,sg]=t.dataset.fmove.split(',').map(Number), p=fSel(); if(p) fChange(()=>{p[['x','y','z'][ax]]+=sg*fStep;}); return;}
  if((t=e.target.closest('[data-fsnap]'))){const [ax,sg]=t.dataset.fsnap.split(',').map(Number); fSnap(ax,sg); return;}
  if((t=e.target.closest('[data-fdo]'))){const d=t.dataset.fdo, p=fSel();

async function prepImage(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url;});
  const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
  URL.revokeObjectURL(url);
  const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',.85));
  const t=document.createElement('canvas'), tk=Math.min(1,320/Math.max(w,h)); t.width=Math.round(w*tk); t.height=Math.round(h*tk); t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
  return {blob,thumb:t.toDataURL('image/jpeg',.8),full:cv.toDataURL('image/jpeg',.85)};
}

async function askByKey(prompt,blob,onText,onRetry){
  const key=LS.get('korp3.apikey',''); if(!key) throw {code:'no_key'};
  const b64=await new Promise(ok=>{const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.readAsDataURL(blob);});
  onText&&onText('…');
  const body=JSON.stringify({model:'claude-opus-5-5',max_tokens:8000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]});
  for(let a=1;;a++){
    try{
      let res;
      try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body});}

}

function drawSVG(){
  const ps=M.parts.filter(p=>!(p.grp==='hw'&&p.name==='Ремень')&&!p.tmp&&p.grp!=='led'&&p.grp!=='acc');
  const nX=Math.min(...ps.map(p=>p.x)), mX=Math.max(...ps.map(p=>p.x+p.sx)), mY=Math.max(...ps.map(p=>p.y+p.sy)), nZ=Math.min(...ps.map(p=>p.z)), xZ=Math.max(...ps.map(p=>p.z+p.sz)), Wt=mX-nX, Dt=xZ-nZ;

  const mL=fs*4.2, mT=fs*3.2, chain=fs*5.2, gap=fs*2.5, mR=fs*1.5, mB=fs*5.6;
  const fx=mL-nX, sx0=mL+Wt+chain+gap, VW=sx0+Dt+mR, VH=mT+mY+mB;
  const Y=y=>mT+mY-y; const o=[];
  const rect=(x,y,w,h,c)=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  const tick=(x,y)=>`<line x1="${x-fs*.3}" y1="${y+fs*.3}" x2="${x+fs*.3}" y2="${y-fs*.3}"/>`;
  const dimH=(x1,x2,y,lab,ey)=>`<g class="dim"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>${tick(x1,y)}${tick(x2,y)}<text x="${(x1+x2)/2}" y="${y-fs*.35}" text-anchor="middle" font-size="${fs}">${lab}</text></g><line class="ext" x1="${x1}" y1="${ey}" x2="${x1}" y2="${y+fs*.4}"/><line class="ext" x1="${x2}" y1="${ey}" x2="${x2}" y2="${y+fs*.4}"/>`;
  const dimV=(x,y1,y2,lab,ex,fsz=fs)=>`<g class="dim"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>${tick(x,y1)}${tick(x,y2)}${lab!==''?`<text x="${x-fsz*.35}" y="${(y1+y2)/2}" text-anchor="middle" font-size="${fsz}" transform="rotate(-90 ${x-fsz*.35} ${(y1+y2)/2})">${lab}</text>`:''}</g><line class="ext" x1="${ex}" y1="${y1}" x2="${x-fs*.4}" y2="${y1}"/><line class="ext" x1="${ex}" y1="${y2}" x2="${x-fs*.4}" y2="${y2}"/>`;
  const leg=p=>/^(cylY|coneY|turnY)$/.test(p.shape)||p.name.startsWith('Ножка')||(p.grp==='hw'&&/^(Опора|Поворотная|Откидная|Подстолье|Кронштейн)/.test(p.name));
  o.push(`<text class="ttl" x="${mL}" y="${mT-fs*1.5}" font-size="${fs}">ВИД СПЕРЕДИ</text>`);
  ps.filter(p=>p.grp!=='back'&&p.grp!=='front'&&p.grp!=='mirror'&&p.grp!=='deco'&&!p.name.startsWith('Ящик')&&!p.name.startsWith('Ступень: д')&&(p.grp!=='hw'||leg(p))).sort((a,b)=>a.z-b.z)
    .forEach(p=>o.push(rect(fx+p.x,Y(p.y+p.sy),p.sx,p.sy,p.grp==='hw'?'hw':p.grp==='soft'?'sf':p.grp==='metal'?'mt':'c')));
  ps.filter(p=>p.grp==='front'||p.grp==='mirror'||p.grp==='deco').forEach(p=>o.push(rect(fx+p.x,Y(p.y+p.sy),p.sx,p.sy,'f')));
  o.push(dimH(mL,mL+Wt,Y(0)+fs*2.4,Math.round(Wt),Y(0)+fs*.4));
  o.push(dimV(mL-fs*2.2,Y(mY),Y(0),Math.round(mY),mL-fs*.4));
  const hz=[]; ps.filter(p=>p.grp==='corpus'&&p.mk&&Math.round(p.sy)===MAT[p.mk].t&&p.sx>=Wt*.5).sort((a,b)=>a.y-b.y).forEach(p=>{if(!hz.some(h=>Math.abs(h.y-p.y)<1)) hz.push(p);});
  if(hz.length>1){
    const cx=mL+Wt+fs*1.9; let prev=0; const segs=[];
    hz.forEach(h=>{if(h.y-prev>1) segs.push([prev,h.y]); prev=h.y+h.sy;});
    segs.forEach(([a,b])=>{const len=b-a; const f=len*.85<fs*2.2?Math.max(fs*.6,len*.38):fs*.85; o.push(dimV(cx,Y(b),Y(a),len>fs*1.2?Math.round(len):'',mL+Wt+fs*.4,f));});
  }
  const sx=z=>sx0+(z-nZ);
  o.push(`<text class="ttl" x="${sx0}" y="${mT-fs*1.5}" font-size="${fs}">ВИД СБОКУ</text>`);
  const visS=p=>p.x<=nX+.5||p.grp==='front'||p.grp==='soft'||(p.mk==='dvp'&&p.z<0)||leg(p);
  ps.filter(p=>!visS(p)&&p.grp!=='hw'&&p.grp!=='deco').forEach(p=>o.push(rect(sx(p.z),Y(p.y+p.sy),p.sz,p.sy,'h')));
  ps.filter(p=>visS(p)&&p.grp!=='soft'&&p.grp!=='deco').forEach(p=>o.push(rect(sx(p.z),Y(p.y+p.sy),p.sz,p.sy,p.grp==='front'?'fs':p.grp==='hw'?'hw':p.grp==='metal'?'mt':'c')));
  ps.filter(p=>p.grp==='soft').forEach(p=>o.push(rect(sx(p.z),Y(p.y+p.sy),p.sz,p.sy,'sf')));
  o.push(dimH(sx(nZ),sx(xZ),Y(0)+fs*2.4,Math.round(Dt),Y(0)+fs*.4));
  return `<svg class="dw" viewBox="0 0 ${Math.round(VW)} ${Math.round(VH)}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Чертёж: вид спереди и сбоку">${o.join('')}</svg>`;
}
function panelDraw(P){
  const fr=M.parts.filter(p=>p.grp==='front');
  const sizes=[...new Set(fr.map(p=>[p.sx,p.sy,p.sz].map(Math.round).sort((a,b)=>b-a).slice(0,2).join('×')))];
  P.innerHTML=`<div class="draw">${drawSVG()}</div>
  <div class="legend"><span><i></i>видимый контур</span>${fr.length?'<span><i class="f"></i>фасады</span>':''}<span><i class="h"></i>скрытые детали</span>${hasSoft()?'<span><span class="sw" style="background:var(--yel-soft)"></span>обивка</span>':''}</div>
  <p class="note">Размеры в мм. Справа от вида спереди — просветы между горизонтальными деталями.${sizes.length?` Фасады: ${sizes.join(', ')} мм, зазоры 3 мм.`:''}</p>`;
}

/* ---------- Материалы ---------- */
const edgeTxt=g=>[g.e2?`2 мм ×${g.e2}`:'',g.e04?`0,4 ×${g.e04}`:''].filter(Boolean).join(', ')||(MAT[g.mk].fin==='oil'?'шлифовка':MAT[g.mk].fin==='paint'?'покраска':'—');
function cutTable(){
  let rows='',cur='';
  M.groups.forEach(g=>{
    const sec=matName(g.mk,g.dec);
    if(sec!==cur){cur=sec; rows+=`<tr class="sec"><td colspan="6"><span class="sw" style="background:${colorOf(g.mk,g.dec)}"></span>${sec}</td></tr>`;}
    rows+=`<tr><td class="id">#${g.n}</td><td>${g.name}</td><td class="n">${g.L}</td><td class="n">${g.W}</td><td class="n">${g.qty}</td><td>${edgeTxt(g)}</td></tr>`;
  });
  return `<div class="tw"><table><thead><tr><th>№</th><th>Деталь</th><th class="n">Длина</th><th class="n">Ширина</th><th class="n">Шт</th><th>Кромка</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
const SEC={mat:'Плиты, щит, кромка',metal:'Металл',soft:'Мягкие материалы',svc:'Цех и отделка',hw:'Фурнитура и крепёж',labor:'Работа'};
function panelMat(P){

  ${notesHTML()}
  ${M.metal?`<h3>Нарезка профиля</h3><div class="tw"><table><thead><tr><th>Профиль</th><th class="n">Длина, мм</th><th class="n">Шт</th></tr></thead><tbody>${M.metal.cutList.map(c=>`<tr><td>${c.prof}</td><td class="n">${c.L}</td><td class="n">${c.q}</td></tr>`).join('')}</tbody></table></div><p class="note">Всего ${M.metal.totM} м профиля, ~${M.metal.kg} кг, ${M.metal.welds} сварных узлов, покраска ${M.metal.area} м². Хлысты по 6 м разложены с пропилом 3 мм.</p>`:''}
  ${M.groups.length?`<h3>Деталировка для цеха</h3>${cutTable()}`:''}`;

/* ---------- Раскрой ---------- */
function sheetSVG(sh,mk,i){
  const Mt=MAT[mk], id='h'+i+'_'+Math.random().toString(36).slice(2,6), fs=Math.max(Mt.L,Mt.W)*.026;
  let o=`<svg class="sv" viewBox="-6 -6 ${Mt.L+12} ${Mt.W+12}" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="${id}" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><g class="hatch"><line x1="0" y1="0" x2="0" y2="60"/></g></pattern></defs>
  <rect class="sh" x="0" y="0" width="${Mt.L}" height="${Mt.W}"/><rect x="0" y="0" width="${Mt.L}" height="${Mt.W}" fill="url(#${id})"/>`;
  sh.rects.forEach(r=>{
    o+=`<rect class="pc${mk==='dvp'?' dv':''}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"${r.glue?' stroke-dasharray="8 6"':''}/>`;
    const cx=r.x+r.w/2, cy=r.y+r.h/2;
    if(r.w>fs*4.5&&r.h>fs*2.4) o+=`<text x="${cx}" y="${cy-fs*.15}" text-anchor="middle" font-size="${fs}" font-weight="700">#${r.n}</text><text x="${cx}" y="${cy+fs*.95}" text-anchor="middle" font-size="${fs*.75}">${r.w}×${r.h}</text>`;
    else if(r.w>fs*1.6&&r.h>fs){const f=Math.min(fs,r.h*.75,r.w*.4); o+=`<text x="${cx}" y="${cy+f*.35}" text-anchor="middle" font-size="${f}" font-weight="700">#${r.n}</text>`;}
  });
  return o+'</svg>';
}
function panelCut(P){
  if(!M.sheetGroups.length){P.innerHTML='<p class="note">Для этого изделия нечего кроить.</p>';return;}
  let html=`<div class="row"><button class="btn y" type="button" data-act="cutPdf">${IC_PDF}PDF для распила</button></div><label class="chk"><input type="checkbox" id="cGrain"${state.grain?' checked':''}> Учитывать текстуру ДСП и фанеры (детали не поворачиваются)</label>
  <p class="note">Пропил 4 мм. Мебельный щит всегда кроится вдоль волокон. Раскрой примерный — для подсчёта плит; точную карту сделает цех.</p>`;
  let n=0;
  M.sheetGroups.forEach(s=>{
    const Mt=MAT[s.mk], q=s.sheets.length, w=Mt.grain?plural(q,'щит','щита','щитов'):plural(q,'лист','листа','листов');
    html+=`<h3>${matName(s.mk,s.dec)} — ${q} ${w}</h3><p class="note" style="margin-top:-8px">Формат ${Mt.L}×${Mt.W} мм</p>`;
    if(s.glued.length) html+=`<p class="warn">Шире или длиннее плиты — склеиваются из частей (пунктир): ${s.glued.map(x=>'#'+x).join(', ')}. Учтён припуск 10 мм на фугование.</p>`;
    html+=`<div class="sheets">${s.sheets.map((sh,i)=>`<div class="sheet">${sheetSVG(sh,s.mk,n++)}<div class="cap"><span>${Mt.grain?'Щит':'Лист'} ${i+1}</span><span>занято ${Math.round(sh.util*100)}%</span></div></div>`).join('')}</div>`;
  });
  html+=`<h3>Номера деталей</h3>${cutTable()}`;
  P.innerHTML=html;
  $('#cGrain').onchange=e=>{state.grain=e.target.checked; update();};
}

/* ---------- Сборка ---------- */
function panelAsm(P){
  const S=M.steps, cur=S[step-1], pct=S.length>1?(step-1)/(S.length-1)*100:100;
  const used=new Map(); M.parts.filter(p=>p.step===step&&p.grp!=='hw').forEach(p=>used.set(p.name,(used.get(p.name)||0)+1));
  const hwU=new Map(); M.parts.filter(p=>p.step===step&&p.grp==='hw').forEach(p=>hwU.set(p.name,(hwU.get(p.name)||0)+1));
  const fxs={}; M.fx.filter(f=>f.step===step).forEach(f=>fxs[f.type]=(fxs[f.type]||0)+1);
  const fxe=Object.entries(fxs);
  P.innerHTML=`<div class="prog"><small>Шаг сборки</small><b>${String(step).padStart(2,'0')}/${String(S.length).padStart(2,'0')}</b><div class="track"><i style="width:${pct}%"></i><u></u></div></div>
  <div class="stepnav"><button class="btn" type="button" id="sPrev"${step<=1?' disabled':''}>← Назад</button><button class="btn y" type="button" id="sNext"${step>=S.length?' disabled':''}>Дальше →</button></div>
  <div class="stepcard"><h3>${cur.t}</h3><p>${cur.d}</p>
    ${used.size?`<p class="sub">Детали</p><div class="chips">${[...used].map(([n,q])=>`<span class="chip">${n}${q>1?' ×'+q:''}</span>`).join('')}</div>`:''}
    ${hwU.size?`<p class="sub">Фурнитура</p><div class="chips">${[...hwU].map(([n,q])=>`<span class="chip">${n}${q>1?' ×'+q:''}</span>`).join('')}</div>`:''}
    ${fxe.length?`<p class="sub">Крепёж на этом шаге — цветные метки на 3D</p>${fxLegend(fxe)}`:''}
  </div>
  <ol class="steps">${S.map((s,i)=>`<li><button type="button" data-s="${i+1}"${i+1===step?' aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${s.t}</button></li>`).join('')}</ol>
  <p class="note">Жёлтым подсвечены детали текущего шага, полупрозрачно — уже собранное. Метки крепежа видны сквозь детали.</p>`;
  const goS=s=>{step=s; applyVis(); $('#ovl').innerHTML=`<b>${step}</b><span>шаг<br>из ${S.length}</span>`; panelAsm(P);};
  $('#sPrev').onclick=()=>goS(step-1); $('#sNext').onclick=()=>goS(step+1);
  P.querySelector('.steps').onclick=e=>{const b=e.target.closest('[data-s]'); if(b) goS(+b.dataset.s);};
}
