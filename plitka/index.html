<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Плитка</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#111;z-index:60;pointer-events:none}
img{max-width:100%}
[hidden]{display:none!important}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Плитка: тот же стиль мастерской, акцент — бирюза */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --soft:#ECEAE4; --ink:#111111; --muted:#5C5C5C; --hair:#D8D5CC;
  --yel:#2DB8C9; --yel-soft:#D5F1F4; --org:#F5B400; --wood:#E3C49A; --on-yel:#111111; --ok:#1F7A45; --danger:#C62A1E; --mark:#111111;
  --fg:var(--ink); --line:var(--hair); --accent:var(--yel); --accent-soft:var(--yel-soft); --sunk:var(--soft);
  --f-d:'Oswald','Arial Narrow',Impact,sans-serif; --f-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'Oswald','Arial Narrow',sans-serif;
  --bw:2px; --sh:4px 4px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#3CC7D7; --yel-soft:#10343A; --org:#F7BE16; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#3CC7D7; --wood:#6B5233; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1C1C1C; --soft:#262626; --ink:#F2F1ED; --muted:#A8A8A4; --hair:#363636;
  --yel:#3CC7D7; --yel-soft:#10343A; --org:#F7BE16; --on-yel:#111111; --ok:#5BD08B; --danger:#FF7A6E; --mark:#3CC7D7; --wood:#6B5233; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 110px;-webkit-font-smoothing:antialiased}
@media (min-width:980px){body{padding-block:16px 48px}}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* верхняя панель */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);cursor:pointer;flex:none}
.ib:hover{background:var(--yel-soft)}
.ib[aria-pressed="true"]{background:var(--yel);color:var(--on-yel)}
.ib.plain{border-color:transparent;background:none}
.pip{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--org);border:2px solid var(--bg)}
.drawer{display:flex;flex-direction:column;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
.drawer button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;border-bottom:var(--bw) solid var(--ink);background:none;font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;text-align:left}
.drawer button:last-child,.drawer a:last-child{border-bottom:0}
.drawer a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:var(--bw) solid var(--ink);font-family:var(--f-d);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.drawer a:hover{background:var(--yel-soft);color:var(--ink)}
.drawer button:hover,.drawer button[aria-current="page"]{background:var(--yel);color:var(--on-yel)}

/* заголовок экрана */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero h1{font-family:var(--f-d);font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:.005em;margin:0;text-wrap:balance}
.hero p{margin:10px 0 0;color:var(--ink);opacity:.8;font-size:14px;max-width:60ch}
.sq{position:relative;width:38px;height:38px;flex:none;margin-top:30px}
.sq i{position:absolute;width:19px;height:19px}
.sq i:first-child{left:0;top:0;background:var(--yel)} .sq i:last-child{right:0;bottom:0;background:var(--ink)}
.hero .back{display:flex;gap:12px;align-items:flex-start}

/* раскладка */
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.layout{grid-template-columns:380px minmax(0,1fr);align-items:start}.side{position:sticky;top:12px}}
.side,.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:var(--bw) solid var(--ink);padding:14px}
.card.raise{box-shadow:var(--sh)}
.lbl{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}

/* карточка заказа (как маршрут) */
.route{display:grid;grid-template-columns:14px 1fr auto;gap:0 12px;align-items:start}
.route .pt{width:12px;height:12px;margin-top:4px} .route .pt.a{background:var(--org)} .route .pt.b{background:var(--ink)}
.route .ln{width:2px;margin-left:5px;border-left:2px dashed var(--ink);height:20px}
.route small{display:block;font-size:12px;color:var(--muted)}
.route b{font-weight:600;font-size:15px}
.route .btn{grid-row:1/4;grid-column:3;align-self:center}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
.btn:hover{background:var(--yel-soft)}
.btn.y{background:var(--yel);color:var(--on-yel)}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;align-items:stretch;width:100%;border:var(--bw) solid var(--ink);box-shadow:var(--sh);background:var(--yel);color:var(--on-yel);cursor:pointer;min-height:58px;padding:0;text-align:left}
.cta.o{background:var(--org)}
.cta.w{background:var(--surface);color:var(--ink)}
.cta span{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px;font-family:var(--f-d);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;text-align:center}
.cta i{width:58px;display:grid;place-items:center;background:#111;color:#fff;border-left:var(--bw) solid var(--ink);flex:none}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ctabar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.ctabar .cta{max-width:640px;margin:0 auto}
.cta-desk{display:none}
@media (min-width:980px){.ctabar{display:none}.cta-desk{display:block}}

/* выбор изделия */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 2px 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:6px 12px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.cat[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px) and (max-width:979px){.tpls{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tpl{position:relative;display:flex;gap:9px;align-items:center;padding:9px 10px;border:var(--bw) solid var(--ink);background:var(--surface);font-size:13px;font-weight:600;line-height:1.2;text-align:left;cursor:pointer;min-width:0}
.tpl svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.tpl[aria-pressed="true"]{background:var(--yel);color:var(--on-yel);box-shadow:var(--sh-s)}
.x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--ink);font-size:13px;line-height:1;cursor:pointer;color:var(--ink)}

/* поля */
.params{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{display:flex;align-items:center;border:var(--bw) solid var(--ink);background:var(--surface)}
.in:focus-within{box-shadow:var(--sh-s)}
.in input,.in select,.in textarea{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 16px var(--f-b);padding:9px 10px;outline:none;font-variant-numeric:tabular-nums}
.in select{font-size:14px;padding-right:4px}
.in .u{padding-right:10px;color:var(--muted);font-size:12px;font-weight:600}
.f.wide{grid-column:1/-1}
.err{margin:10px 0 0;color:var(--danger);font-size:13px;font-weight:600}

/* секции своего корпуса */
.secs{display:flex;flex-direction:column;gap:12px}
.col{border:var(--bw) solid var(--ink)}
.colh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 10px;background:var(--ink);color:var(--bg);font-family:var(--f-d);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.colh button{background:none;border:0;color:var(--bg);cursor:pointer;font-size:12px;font-family:var(--f-b);font-weight:700;padding:4px 6px}
.zone{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) 30px;gap:6px;align-items:end;padding:8px;border-bottom:1px solid var(--hair)}
.zone:last-of-type{border-bottom:0}
.zone .in input,.zone .in select{font-size:14px;padding:7px 7px}
.zone label{font-size:11px;margin-bottom:2px}
.zone .del{height:36px;border:var(--bw) solid var(--ink);background:var(--surface);cursor:pointer;font-weight:700}
.zadd{display:block;width:100%;padding:8px;border:0;border-top:var(--bw) solid var(--ink);background:var(--soft);font-weight:700;font-size:13px;cursor:pointer}
.ztag{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px 0}

/* итог и полоса показателей */
.sum .big{font-family:var(--f-d);font-weight:700;font-size:42px;line-height:1;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.sum .cap{color:var(--muted);font-size:13px;margin-top:4px}
.sumrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--bw) solid var(--ink);background:var(--surface);margin-top:14px}
.stats>div{padding:10px 12px;min-width:0}
.stats>div+div{border-left:1px solid var(--hair)}
.stats dt{font-family:var(--f-d);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--f-d);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd small{font-size:13px;font-weight:500;margin-left:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border:var(--bw) solid var(--ink);background:var(--surface);font-family:var(--f-d);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--sh-s)}

/* 3D */
.viewer{position:relative;background:var(--soft);border:var(--bw) solid var(--ink);overflow:hidden;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:32px 32px}
.three{height:min(58vh,500px);min-height:320px;touch-action:pan-y}
.three canvas{display:block}
.ovl{position:absolute;left:12px;top:12px;min-width:66px;padding:6px 10px;background:var(--surface);border:var(--bw) solid var(--ink);text-align:center;pointer-events:none}
.ovl b{display:block;font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1}
.ovl span{display:block;font-size:12px;font-weight:600;line-height:1.15}
.vtools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.note{color:var(--muted);font-size:13px;margin:0}

/* панели */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-family:var(--f-d);font-weight:700;font-size:22px;text-transform:uppercase;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.tw{overflow-x:auto;border:var(--bw) solid var(--ink);background:var(--surface);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-family:var(--f-d);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--bg);background:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
td.id{font-family:var(--f-d);font-weight:700;white-space:nowrap}
tr.sec td{background:var(--soft);font-family:var(--f-d);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
tr.tot td{font-family:var(--f-d);font-weight:700;font-size:17px;background:var(--yel);color:var(--on-yel)}
.sw{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.legend i.f{border-top:2px dashed var(--mark)} .legend i.h{border-top:1px dashed var(--muted)}

/* материал как карточка водителя */
.mats{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.ava{width:52px;height:52px;border-radius:50%;flex:none;border:3px solid var(--yel);box-shadow:inset 0 0 0 3px var(--surface)}
.mcard .who{flex:1;min-width:0}
.mcard b{display:block;font-weight:800;font-size:15px}
.mcard small{display:block;color:var(--muted);font-size:13px}
.plate{display:inline-block;margin-top:4px;padding:1px 7px;border:1.5px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em}

/* чертёж и раскрой */
.draw{overflow-x:auto;background:var(--surface);border:var(--bw) solid var(--ink);padding:8px}
.draw svg{display:block;width:100%;height:auto}
.draw{padding:4px}
.dw text{font-family:var(--f-d);font-weight:500;fill:var(--ink)}
.dw .ttl{font-weight:700;fill:var(--ink)}
.dw .c{fill:var(--surface);stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dw .sf{fill:var(--yel-soft);fill-opacity:.45;stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke}
.dw .fs{fill:var(--wood);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .gl{stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke}
.dw .brk{fill:none;stroke:var(--danger);stroke-width:1.6;vector-effect:non-scaling-stroke}
.dw .mut,.sv .mut{fill:var(--muted)}
.draw+.draw{margin-top:0}
.wline{margin:0;padding:8px 10px;border:var(--bw) solid var(--ink);border-left:8px solid var(--yel);background:var(--yel-soft);font-size:13px;font-weight:600}
.wline+.wline{margin-top:8px}
.warnc{color:var(--danger);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.desc{margin:10px 0 0;font-size:13px;color:var(--muted)}
.dw .hw{fill:var(--hair);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .f{fill:none;stroke:var(--org);stroke-width:1.8;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
.dw .fs{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.dw .mt{fill:var(--ink);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .h{fill:var(--soft);fill-opacity:.5;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.dw .dim line{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.dw .ext{stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.7}
.legend i.f{border-top-color:var(--org)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.sheet{background:var(--surface);border:var(--bw) solid var(--ink);padding:10px;min-width:0}
.sheet svg{display:block;width:100%;height:auto}
.sheet .cap{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.sv .sh{fill:var(--soft);stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.sv .pc{fill:var(--yel-soft);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.sv .dv{fill:var(--surface)}
.sv text{font-family:var(--f-d);fill:var(--ink)}
.sv .hatch line{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.warn{color:var(--org);font-size:13px;font-weight:700;margin:0}

/* сборка */
.prog{border:var(--bw) solid var(--ink);background:var(--surface);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.prog small{grid-column:1/-1;font-family:var(--f-d);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.prog b{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.track{position:relative;height:2px;background:var(--ink)}
.track i{position:absolute;left:0;top:-2px;height:6px;background:var(--yel);border:1.5px solid var(--ink)}
.track u{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.stepnav{display:flex;gap:10px}
.stepnav .btn{flex:1;min-height:46px;font-family:var(--f-d);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.stepcard{background:var(--surface);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:10px}
.stepcard h3{margin:0}
.stepcard p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border:1.5px solid var(--ink);background:var(--yel-soft);color:var(--ink)}
.chip.ex{cursor:pointer;font:600 12.5px var(--f-b);text-align:left;padding:6px 9px;background:var(--surface)}
.chip.ex:hover{background:var(--yel-soft)}
.btn[aria-pressed="true"]{background:var(--yel);color:var(--on-yel)}

function steps(M){

  if(fxN('wc')||(bath&&v.opt.screen==='tile')) out.push({t:'Короб и экран',d:`${fxN('wc')?'Инсталляцию выставить и закрепить, короб — профиль + влагостойкий ГКЛ в 2 слоя (под плитку жёстко). ':''}${bath&&v.opt.screen==='tile'?'Ванну установить и выставить по уровню до плитки на стенах; экран — каркас из профиля + ГКЛВ, сразу заложите люк-невидимку под сифон.':''}`,s:'box'});
  if(walls.length){const lv=M.levelV, w0=walls[0];
    out.push({t:'Разметка стен',d:`Лазерным уровнем отбейте линию по всем стенам на высоте ${lv} мм от чернового пола — по ней крепится опорный профиль (рейка) под первый целый ряд. ${M.rows.mode==='bath'?'Линия идёт по борту ванны: целый ряд встаёт на ванну.':M.rows.mode==='top'?'Ряды считаются от верха облицовки: сверху целая плитка.':'Ряды идут от пола.'} Вертикали (отвес) — по стыку плиток: ${walls.map(w=>`${w.name.replace('Стена ','')} — ${r1(w.lines[1].at)} мм от левого угла`).join('; ')}.`,s:'walls'});

  }
  if(fl){const L=fl.lines||[];
    out.push({t:'Пол: маяки',d:fl.diag?`Диагональ 45°: от центра комнаты отбейте две оси под 45° к стенам. Первую целую плитку (М1) положите в центре по лазеру на уровень чистого пола (+${v.ft} мм).`:`Отбейте шнурами стартовые линии по швам: ${L[0]?r1(L[0].at):''} мм от левой стены и ${L[1]?r1(L[1].at):''} мм от задней. Плитки-маяки М1–М${fl.tiles.filter(x=>x.beacon).length} положите первыми на уровень чистого пола (+${v.ft} мм по лазеру): М1 — у пересечения линий, остальные — у углов. Между маяками натяните шнур — по нему весь пол.`,s:'floor'});

}

let timer=null;
function onField(e,commit){
  const k=e.target.dataset.k; if(!k) return;
  let x=e.target.value; const f=ALLF().find(q=>q.k===k);
  if(f&&f.type==='num'){if(x==='') return; x=Math.max(0,Math.round(+x)); if(!isFinite(x)) return;}
  else if(/wall$/.test(k)) x=+x;
  setP(st.v,k,x);
  if(/\.(size|rot|or)$/.test(k)) applySize(k[0]);
  if(k==='F.a'||k==='F.b'||k==='T.a'||k==='T.b'){}
  save();
  if(commit){if(f&&f.type!=='num'||/size|rot|or|floor|win\.on/.test(k)){renderSide(); } update();}
  else{clearTimeout(timer); timer=setTimeout(update,350);}
}

document.addEventListener('change',e=>{
  if(!e.target.closest('#side')) return;
  if(e.target.dataset.k) return onField(e,true);
  const row=e.target.closest('.fxrow'); if(row&&e.target.dataset.fx){const f=st.v.fx[+row.dataset.i], k=e.target.dataset.fx; f[k]=k==='t'?e.target.value:Math.max(0,Math.round(+e.target.value||0)); if(k==='wall'||k==='t'){$('#fxList').innerHTML=fxHTML();} save(); dirty3D=true; update();}
});
document.addEventListener('click',e=>{

  const d=e.target.closest('[data-fxdel]'); if(d){st.v.fx.splice(+d.dataset.fxdel,1); $('#fxList').innerHTML=fxHTML(); save(); dirty3D=true; update(); return;}
});

  M.fxs.forEach(x=>{const fm=fixtureModel(x), w=R.walls[x.f.wall]; G.add(fm); if(['boiler','rail'].includes(x.f.t)) w.objs.push(fm); else fm.children.filter(o=>o.userData.wall).forEach(o=>w.objs.push(o));});
  G.position.set(-v.L/2,0,-v.W/2);
  if(resetCam){const s=Math.max(v.L,v.W,v.H), vf=R.cam.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*(R.cam.aspect||1)), dist=.5*Math.hypot(v.L,v.W,v.H)/Math.sin(Math.min(vf,hf));
    const d=new THREE.Vector3(.55,.85,1).normalize(); R.cam.position.set(d.x*dist,v.H*.35+d.y*dist,d.z*dist); R.ctr.target.set(0,v.H*.35,0); R.cam.near=dist/100; R.cam.far=dist*20; R.cam.updateProjectionMatrix(); R.ctr.update(); resetCam=false;}
}

/* ---------- PDF ---------- */
const PDF_JS='https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js', PDF_FONTS='https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/vfs_fonts.js';
let pdfLib=null, pdfOut=null;
function loadPdfLib(){if(window.pdfMake&&pdfMake.vfs&&pdfMake.vfs['Roboto-Regular.ttf']) return Promise.resolve(); if(pdfLib) return pdfLib;
  const load=src=>new Promise((ok,no)=>{const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('load')); document.head.appendChild(s);});
  pdfLib=load(PDF_JS).then(()=>load(PDF_FONTS)).catch(e=>{pdfLib=null; throw e;}); return pdfLib;}
const nb=s=>String(s).replace(/[  ]/g,' '), pm=n=>nb(Math.round(n).toLocaleString('uk-UA'))+' грн';
const PDF_CSS='text{font-family:Arial,Helvetica,sans-serif;fill:#111}.ttl{font-weight:700}.t{fill:#fff;stroke:#999;stroke-width:1px;vector-effect:non-scaling-stroke}.tc{fill:#FFB27A;fill-opacity:.6;stroke:#111;stroke-width:1.2px;vector-effect:non-scaling-stroke}.tb{fill:#2DB8C9;stroke:#111;stroke-width:2px;vector-effect:non-scaling-stroke}.wl{fill:#222}.op{fill:#fff;stroke:#111;stroke-width:1.5px;vector-effect:non-scaling-stroke}.fx{fill:#fff;fill-opacity:.9;stroke:#111;stroke-width:2px;vector-effect:non-scaling-stroke}.fxl{fill:none;stroke:#111;stroke-width:1.4px;vector-effect:non-scaling-stroke}.ln{stroke:#D7262B;stroke-width:2.6px;stroke-dasharray:12 7;vector-effect:non-scaling-stroke;fill:none}.dr{fill:#fff;stroke:#D7262B;stroke-width:2px;vector-effect:non-scaling-stroke}.lt{fill:#D7262B;font-weight:700}.bt{font-weight:700}.ct{font-weight:600}.no{fill:#F1EFEA;stroke:#999;stroke-width:1px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}.dim line{stroke:#111;stroke-width:1.6px;vector-effect:non-scaling-stroke}.mut{fill:#777}';
async function svgToImg(svg,W=1800){const vb=svg.match(/viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"/), H=Math.round(W*(+vb[4])/(+vb[3]));
  const s=svg.replace(/<svg([^>]*)>/,`<svg$1 width="${W}" height="${H}"><style>${PDF_CSS}</style><rect x="${vb[1]}" y="${vb[2]}" width="100%" height="100%" fill="#fff"/>`);
  const img=new Image(); await new Promise((ok,no)=>{img.onload=ok; img.onerror=no; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);});
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.drawImage(img,0,0,W,H); return cv.toDataURL('image/jpeg',.9);}
function snap3D(W=1600,H=1100){
  init3D(); if(!R||R.fail) return null; const keepTab=st.tab, keepV=$('#viewer').hidden; $('#viewer').hidden=false; if(dirty3D){build3D(); dirty3D=false;}
  const r=R.renderer, cv=r.domElement, sz=new THREE.Vector2(); r.getSize(sz); const pr=r.getPixelRatio(), asp=R.cam.aspect, cp=R.cam.position.clone(), tp=R.ctr.target.clone();
  r.setPixelRatio(1); r.setSize(W,H,false); R.cam.aspect=W/H; R.cam.updateProjectionMatrix(); r.setClearColor(0xffffff,1);
  const v=st.v, vf=R.cam.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*W/H), dist=.44*Math.hypot(v.L,v.W,v.H)/Math.sin(Math.min(vf,hf)), d=new THREE.Vector3(.55,.85,1).normalize();
  R.cam.position.set(d.x*dist,v.H*.35+d.y*dist,d.z*dist); R.cam.lookAt(0,v.H*.35,0);
  const g=R.group.position, c=R.cam.position.clone().sub(g); R.walls.forEach(w=>{const s=w.n[0]*(c.x-w.p[0])+w.n[2]*(c.z-w.p[2]); w.objs.forEach(o=>o.visible=s>0);});
  r.render(R.scene,R.cam); const url=cv.toDataURL('image/jpeg',.9);
  R.cam.position.copy(cp); R.cam.lookAt(tp); r.setClearColor(0x000000,0); r.setPixelRatio(pr); r.setSize(Math.max(1,sz.x),Math.max(1,sz.y),false); R.cam.aspect=asp; R.cam.updateProjectionMatrix();
  $('#viewer').hidden=keepV; return url;}
const firm=()=>LS.get('plit1.firm',null)||LS.get('svar1.firm',null)||LS.get('korp3.firm',{name:'',phone:''});
async function pdfDoc(kind,meta){
  const v=st.v, title=`${$('#hTitle').textContent} ${v.L}×${v.W} мм`, date=new Date().toLocaleDateString('uk-UA');
  const keep={cuts:st.cuts,marks:st.marks};
  const head=(t,sub)=>({columns:[{text:meta.firm||'',bold:true,fontSize:11},{text:[{text:t+'\n',bold:true,color:'#1C8C9A'},{text:sub||date,fontSize:9,color:'#666'}],alignment:'right'}],margin:[0,0,0,6]});
  const hr={canvas:[{type:'line',x1:0,y1:0,x2:515,y2:0,lineWidth:2.5,lineColor:'#2DB8C9'}],margin:[0,0,0,10]};
  const content=[];
  if(kind==='client'){st.cuts=false; st.marks=false; dirty3D=true; const img=snap3D(); st.cuts=keep.cuts; st.marks=keep.marks; dirty3D=true;
    content.push(head('КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ',date),hr,{text:(meta.client?`Клиент: ${meta.client}\n`:''),fontSize:10},{text:title,fontSize:18,bold:true,margin:[0,4,0,2]},{text:`${v.floor==='yes'?`Пол — ${v.F.a}×${v.F.b}, ${PAT[v.F.pat].toLowerCase()}. `:''}${+v.wh>0?`Стены — ${v.T.a}×${v.T.b} до ${Math.min(v.wh,v.H)} мм.`:''} Плитки ${fmt(M.areaF+M.areaT)} м².`,fontSize:10,color:'#444',margin:[0,0,0,8]});
    if(img) content.push({image:img,width:515,margin:[0,0,0,10]});
    content.push({table:{widths:['*','auto'],body:[[{text:'Стоимость под ключ',bold:true,color:'#fff',fillColor:'#111'},{text:pm(M.total),bold:true,fontSize:14,fillColor:'#2DB8C9'}],['в том числе материалы и плитка',pm(M.matSum+M.markup)],['работа',pm(M.labSum)]]},layout:'noBorders',fontSize:10});
    content.push({text:'План пола',style:'h',pageBreak:'before'},{image:await svgToImg(planSVG()),width:515});
    const rows=[[{text:'Наименование',style:'th'},{text:'Кол-во',style:'th',alignment:'right'},{text:'Сумма',style:'th',alignment:'right'}]], k=1+prices.markup/100;
    ['tile','mix','hw','tool','labor'].forEach(s=>{const ls=M.lines.filter(l=>l.sec===s); if(!ls.length) return; rows.push([{text:SECN[s],colSpan:3,bold:true,fillColor:'#EEECE6'},'','']); ls.forEach(l=>rows.push([l.name,{text:`${fmt(l.qty)} ${l.unit}`,alignment:'right'},{text:pm(l.sum*(s==='labor'?1:k)),alignment:'right'}]));});
    rows.push([{text:'ИТОГО',bold:true,colSpan:2,fillColor:'#2DB8C9'},'',{text:pm(M.total),bold:true,alignment:'right',fillColor:'#2DB8C9'}]);
    content.push({text:'Материалы и работа',style:'h',pageBreak:'before'},{table:{headerRows:1,widths:['*','auto','auto'],body:rows},layout:'lightHorizontalLines',fontSize:9},{text:'Цены действительны 14 дней.',fontSize:8,color:'#666',margin:[0,8,0,0]});
  }else{
    content.push(head('РАСКЛАДКА И РЕЗКА',date),hr,{text:title,fontSize:18,bold:true},{text:`Пол ${v.floor==='yes'?`${v.F.a}×${v.F.b}, ${PAT[v.F.pat].toLowerCase()}, шов ${v.F.j} мм`:'—'} · стены ${+v.wh>0?`${v.T.a}×${v.T.b}, шов ${v.T.j} мм, до ${Math.min(v.wh,v.H)} мм`:'—'} · лазер / опорный профиль ${M.levelV} мм`,fontSize:9,color:'#444',margin:[0,2,0,8]});
    if(M.S.find(s=>s.id==='floor')) content.push({image:await svgToImg(planSVG()),width:480,alignment:'center'});
    const buy=(n,b,t)=>b?[n+` ${t.a}×${t.b}`,String(b.full),String(b.cutTiles),Math.round(b.res*100)+'%',String(b.withRes),`${b.boxes} × ${b.pbox}`,fmt(b.m2)]:null;
    content.push({table:{widths:['*','auto','auto','auto','auto','auto','auto'],body:[['Плитка','Целых','На резку','Запас','Итого шт','Упаковок','м²'].map(t=>({text:t,style:'th'})),...[buy('Пол',M.buyF,v.F),buy('Стены',M.buyT,v.T)].filter(Boolean)]},layout:'lightHorizontalLines',fontSize:9,margin:[0,8,0,0]});
    const ws=M.S.filter(s=>s.kind!=='floor');
    for(let i=0;i<ws.length;i++){content.push({image:await svgToImg(wallSVG(ws[i])),width:ws[i].kind==='wall'?480:300,alignment:'center',margin:[0,6,0,6],...(i===0||i%2===0?{pageBreak:'before'}:{})});}
    const cr=[[{text:'Плитка',style:'th'},{text:'Кусок, мм',style:'th'},{text:'Что это',style:'th'},{text:'Шт',style:'th',alignment:'right'},{text:'Где',style:'th'}]];
    M.cuts.forEach(c=>cr.push([c.tile==='F'?'Пол':'Стены',`${c.cw}×${c.ch}`,typeName(c),{text:String(c.q),alignment:'right'},whereTxt(c.where)]));
    content.push({text:'Резаные куски',style:'h',pageBreak:'before'},{table:{headerRows:1,widths:['auto','auto','*','auto','*'],body:cr},layout:'lightHorizontalLines',fontSize:9});
    if(Object.keys(M.drills).length) content.push({text:'Отверстия коронкой: '+Object.entries(M.drills).map(([d,q])=>`Ø${d} — ${q} шт`).join(', '),fontSize:10,margin:[0,8,0,0]});
    content.push({text:'Порядок работ',style:'h',margin:[0,14,0,6]},{ol:M.steps.map(s=>({text:[{text:s.t+'. ',bold:true},s.d],margin:[0,0,0,5]})),fontSize:9.5});
  }
  return {pageSize:'A4',pageMargins:[40,40,40,46],content,styles:{h:{fontSize:15,bold:true,margin:[0,0,0,8]},th:{bold:true,color:'#fff',fillColor:'#111'}},defaultStyle:{font:'Roboto',fontSize:10},
    footer:(p,n)=>({columns:[{text:meta.firm||'',fontSize:8,color:'#888'},{text:`стр. ${p} из ${n}`,alignment:'right',fontSize:8,color:'#888'}],margin:[40,12,40,0]})};
}
const fileName=s=>s.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.pdf';
function openPdf(kind){
  const f=firm();
  sheet(`<h2>${kind==='client'?'PDF клиенту':'PDF плиточнику'}</h2><p class="note" style="margin:0">${kind==='client'?'3D комнаты, план пола и смета с ценами.':'План с маяками и стартовыми линиями, развёртки стен с уровнем и подрезками, список резов, отверстия и порядок работ.'}</p>
    <div class="f"><label for="pfF">Фирма / мастер и телефон</label><div class="in"><input id="pfF" value="${esc(f.name||'')}" placeholder="Например: Плитка Кривой Рог, 067…"></div></div>
    ${kind==='client'?`<div class="f"><label for="pfC">Клиент</label><div class="in"><input id="pfC" placeholder="Имя"></div></div>`:''}
    <p class="note" id="pfStat" aria-live="polite"></p>
    <div class="row" id="pfDone" hidden><button class="cta" type="button" id="pfShare" style="flex:1"><span>Отправить</span><i>${IC_PDF.replace('class="i"','class="i" style="color:#fff"')}</i></button><a class="btn" id="pfDl" download>Скачать</a></div>
    <button class="cta w" type="button" id="pfGo"><span>Сделать PDF</span><i>${IC_PDF.replace('class="i"','class="i" style="color:#fff"')}</i></button>`,c=>{
    const stt=c.querySelector('#pfStat'), go=c.querySelector('#pfGo');
    c.querySelector('#pfShare').onclick=async()=>{if(!pdfOut) return; const file=new File([pdfOut.blob],pdfOut.fname,{type:'application/pdf'}); try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:pdfOut.fname}); return;}}catch(e){if(e&&e.name==='AbortError') return;} window.open(pdfOut.url,'_blank')||c.querySelector('#pfDl').click();};
    go.onclick=async()=>{const name=c.querySelector('#pfF').value.trim(); LS.set('plit1.firm',{name}); const cl=c.querySelector('#pfC'); go.disabled=true; stt.textContent='Собираю PDF…';
      try{await loadPdfLib(); const doc=await pdfDoc(kind,{firm:name,client:cl?cl.value.trim():''}); const blob=await new Promise((ok,no)=>{try{pdfMake.createPdf(doc).getBlob(ok);}catch(e){no(e);}});
        const fname=fileName(`${kind==='client'?'КП плитка':'Раскладка плитки'} ${cl&&cl.value.trim()?cl.value.trim()+' ':''}${new Date().toISOString().slice(0,10)}`);
        pdfOut={blob,fname,url:URL.createObjectURL(blob)}; const dl=c.querySelector('#pfDl'); dl.href=pdfOut.url; dl.download=fname; stt.textContent=`Готово: ${fname} · ${Math.max(1,Math.round(blob.size/1024))} КБ`; c.querySelector('#pfDone').hidden=false; go.hidden=true;}
      catch(e){stt.textContent='Не получилось: '+(e&&e.message==='load'?'нет связи — PDF-библиотека грузится из интернета.':(e&&e.message||'ошибка'));}
      finally{go.disabled=false;}};
  });
}

/* ---------- меню, листы, действия ---------- */
function sheet(html,bind){$('#sheetC').innerHTML=`<button class="ib sheetx" type="button" data-close aria-label="Закрыть">✕</button>`+html; $('#sheet').hidden=false; bind&&bind($('#sheetC'));}
function closeSheet(){$('#sheet').hidden=true; $('#sheetC').innerHTML='';}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]')) closeSheet();});
function toast(msg){let el=$('.toast'); if(!el){el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200);}
$('#bMenu').onclick=()=>{const d=$('#drawer'); d.hidden=!d.hidden; $('#bMenu').setAttribute('aria-expanded',String(!d.hidden));};
$('#drawer').addEventListener('click',e=>{
  const ext=e.target.closest('[data-ext]'); if(ext&&EMB){e.preventDefault(); parent.postMessage({tab:ext.dataset.ext},'*'); return;}
  const b=e.target.closest('[data-nav]'); if(!b) return; $('#drawer').hidden=true; const n=b.dataset.nav;
  if(n==='prices'){st.tab='est'; save(); renderTab(); const d=$('details.prices'); if(d){d.open=true; d.scrollIntoView({block:'start'});}}
  else if(n==='reset'){st.v=defaults(); save(); resetCam=true; renderSide(); update(); toast('Новая комната — параметры по умолчанию');}
  else window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'); if(!a) return; const k=a.dataset.act;
  if(k==='pdfClient') openPdf('client'); else if(k==='pdfWork') openPdf('work');
  else if(k==='copy'){const t=estText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Смета скопирована')).catch(()=>sheet(`<h2>Смета</h2><textarea class="copy" readonly>${esc(t)}</textarea>`));}
});
$('#bCuts').setAttribute('aria-pressed',st.cuts); $('#bMarks').setAttribute('aria-pressed',st.marks);
renderSide(); update();
